<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#68788a, #22252a); }
  body.black { background: #000; }
  body.grey { background: #808080; }
  body.white { background: #fff; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.moving { cursor: grabbing; }
  #message { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: rgba(255, 255, 255, 0.8);
             font: 14px "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="message"></div>
<script>
  "use strict";
  // A small WebGL 2 renderer for the meshes of a model: textured, lit from the camera, Z up as in the game.
  const canvas = document.getElementById("view");
  const message = document.getElementById("message");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: true, alpha: true });

  const meshes = new Map();      // id → { vao, count, lines, lineCount, material, min, max }
  const materials = new Map();   // id → { texture, glass, color }
  let visible = new Set();
  let showTextures = true;
  let wireframe = false;
  // The model's lights as markers: [{ vao, count, color, meshes }].
  let lights = [];
  let showLights = false;

  // --- Camera: orbits around a target ---
  const camera = { yaw: -0.6, pitch: 0.35, distance: 5, target: [0, 0, 0], fov: 45 * Math.PI / 180 };
  let sceneRadius = 1;

  if (!gl) {
    message.textContent = "This view needs WebGL 2, which this computer's graphics don't offer.";
  }

  // Skinned meshes (peds) move with up to four bones per vertex: the bones' matrices (from rest pose to
  // the pose shown) are in a float texture, four texels (columns) per bone.
  const VERTEX = `#version 300 es
    in vec3 position; in vec3 normal; in vec2 uv; in vec4 skinBones; in vec4 skinWeights;
    // Terrain: the coordinates of layers 1 and 2, of layer 3, how much each layer covers, the vertex colour.
    in vec4 layerUvA; in vec2 layerUvB; in vec4 layerWeights; in vec3 vertexColor;
    // See-through materials and decals: how much of each vertex shows.
    in float vertexAlpha;
    out vec2 vUv1; out vec2 vUv2; out vec2 vUv3; out vec4 vWeights; out vec3 vColor; out float vAlpha;
    uniform mat4 viewProjection; uniform bool skinned; uniform highp sampler2D boneMatrices;
    // A texture moved by an animation (map objects: signs, screens, flames): its texture matrix's two rows.
    uniform bool uvAnim; uniform vec3 uvRow0; uniform vec3 uvRow1;
    // A light's marker: made round the origin, put at the light, as large as the camera is far (the same
    // size on screen however near).
    uniform bool marker; uniform vec3 markerAt; uniform float markerScale;
    out vec3 vNormal; out vec2 vUv; out vec3 vPosition;
    mat4 bone(float i) {
      int b = int(i);
      return mat4(texelFetch(boneMatrices, ivec2(0, b), 0), texelFetch(boneMatrices, ivec2(1, b), 0),
                  texelFetch(boneMatrices, ivec2(2, b), 0), texelFetch(boneMatrices, ivec2(3, b), 0));
    }
    void main() {
      vec4 p = marker ? vec4(markerAt + position * markerScale, 1.0) : vec4(position, 1.0);
      vec3 n = normal;
      if (skinned) {
        mat4 m = bone(skinBones.x) * skinWeights.x + bone(skinBones.y) * skinWeights.y +
                 bone(skinBones.z) * skinWeights.z + bone(skinBones.w) * skinWeights.w;
        p = m * p;
        n = mat3(m) * n;
      }
      vNormal = n; vPosition = p.xyz; gl_Position = viewProjection * p;
      vUv = uvAnim ? vec2(dot(uvRow0, vec3(uv, 1.0)), dot(uvRow1, vec3(uv, 1.0))) : uv;
      vUv1 = layerUvA.xy; vUv2 = layerUvA.zw; vUv3 = layerUvB; vWeights = layerWeights; vColor = vertexColor; vAlpha = vertexAlpha;
    }`;

  const FRAGMENT = `#version 300 es
    precision highp float;
    in vec3 vNormal; in vec2 vUv; in vec3 vPosition;
    in vec2 vUv1; in vec2 vUv2; in vec2 vUv3; in vec4 vWeights; in vec3 vColor; in float vAlpha;
    uniform sampler2D tex; uniform bool useTexture; uniform bool hasNormal; uniform vec3 color;
    uniform vec3 light; uniform vec3 toEye; uniform float alpha; uniform bool lines; uniform bool cutout;
    // See-through by the texture's alpha (the see-through and decal buckets).
    uniform bool textureAlpha;
    // Bumps (a normal map, tangent space, its y the other way round as made for Direct3D) and shine (a
    // specular map's channels in specMask, how sharp and how bright); the light comes from the camera.
    uniform bool useNormalMap; uniform sampler2D normalTex; uniform float bumpiness;
    uniform bool useSpecMap; uniform sampler2D specTex; uniform vec3 specMask; uniform float specPower; uniform float specIntensity;
    // The normal map's direction turned into the surface: the surface's directions of u and v from how
    // position and texture coordinates change across the screen (the meshes carry no tangents we read).
    vec3 bumped(vec3 n, vec3 p, vec2 uv) {
      vec3 m = texture(normalTex, uv).xyz * 2.0 - 1.0;
      m.xy *= bumpiness;
      m.y = -m.y;
      vec3 dp1 = dFdx(p), dp2 = dFdy(p);
      vec2 duv1 = dFdx(uv), duv2 = dFdy(uv);
      vec3 dp2perp = cross(dp2, n), dp1perp = cross(n, dp1);
      vec3 t = dp2perp * duv1.x + dp1perp * duv2.x;
      vec3 b = dp2perp * duv1.y + dp1perp * duv2.y;
      float scale = inversesqrt(max(max(dot(t, t), dot(b, b)), 1e-20));
      return normalize(mat3(t * scale, b * scale, n) * m);
    }
    // Terrain: how many layers (1 for anything else), their textures, and which of them are there.
    uniform int layers; uniform sampler2D tex1; uniform sampler2D tex2; uniform sampler2D tex3; uniform vec3 layerOn;
    out vec4 outColor;
    void main() {
      if (lines) { outColor = vec4(color, 1.0); return; }
      vec4 base = useTexture ? texture(tex, vUv) : vec4(color, 1.0);
      if (layers > 1) {
        // Each layer over the ones below as far as it covers, masked by its own alpha (scrub in tufts over
        // the sand), as the game's gta_terrain_va_*lyr pixel shader does: lrp(c, layer, layer.a * weight).
        // The vertex colour doesn't tint them: in the game it only dims the light from around (below).
        if (useTexture && layerOn.x > 0.5) { vec4 l = texture(tex1, vUv1); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.y, 0.0, 1.0)); }
        if (useTexture && layers > 2 && layerOn.y > 0.5) { vec4 l = texture(tex2, vUv2); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.z, 0.0, 1.0)); }
        if (useTexture && layers > 3 && layerOn.z > 0.5) { vec4 l = texture(tex3, vUv3); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.w, 0.0, 1.0)); }
        base.a = 1.0;
      }
      if (cutout && alpha >= 1.0 && base.a < 0.35) discard;   // cut-outs (leaves, fences, hair)
      // Without normals in the mesh, the face's own normal.
      vec3 n = hasNormal ? normalize(vNormal) : normalize(cross(dFdx(vPosition), dFdy(vPosition)));
      // Both sides lit: the normal turned to the camera, then bent by the normal map.
      if (dot(n, toEye) < 0.0) n = -n;
      if (useNormalMap && useTexture) n = bumped(n, vPosition, vUv);
      // The light from around, dimmed on terrain by the vertex colour (red by day; hollows and the foot of
      // rocks darker), as the game's gta_terrain_va_*lyr shaders pass it on to the lighting; then the light
      // from the side.
      float around = layers > 1 ? vColor.r : 1.0;
      float shade = 0.35 * around + 0.65 * max(dot(n, light), 0.0);
      // The shine, where the surface faces half way between the light and the camera: how bright from the
      // specular map's channels in specMask, how sharp from its alpha, as gta_spec does.
      float shine = 0.0;
      if (specPower > 0.0 && specIntensity > 0.0) {
        vec4 spec = useSpecMap && useTexture ? texture(specTex, vUv) : vec4(1.0);
        float where = useSpecMap && useTexture ? dot(spec.rgb, specMask) : 1.0;
        shine = pow(max(dot(n, normalize(light + toEye)), 0.0), max(specPower * spec.a, 1.0)) * specIntensity * where;
      }
      float a = alpha < 1.0 ? alpha : 1.0;
      if (textureAlpha) {
        a = base.a * vAlpha;
        if (a < 0.01) discard;
      }
      outColor = vec4((base.rgb * shade + shine) * a, a);
    }`;

  let program, loc;
  if (gl) {
    program = createProgram(VERTEX, FRAGMENT);
    loc = {
      position: gl.getAttribLocation(program, "position"),
      normal: gl.getAttribLocation(program, "normal"),
      uv: gl.getAttribLocation(program, "uv"),
      skinBones: gl.getAttribLocation(program, "skinBones"),
      skinWeights: gl.getAttribLocation(program, "skinWeights"),
      skinned: gl.getUniformLocation(program, "skinned"),
      boneMatrices: gl.getUniformLocation(program, "boneMatrices"),
      viewProjection: gl.getUniformLocation(program, "viewProjection"),
      tex: gl.getUniformLocation(program, "tex"),
      useTexture: gl.getUniformLocation(program, "useTexture"),
      hasNormal: gl.getUniformLocation(program, "hasNormal"),
      color: gl.getUniformLocation(program, "color"),
      light: gl.getUniformLocation(program, "light"),
      toEye: gl.getUniformLocation(program, "toEye"),
      alpha: gl.getUniformLocation(program, "alpha"),
      lines: gl.getUniformLocation(program, "lines"),
      cutout: gl.getUniformLocation(program, "cutout"),
      uvAnim: gl.getUniformLocation(program, "uvAnim"),
      uvRow0: gl.getUniformLocation(program, "uvRow0"),
      uvRow1: gl.getUniformLocation(program, "uvRow1"),
      layerUvA: gl.getAttribLocation(program, "layerUvA"),
      layerUvB: gl.getAttribLocation(program, "layerUvB"),
      layerWeights: gl.getAttribLocation(program, "layerWeights"),
      vertexColor: gl.getAttribLocation(program, "vertexColor"),
      vertexAlpha: gl.getAttribLocation(program, "vertexAlpha"),
      layers: gl.getUniformLocation(program, "layers"),
      tex1: gl.getUniformLocation(program, "tex1"),
      tex2: gl.getUniformLocation(program, "tex2"),
      tex3: gl.getUniformLocation(program, "tex3"),
      layerOn: gl.getUniformLocation(program, "layerOn"),
      textureAlpha: gl.getUniformLocation(program, "textureAlpha"),
      marker: gl.getUniformLocation(program, "marker"),
      markerAt: gl.getUniformLocation(program, "markerAt"),
      markerScale: gl.getUniformLocation(program, "markerScale"),
      useNormalMap: gl.getUniformLocation(program, "useNormalMap"),
      normalTex: gl.getUniformLocation(program, "normalTex"),
      bumpiness: gl.getUniformLocation(program, "bumpiness"),
      useSpecMap: gl.getUniformLocation(program, "useSpecMap"),
      specTex: gl.getUniformLocation(program, "specTex"),
      specMask: gl.getUniformLocation(program, "specMask"),
      specPower: gl.getUniformLocation(program, "specPower"),
      specIntensity: gl.getUniformLocation(program, "specIntensity"),
    };
  }

  function createProgram(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // --- Scene from SparkIV ---

  function bytes(base64) {
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function buffer(target, data) {
    const b = gl.createBuffer();
    gl.bindBuffer(target, b);
    gl.bufferData(target, data, gl.STATIC_DRAW);
    return b;
  }

  // Bones and weights of a skinned mesh, for the vertex array bound now (both the solid and the wire one).
  function bindSkin(skin) {
    for (const [attribute, data] of [[loc.skinBones, skin && skin.bones], [loc.skinWeights, skin && skin.weights]]) {
      if (attribute < 0) continue;
      if (data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, data);
        gl.enableVertexAttribArray(attribute);
        gl.vertexAttribPointer(attribute, 4, gl.FLOAT, false, 0, 0);
      } else {
        gl.disableVertexAttribArray(attribute);
        gl.vertexAttrib4f(attribute, 0, 0, 0, 0);
      }
    }
  }

  function addMesh(m) {
    const positions = new Float32Array(bytes(m.positions).buffer);
    const indices = new Uint16Array(bytes(m.indices).buffer);
    const skin = m.skinBones && m.skinWeights
      ? { bones: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinBones).buffer)), weights: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinWeights).buffer)) }
      : null;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    if (m.normals) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.normals).buffer)));
      gl.enableVertexAttribArray(loc.normal);
      gl.vertexAttribPointer(loc.normal, 3, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.normal);
      gl.vertexAttrib3f(loc.normal, 0, 0, 1);
    }
    if (m.uvs) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.uvs).buffer)));
      gl.enableVertexAttribArray(loc.uv);
      gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.uv);
      gl.vertexAttrib2f(loc.uv, 0, 0);
    }
    // Terrain's layers: their coordinates (6 floats a vertex: layer 1, 2, 3), cover and the vertex colour.
    const layerData = m.layerUvs && m.layerWeights && m.colors;
    const attribute = (location, size, data, stride, offset) => {
      if (location < 0) return;
      if (data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, data);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, size, gl.FLOAT, false, stride, offset);
      } else {
        gl.disableVertexAttribArray(location);
      }
    };
    const layerUvs = layerData ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.layerUvs).buffer)) : null;
    attribute(loc.layerUvA, 4, layerUvs, 24, 0);
    attribute(loc.layerUvB, 2, layerUvs, 24, 16);
    attribute(loc.layerWeights, 4, layerData ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.layerWeights).buffer)) : null, 0, 0);
    attribute(loc.vertexColor, 3, layerData ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.colors).buffer)) : null, 0, 0);
    // Without its own, every vertex shows fully (the value is set before each draw: it isn't kept in the VAO).
    attribute(loc.vertexAlpha, 1, m.alphas ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.alphas).buffer)) : null, 0, 0);
    buffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    gl.bindVertexArray(null);

    // The edges for the wire frame, each once.
    const seen = new Set(), edges = [];
    for (let i = 0; i + 2 < indices.length; i += 3) {
      for (const [a, b] of [[indices[i], indices[i + 1]], [indices[i + 1], indices[i + 2]], [indices[i + 2], indices[i]]]) {
        const key = a < b ? a * 65536 + b : b * 65536 + a;
        if (!seen.has(key)) { seen.add(key); edges.push(a, b); }
      }
    }
    const lines = gl.createVertexArray();
    gl.bindVertexArray(lines);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    buffer(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(edges));
    gl.bindVertexArray(null);

    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < positions.length; i += 3) {
      for (let k = 0; k < 3; k++) {
        min[k] = Math.min(min[k], positions[i + k]);
        max[k] = Math.max(max[k], positions[i + k]);
      }
    }
    meshes.set(m.id, { vao, count: indices.length, lines, lineCount: edges.length, material: m.material, hasNormal: !!m.normals, skinned: !!skin, layered: !!layerData, hasAlpha: !!m.alphas, min, max, positions, indices });
  }

  function addMaterial(m) {
    // Without a texture: a quiet colour of its own, so the parts can be told apart.
    const hue = (m.id * 0.618) % 1;
    // Cut out where the texture is see-through, unless its alpha means something else (peds: gloss).
    // Terrain: the textures of the layers laid over the first (null until loaded, or if not found).
    const layerCount = 1 + (m.layers ? m.layers.length : 0);
    // How it is drawn, from its draw bucket: opaque, cut out, see-through by its texture (blend), lying on
    // another surface (decal), or not at all (a vehicle's no-water planes).
    const material = {
      texture: null, glass: m.glass, cutout: m.cutout === true, blend: m.blend === true, decal: m.decal === true, hidden: m.hidden === true,
      color: m.color || hsl(hue, 0.25, 0.62), layerCount, layers: [null, null, null],
      // Bumps and shine.
      normal: null, specular: null, bumpiness: m.bumpiness ?? 1,
      specularPower: m.specularPower || 0, specularIntensity: m.specularIntensity || 0, specularMask: m.specularMask || [1, 0, 0],
    };
    materials.set(m.id, material);
    if (m.texture) loadTexture(m.texture, t => material.texture = t);
    if (m.normal) loadTexture(m.normal, t => material.normal = t);
    if (m.specular) loadTexture(m.specular, t => material.specular = t);
    (m.layers || []).forEach((url, i) => { if (url && i < 3) loadTexture(url, t => material.layers[i] = t); });
  }

  const anisotropic = gl && gl.getExtension("EXT_texture_filter_anisotropic");
  const maxAnisotropy = anisotropic ? Math.min(16, gl.getParameter(anisotropic.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;

  function loadTexture(url, done) {
    const image = new Image();
    texturesLoading++;
    image.onerror = textureDone;
    image.onload = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      // Sharp also when seen at a slant (ground, walls towards the horizon), as far as the card allows.
      if (anisotropic) gl.texParameterf(gl.TEXTURE_2D, anisotropic.TEXTURE_MAX_ANISOTROPY_EXT, maxAnisotropy);
      done(t);
      draw();
      textureDone();
    };
    image.src = url;
  }

  // Textures still on their way; when the last has come (or failed), SparkIV hears "loaded" (it shows a
  // spinner until then).
  let texturesLoading = 0;
  function textureDone() {
    if (--texturesLoading === 0) post({ type: "loaded" });
  }

  function hsl(h, s, l) {
    const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0), f(8), f(4)];
  }

  // A marker for each light, as lines: an omni light a small diamond; a spot a small dot (a tiny cross)
  // and its cone, showing which way and how wide it shines (not how far: et_pierlight05's spots reach 20
  // to 30 m from lamps 0.7 m big). Different, so a spot with an omni light beside it (each of the club
  // rig's lamps: 4 to 14 cm apart) shows both even from afar, a diamond at the cone's tip. Made round the
  // origin, the diamond 2 across; drawn at the light, the same size on screen however near the camera is
  // (MarkerSize of its distance), so they neither hide a lamp nor vanish on a block.
  const MarkerSize = 0.012;
  function setLights(list) {
    const size = 1;
    lights = list.map(l => {
      const [x, y, z] = [0, 0, 0];
      const lines = [];
      if (!l.spot) {
        const corners = [[size, 0, 0], [-size, 0, 0], [0, size, 0], [0, -size, 0], [0, 0, size], [0, 0, -size]];
        // The diamond: each of the four side corners to top and bottom, and round the middle.
        for (const [a, b] of [[0, 4], [1, 4], [2, 4], [3, 4], [0, 5], [1, 5], [2, 5], [3, 5], [0, 2], [2, 1], [1, 3], [3, 0]]) {
          lines.push(x + corners[a][0], y + corners[a][1], z + corners[a][2], x + corners[b][0], y + corners[b][1], z + corners[b][2]);
        }
      } else {
        // The dot: three short lines across each other.
        const dot = size * 0.35;
        lines.push(-dot, 0, 0, dot, 0, 0, 0, -dot, 0, 0, dot, 0, 0, 0, -dot, 0, 0, dot);
      }
      if (l.spot) {
        const d = norm(l.direction);
        const length = size * 5;
        // Two axes across the direction, for the rim.
        const side = norm(cross(d, Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
        const up = cross(side, d);
        const half = Math.max(1, Math.min(89, (l.falloff || 60) / 2)) * Math.PI / 180;
        const r = Math.tan(half) * length;
        const end = [x + d[0] * length, y + d[1] * length, z + d[2] * length];
        const rim = [];
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
          rim.push([end[0] + side[0] * c + up[0] * s, end[1] + side[1] * c + up[1] * s, end[2] + side[2] * c + up[2] * s]);
        }
        lines.push(x, y, z, ...end);
        for (let i = 0; i < 12; i++) {
          lines.push(...rim[i], ...rim[(i + 1) % 12]);
          if (i % 3 === 0) lines.push(x, y, z, ...rim[i]);
        }
      }
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      bindSkin(null);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
      gl.enableVertexAttribArray(loc.position);
      gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      // A light that is black (some are) still shows, grey.
      const color = l.color.some(c => c > 0.05) ? l.color : [0.6, 0.6, 0.6];
      return { vao, count: lines.length / 3, color, meshes: l.meshes, position: l.position };
    });
    findSpots();
    draw();
  }

  // --- Spots: the places of a model whose parts lie far apart (et_pierlight05: seven lamps along 132 m
  // of pier), to go through one after the other ---
  //
  // The triangles shown are put on a grid of cells a 40th of the model across (each into the cells of its
  // box: a wall's few vertices alone would leave the cells between them empty); cells touching each other
  // (also corner to corner) are one spot. A light joins the spot it is at, or is a spot of its own (a
  // light rig: one tiny triangle, its lights metres away). Offered only when the spots are small beside
  // the model (lamps along a pier; not three blocks of a building) and there are 2 to 80.
  let spots = [];
  let spotIndex = -1;

  function findSpots() {
    spots = [];
    spotIndex = -1;
    const shownLights = showLights ? lights.filter(l => l.meshes.some(id => visible.has(id))) : [];
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    let vertices = 0;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      vertices += m.positions.length / 3;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    for (const l of shownLights) for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], l.position[k]); max[k] = Math.max(max[k], l.position[k]); }
    if (min[0] === Infinity) { reportSpot(); return; }
    const cell = Math.max(1e-3, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 40);
    const key = (x, y, z) => x + "," + y + "," + z;
    // Each cell's box (the part of the triangles' boxes in it); very large models are sampled (every n-th
    // triangle), which still finds the parts.
    const cells = new Map();
    const index = c => Math.min(39, Math.max(0, Math.floor(c)));
    let triangles = 0;
    for (const id of visible) { const m = meshes.get(id); if (m) triangles += m.indices.length / 3; }
    const stride = Math.max(1, Math.floor(triangles / 200000)) * 3;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      const p = m.positions, t = m.indices;
      for (let i = 0; i + 2 < t.length; i += stride) {
        const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
        for (let v = 0; v < 3; v++) for (let a = 0; a < 3; a++) {
          const value = p[t[i + v] * 3 + a];
          lo[a] = Math.min(lo[a], value); hi[a] = Math.max(hi[a], value);
        }
        const from = lo.map((v, a) => index((v - min[a]) / cell)), to = hi.map((v, a) => index((v - min[a]) / cell));
        for (let ix = from[0]; ix <= to[0]; ix++) for (let iy = from[1]; iy <= to[1]; iy++) for (let iz = from[2]; iz <= to[2]; iz++) {
          const k = key(ix, iy, iz);
          const cellLo = [min[0] + ix * cell, min[1] + iy * cell, min[2] + iz * cell];
          const partLo = lo.map((v, a) => Math.max(v, cellLo[a])), partHi = hi.map((v, a) => Math.min(v, cellLo[a] + cell));
          let c = cells.get(k);
          if (!c) cells.set(k, c = { ix, iy, iz, min: partLo, max: partHi, spot: -1 });
          else for (let a = 0; a < 3; a++) { c.min[a] = Math.min(c.min[a], partLo[a]); c.max[a] = Math.max(c.max[a], partHi[a]); }
        }
      }
    }
    // Touching cells into spots.
    const found = [];
    for (const start of cells.values()) {
      if (start.spot >= 0) continue;
      const spot = { min: start.min.slice(), max: start.max.slice() };
      start.spot = found.length;
      const queue = [start];
      while (queue.length) {
        const c = queue.pop();
        for (let a = 0; a < 3; a++) { spot.min[a] = Math.min(spot.min[a], c.min[a]); spot.max[a] = Math.max(spot.max[a], c.max[a]); }
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
          const n = cells.get(key(c.ix + dx, c.iy + dy, c.iz + dz));
          if (n && n.spot < 0) { n.spot = found.length; queue.push(n); }
        }
      }
      found.push(spot);
      if (found.length > 80) { reportSpot(); return; }
    }
    // Lights to the spot they are at, else a spot of their own.
    for (const l of shownLights) {
      const near = found.find(s => [0, 1, 2].every(a => l.position[a] >= s.min[a] - cell && l.position[a] <= s.max[a] + cell));
      if (near) {
        for (let a = 0; a < 3; a++) { near.min[a] = Math.min(near.min[a], l.position[a]); near.max[a] = Math.max(near.max[a], l.position[a]); }
      } else {
        found.push({ min: l.position.map(v => v - cell / 2), max: l.position.map(v => v + cell / 2) });
      }
    }
    // Small beside the model: the middle spot (by size) under a fifth of the model across.
    const across = s => Math.hypot(s.max[0] - s.min[0], s.max[1] - s.min[1], s.max[2] - s.min[2]);
    const sizes = found.map(across).sort((a, b) => a - b);
    const small = sizes.length > 0 && sizes[Math.floor(sizes.length / 2)] < cell * 40 / 5;
    if (found.length >= 2 && found.length <= 80 && small) {
      // In order along the model's longest side, then across it.
      const long = [0, 1, 2].sort((a, b) => (max[b] - min[b]) - (max[a] - min[a]));
      const centre = s => s.min.map((v, a) => (v + s.max[a]) / 2);
      spots = found.sort((p, q) => {
        const a = centre(p), b = centre(q);
        return Math.abs(a[long[0]] - b[long[0]]) > cell ? a[long[0]] - b[long[0]] : a[long[1]] - b[long[1]];
      });
    }
    reportSpot();
  }

  function reportSpot() { post({ type: "spot", index: spotIndex, count: spots.length }); }

  // To the next (+1) or previous (-1) spot: looked at from where the camera looks now, filling the view.
  function goToSpot(step) {
    if (!spots.length) return;
    spotIndex = spotIndex < 0 ? (step > 0 ? 0 : spots.length - 1) : (spotIndex + step + spots.length) % spots.length;
    const s = spots[spotIndex];
    camera.target = s.min.map((v, a) => (v + s.max[a]) / 2);
    camera.distance = fitDistance(s.min, s.max, true);
    reportSpot();
    draw();
  }

  // The same meshes with new textures (one was replaced): the old textures go, the new ones are loaded.
  function setMaterials(list) {
    for (const material of materials.values()) {
      for (const t of [material.texture, material.normal, material.specular, ...material.layers]) if (t) gl.deleteTexture(t);
    }
    materials.clear();
    for (const m of list) addMaterial(m);
    draw();
  }

  function setScene(scene) {
    for (const m of scene.materials) addMaterial(m);
    for (const m of scene.meshes) addMesh(m);
    message.textContent = scene.meshes.length ? "" : "This model has no meshes.";
    if (texturesLoading === 0) post({ type: "loaded" });
  }

  // --- Skeleton and animation (peds) ---
  //
  // A bone's place relative to its parent: translate by its offset, turn by its quaternion; down the
  // chain world = parent * local (column vectors). A vertex moves with world * inverse(rest world).
  // Checked against OpenIV's .skel: the rest pose built so is the bones' WorldOffset.

  let skeleton = null;      // { parent[], position[] (3 per bone), rotation[] (4 per bone), inverseRest[] (mat4) }
  let clip = null;          // { frames, fps, tracks: [{ bone, kind: "position"|"rotation", values }], mover, facials }
  // Moving through the world (the clip's model tracks): the camera follows, a grid on the ground shows it.
  let moveInWorld = false;
  // Facial clips started by the clip, playing on the face's bones.
  let showFacials = true;
  let lastMover = null;
  let boneTexture = null;
  const playback = { playing: false, time: 0, speed: 1, loop: true, last: 0, reportedFrame: -1 };

  function mat4FromQuat(q, t) {
    const [x, y, z, w] = q;
    return [
      1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w), 0,
      2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w), 0,
      2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y), 0,
      t[0], t[1], t[2], 1,
    ];
  }

  // Column-major 4x4 product a * b.
  function mul(a, b) {
    const r = new Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += a[k * 4 + rr] * b[c * 4 + k];
      r[c * 4 + rr] = v;
    }
    return r;
  }

  // Inverse of a rotation + translation.
  function inverseRigid(m) {
    const r = [m[0], m[4], m[8], 0, m[1], m[5], m[9], 0, m[2], m[6], m[10], 0, 0, 0, 0, 1];
    r[12] = -(r[0] * m[12] + r[4] * m[13] + r[8] * m[14]);
    r[13] = -(r[1] * m[12] + r[5] * m[13] + r[9] * m[14]);
    r[14] = -(r[2] * m[12] + r[6] * m[13] + r[10] * m[14]);
    return r;
  }

  function worldMatrices(position, rotation) {
    const n = skeleton.parent.length, world = new Array(n);
    const of = i => {
      if (!world[i]) {
        const local = mat4FromQuat(rotation.slice(i * 4, i * 4 + 4), position.slice(i * 3, i * 3 + 3));
        const p = skeleton.parent[i];
        world[i] = p >= 0 && p < n && p !== i ? mul(of(p), local) : local;
      }
      return world[i];
    };
    for (let i = 0; i < n; i++) of(i);
    return world;
  }

  // Quaternions (x, y, z, w).
  function qmul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
  }
  const qconj = q => [-q[0], -q[1], -q[2], q[3]];
  function qnorm(q) { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return q.map(v => v / l); }

  // Helper bones the game turns itself, not the animations (twist and roll bones): a bone without a track
  // at the same place under the same parent as one with a track (Char_R_ForeTwist beside Char_R_Forearm,
  // R_ArmRoll beside Char_R_UpperArm) moves as that one does; the skin of the arm hangs on them. A twist
  // bone also takes half of the hand's turn about the arm, so the wrist doesn't wring. "The same place"
  // within 3 cm: Johnny's R_ArmRoll is 7 mm beside his upper arm (Niko's exactly on it); the next bones
  // of an arm are 15 to 30 cm apart.
  function findFollowers() {
    skeleton.followers = [];
    if (!clip) return;
    const tracked = new Set(clip.tracks.filter(t => t.kind === "rotation").map(t => t.bone));
    const n = skeleton.parent.length;
    const at = i => skeleton.position.slice(i * 3, i * 3 + 3);
    for (let b = 0; b < n; b++) {
      // Only helper bones (named so): a finger without a track (the little one in many clips) keeps its rest.
      const helperName = (skeleton.names && skeleton.names[b]) || "";
      if (tracked.has(b) || !/roll|twist/i.test(helperName)) continue;
      // The nearest tracked sibling, if near enough (and not at the parent itself: then it just moves with it).
      const pb = at(b);
      let leader = -1, nearest = 0.03;
      for (let s = 0; s < n; s++) {
        if (s === b || !tracked.has(s) || skeleton.parent[s] !== skeleton.parent[b]) continue;
        const ps = at(s);
        const d = Math.hypot(pb[0] - ps[0], pb[1] - ps[1], pb[2] - ps[2]);
        if (d <= nearest && Math.hypot(ps[0], ps[1], ps[2]) >= 0.03) { nearest = d; leader = s; }
      }
      if (leader < 0) continue;
      const name = (skeleton.names && skeleton.names[b]) || "";
      let twistFrom = -1;
      if (/twist/i.test(name)) {
        for (let c = 0; c < n; c++) if (skeleton.parent[c] === leader && tracked.has(c)) { twistFrom = c; break; }
      }
      skeleton.followers.push({ bone: b, leader, twistFrom });
    }
  }

  function setSkeleton(s) {
    // The rest pose is worked out once.
    skeleton = { parent: s.parent, position: s.position, rotation: s.rotation, names: s.names, followers: [] };
    skeleton.inverseRest = worldMatrices(s.position, s.rotation).map(inverseRigid);
    boneTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, boneTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    findFollowers();
    pose(clip ? currentFrame() : null);
  }

  // A track's value between frames: positions linearly, rotations by normalized linear interpolation.
  function sample(track, frame, frames, out, at) {
    const v = track.values;
    const f0 = Math.max(0, Math.min(Math.floor(frame), frames - 1)), f1 = Math.min(f0 + 1, frames - 1), t = Math.max(0, Math.min(1, frame - f0));
    if (track.kind === "position") {
      for (let k = 0; k < 3; k++) out[at * 3 + k] = v[f0 * 3 + k] * (1 - t) + v[f1 * 3 + k] * t;
      return;
    }
    let d = 0;
    for (let k = 0; k < 4; k++) d += v[f0 * 4 + k] * v[f1 * 4 + k];
    const sign = d < 0 ? -1 : 1;
    let len = 0;
    const q = [0, 0, 0, 0];
    for (let k = 0; k < 4; k++) { q[k] = v[f0 * 4 + k] * (1 - t) + sign * v[f1 * 4 + k] * t; len += q[k] * q[k]; }
    len = Math.sqrt(len) || 1;
    for (let k = 0; k < 4; k++) out[at * 4 + k] = q[k] / len;
  }

  // The pose at a time of the clip.
  function pose(frame) {
    if (!skeleton) return;
    const position = skeleton.position.slice(), rotation = skeleton.rotation.slice();
    let mover = null;
    if (clip && frame !== null) {
      for (const track of clip.tracks) sample(track, frame, clip.frames, track.kind === "position" ? position : rotation, track.bone);
      // Facial clips: the one started last at or before this frame plays on the face's bones, from its
      // start, until it ends (over the body clip's face, if it has one).
      if (showFacials && clip.facials) {
        let facial = null;
        for (const f of clip.facials) if (f.start <= frame) facial = f;
        if (facial) {
          const local = (frame - facial.start) / clip.fps * facial.fps;
          if (local <= facial.frames - 1) {
            for (const track of facial.tracks) sample(track, local, facial.frames, track.kind === "position" ? position : rotation, track.bone);
          }
        }
      }
      if (moveInWorld && clip.mover) {
        const p = [0, 0, 0], q = [0, 0, 0, 1];
        if (clip.mover.path) sample(clip.mover.path, frame, clip.frames, p, 0);
        if (clip.mover.rotation) sample(clip.mover.rotation, frame, clip.frames, q, 0);
        mover = mat4FromQuat(q, p);
      }
      // Helper bones: the leader's turn away from its rest, applied to the helper's rest.
      const restOf = i => skeleton.rotation.slice(i * 4, i * 4 + 4);
      const nowOf = i => rotation.slice(i * 4, i * 4 + 4);
      for (const f of skeleton.followers) {
        let q = qmul(qmul(nowOf(f.leader), qconj(restOf(f.leader))), restOf(f.bone));
        if (f.twistFrom >= 0) {
          // The hand's turn away from its rest, about the arm's long axis (x), half of it.
          const d = qmul(nowOf(f.twistFrom), qconj(restOf(f.twistFrom)));
          let twist = qnorm([d[0], 0, 0, d[3]]);
          if (twist[3] < 0) twist = twist.map(v => -v);
          // Half the angle of a turn q (w >= 0) is normalize(q + 1).
          q = qmul(q, qnorm([twist[0], 0, 0, twist[3] + 1]));
        }
        q = qnorm(q);
        for (let k = 0; k < 4; k++) rotation[f.bone * 4 + k] = q[k];
      }
    }
    let world = worldMatrices(position, rotation);
    if (mover) {
      // The whole ped moved through the world; the camera goes along, as far as the ped moved.
      world = world.map(m => mul(mover, m));
      const at = [mover[12], mover[13], mover[14]];
      if (lastMover) for (let k = 0; k < 3; k++) camera.target[k] += at[k] - lastMover[k];
      lastMover = at;
    } else if (lastMover) {
      for (let k = 0; k < 3; k++) camera.target[k] -= lastMover[k];
      lastMover = null;
    }
    const data = new Float32Array(world.length * 16);
    for (let i = 0; i < world.length; i++) data.set(mul(world[i], skeleton.inverseRest[i]), i * 16);
    gl.bindTexture(gl.TEXTURE_2D, boneTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, world.length, 0, gl.RGBA, gl.FLOAT, data);
    draw();
  }

  // The mover's position track is not a place in the world: it adds up the steps in the ped's own frame
  // (walk_turn_r ends at x 0, y 1.84 though it turned 43° right; walk_turn_180_r walks on to +y after
  // turning round). Each step turns with the heading the ped has while making it, then adds to the path.
  function moverPath(mover, frames) {
    const path = new Float32Array(frames * 3);
    if (!mover.position) return { kind: "position", values: path };
    const p = mover.position.values, r = mover.rotation ? mover.rotation.values : null;
    const step = [0, 0, 0, 0], q = [0, 0, 0, 1];
    for (let f = 1; f < frames; f++) {
      if (r) sample(mover.rotation, f - 0.5, frames, q, 0);
      for (let k = 0; k < 3; k++) step[k] = p[f * 3 + k] - p[(f - 1) * 3 + k];
      step[3] = 0;
      const turned = qmul(qmul(q, step), qconj(q));
      for (let k = 0; k < 3; k++) path[f * 3 + k] = path[(f - 1) * 3 + k] + turned[k];
    }
    return { kind: "position", values: path };
  }

  function setClip(c) {
    const track = t => ({ bone: t.bone, kind: t.kind, values: new Float32Array(bytes(t.values).buffer) });
    clip = {
      frames: c.frames, fps: c.fps,
      tracks: c.tracks.map(track),
      mover: c.mover ? { position: c.mover.position ? track(c.mover.position) : null, rotation: c.mover.rotation ? track(c.mover.rotation) : null } : null,
      facials: (c.facials || []).map(f => ({ start: f.start, frames: f.frames, fps: f.fps, tracks: f.tracks.map(track) })),
      uv: (c.uv || []).map(u => ({
        material: u.material,
        row0: { kind: "position", values: new Float32Array(bytes(u.row0).buffer) },
        row1: { kind: "position", values: new Float32Array(bytes(u.row1).buffer) },
      })),
    };
    if (clip.mover) clip.mover.path = moverPath(clip.mover, clip.frames);
    playback.time = 0;
    playback.reportedFrame = -1;
    if (skeleton) findFollowers();
    showFrame();
  }

  function currentFrame() { return clip ? Math.min(playback.time * clip.fps, clip.frames - 1) : 0; }

  // The texture matrices the clip sets now, by material: [row0, row1]. Frame by frame, not in between:
  // many switch between pictures side by side in one texture (et_emissivegas02_uv_0 between a lit and a
  // dimmed lamp, offset 0 and 0.5); in between, the texture would slide across the seam.
  let uvNow = new Map();
  function updateUv(frame) {
    uvNow = new Map();
    if (!clip) return;
    const whole = Math.floor(frame + 1e-6);
    for (const u of clip.uv) {
      const row0 = [0, 0, 0], row1 = [0, 0, 0];
      sample(u.row0, whole, clip.frames, row0, 0);
      sample(u.row1, whole, clip.frames, row1, 0);
      uvNow.set(u.material, [row0, row1]);
    }
  }

  function showFrame() {
    const frame = currentFrame();
    updateUv(frame);
    pose(clip ? frame : null);
    if (!skeleton) draw();
    const whole = Math.floor(frame + 1e-6);
    if (whole !== playback.reportedFrame) {
      playback.reportedFrame = whole;
      post({ type: "frame", frame: whole, playing: playback.playing });
    }
  }

  function tick(now) {
    if (!playback.playing || !clip) return;
    const dt = playback.last ? (now - playback.last) / 1000 : 0;
    playback.last = now;
    const length = (clip.frames - 1) / clip.fps;
    playback.time += dt * playback.speed;
    if (playback.time > length) {
      if (playback.loop && length > 0) playback.time %= length;
      else { playback.time = length; playback.playing = false; playback.reportedFrame = -1; }
    }
    showFrame();
    if (playback.playing) requestAnimationFrame(tick);
  }

  function play(on) {
    if (!clip) return;
    if (on && currentFrame() >= clip.frames - 1 && !playback.loop) playback.time = 0;
    playback.playing = on;
    playback.last = 0;
    playback.reportedFrame = -1;
    if (on) requestAnimationFrame(tick); else showFrame();
  }

  function seek(frame) {
    if (!clip) return;
    playback.time = Math.max(0, Math.min(frame, clip.frames - 1)) / clip.fps;
    showFrame();
  }

  // --- Camera ---

  /** Looks at what is shown, from the side and a little above. */
  function fit() {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    // The lights shown too (a light rig is a single small triangle with its lights metres away).
    if (showLights) {
      for (const l of lights) {
        if (!l.meshes.some(id => visible.has(id))) continue;
        for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], l.position[k]); max[k] = Math.max(max[k], l.position[k]); }
      }
    }
    if (min[0] === Infinity) return;
    camera.target = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
    sceneRadius = Math.max(0.01, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2);
    // From the side and a little to the front; a long model from its long side, a little turned (et_pierlight05,
    // 132 by 49 m: half the distance than looking along its diagonal).
    const lengthX = max[0] - min[0], lengthY = max[1] - min[1];
    camera.yaw = lengthX > lengthY * 1.5 ? -1.25 : lengthY > lengthX * 1.5 ? -0.3 : -0.6;
    // Flat things (the far-away LODs of trees and blocks, made to be seen from above) are looked at from
    // high up; anything else from the side and a little above.
    const height = max[2] - min[2], width = Math.max(max[0] - min[0], max[1] - min[1]);
    camera.pitch = height < width * 0.15 ? 1.1 : 0.35;
    camera.distance = fitDistance(min, max);
    // The whole model again: no spot is the current one.
    if (spotIndex >= 0) { spotIndex = -1; reportSpot(); }
    draw();
  }

  // How far the camera must be, looking from its yaw and pitch, for the box's eight corners to fit the
  // view (with a little room): each corner seen from the camera, not a sphere round the box, which left a
  // lot of empty room round long flat models (et_pierlight05: 132 by 49 m, under a metre high).
  // A spot (close) may be looked at from much nearer than a 20th of the whole model.
  function fitDistance(min, max, close) {
    const c = Math.cos(camera.pitch);
    const toEye = [c * Math.cos(camera.yaw), c * Math.sin(camera.yaw), Math.sin(camera.pitch)];
    const forward = toEye.map(v => -v);
    const side = norm(cross(forward, [0, 0, 1]));
    const up = cross(side, forward);
    const tanY = Math.tan(camera.fov / 2) * 0.92;
    const tanX = tanY * (canvas.clientWidth / Math.max(1, canvas.clientHeight));
    let distance = 0;
    for (let i = 0; i < 8; i++) {
      const corner = [i & 1 ? max[0] : min[0], i & 2 ? max[1] : min[1], i & 4 ? max[2] : min[2]].map((v, k) => v - camera.target[k]);
      // A corner at x across, y up and z towards the camera is in view while (distance - z) * tan >= |x|, |y|.
      const z = dot(corner, toEye);
      distance = Math.max(distance, z + Math.abs(dot(corner, side)) / tanX, z + Math.abs(dot(corner, up)) / tanY);
    }
    return Math.max(distance, close ? 0 : sceneRadius * 0.05, 0.05);
  }

  function eye() {
    const c = Math.cos(camera.pitch);
    return [
      camera.target[0] + camera.distance * c * Math.cos(camera.yaw),
      camera.target[1] + camera.distance * c * Math.sin(camera.yaw),
      camera.target[2] + camera.distance * Math.sin(camera.pitch),
    ];
  }

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  function viewProjection() {
    const e = eye();
    const f = norm(sub(camera.target, e));
    const s = norm(cross(f, [0, 0, 1]));
    const u = cross(s, f);
    const view = [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1];
    const aspect = canvas.width / Math.max(1, canvas.height);
    const near = Math.max(0.001, camera.distance - sceneRadius * 4) , far = camera.distance + sceneRadius * 4;
    const nearClip = Math.max(camera.distance / 1000, near * 0.1);
    const t = 1 / Math.tan(camera.fov / 2);
    const proj = [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + nearClip) / (nearClip - far), -1, 0, 0, 2 * far * nearClip / (nearClip - far), 0];
    const out = new Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += proj[k * 4 + r] * view[c * 4 + k];
      out[c * 4 + r] = v;
    }
    // The light from a little above and to the left of the camera, so bumps and shapes show (straight from
    // the camera a normal map's bumps hardly change the shade).
    const toEye = f.map(x => -x);
    return { matrix: out, light: norm(toEye.map((v, k) => v + u[k] * 0.55 - s[k] * 0.35)), toEye };
  }

  // --- Drawing ---

  // Lines every half metre, 40 m across, at the height of the lowest point of the meshes (the feet).
  let grid = null;
  function createGrid() {
    let ground = Infinity;
    for (const m of meshes.values()) ground = Math.min(ground, m.min[2]);
    if (ground === Infinity) ground = 0;
    const lines = [];
    for (let i = -40; i <= 40; i++) {
      const v = i * 0.5;
      lines.push(-20, v, ground, 20, v, ground, v, -20, ground, v, 20, ground);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao, count: lines.length / 3 };
  }

  // The bone matrices on texture unit 1 for a skinned mesh, while there is a skeleton.
  function useSkin(m) {
    const on = !!(m.skinned && skeleton && boneTexture);
    gl.uniform1i(loc.skinned, on);
    if (on) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, boneTexture);
      gl.uniform1i(loc.boneMatrices, 1);
      gl.activeTexture(gl.TEXTURE0);
    }
  }

  let pending = false;
  function draw() {
    if (!gl || pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.useProgram(program);
      const vp = viewProjection();
      gl.uniformMatrix4fv(loc.viewProjection, false, vp.matrix);
      gl.uniform3fv(loc.light, vp.light);
      gl.uniform3fv(loc.toEye, vp.toEye);
      gl.uniform1i(loc.tex, 0);
      gl.activeTexture(gl.TEXTURE0);

      // Solid first, then glass see-through on top.
      for (const pass of ["solid", "glass"]) {
        const glassPass = pass === "glass";
        if (glassPass) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); }
        else { gl.disable(gl.BLEND); gl.depthMask(true); }
        for (const id of visible) {
          const m = meshes.get(id);
          if (!m) continue;
          const mat = materials.get(m.material) || { texture: null, glass: false, color: [0.7, 0.7, 0.7] };
          if (mat.hidden) continue;
          // Glass and what is see-through by its texture after everything solid, without writing depth.
          const seeThrough = mat.glass || (mat.blend && showTextures && !!mat.texture);
          if (seeThrough !== glassPass) continue;
          const textured = showTextures && !!mat.texture;
          gl.uniform1i(loc.useTexture, textured);
          gl.uniform1i(loc.cutout, mat.cutout === true);
          gl.uniform1i(loc.textureAlpha, glassPass && !mat.glass);
          // Decals a little in front of the surface they lie on, so they don't flicker into it.
          if (mat.decal) { gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-1, -4); } else gl.disable(gl.POLYGON_OFFSET_FILL);
          gl.uniform1i(loc.hasNormal, m.hasNormal);
          gl.uniform3fv(loc.color, mat.color);
          gl.uniform1f(loc.alpha, glassPass && mat.glass ? 0.45 : 1.0);
          gl.uniform1i(loc.lines, false);
          // Terrain's layers on texture units 2 to 4 (1 holds the bone matrices).
          const layered = m.layered && textured && mat.layerCount > 1;
          gl.uniform1i(loc.layers, layered ? mat.layerCount : 1);
          if (layered) {
            gl.uniform3fv(loc.layerOn, mat.layers.map(t => t ? 1 : 0));
            mat.layers.forEach((t, i) => {
              gl.uniform1i([loc.tex1, loc.tex2, loc.tex3][i], 2 + i);
              if (t) { gl.activeTexture(gl.TEXTURE2 + i); gl.bindTexture(gl.TEXTURE_2D, t); }
            });
            gl.activeTexture(gl.TEXTURE0);
          }
          // Bumps and shine: the normal map on unit 5, the specular map on unit 6.
          gl.uniform1i(loc.useNormalMap, textured && !!mat.normal);
          gl.uniform1i(loc.useSpecMap, textured && !!mat.specular);
          gl.uniform1f(loc.bumpiness, mat.bumpiness ?? 1);
          gl.uniform1f(loc.specPower, mat.specularPower || 0);
          gl.uniform1f(loc.specIntensity, mat.specularIntensity || 0);
          gl.uniform3fv(loc.specMask, mat.specularMask || [1, 0, 0]);
          gl.uniform1i(loc.normalTex, 5);
          gl.uniform1i(loc.specTex, 6);
          if (textured && mat.normal) { gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, mat.normal); }
          if (textured && mat.specular) { gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, mat.specular); }
          gl.activeTexture(gl.TEXTURE0);
          const uvMatrix = uvNow.get(m.material);
          gl.uniform1i(loc.uvAnim, !!uvMatrix);
          if (uvMatrix) { gl.uniform3fv(loc.uvRow0, uvMatrix[0]); gl.uniform3fv(loc.uvRow1, uvMatrix[1]); }
          useSkin(m);
          if (!m.hasAlpha && loc.vertexAlpha >= 0) gl.vertexAttrib1f(loc.vertexAlpha, 1);
          if (textured) gl.bindTexture(gl.TEXTURE_2D, mat.texture);
          gl.bindVertexArray(m.vao);
          gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
        }
      }
      gl.disable(gl.BLEND);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.depthMask(true);

      // A grid on the ground while the ped moves through the world, so the movement can be seen.
      if (moveInWorld && skeleton) {
        if (!grid) grid = createGrid();
        gl.uniform1i(loc.lines, true);
        gl.uniform1i(loc.skinned, false);
        gl.uniform3fv(loc.color, [0.55, 0.6, 0.68]);
        gl.bindVertexArray(grid.vao);
        gl.drawArrays(gl.LINES, 0, grid.count);
      }

      if (wireframe) {
        gl.uniform1i(loc.lines, true);
        gl.uniform3fv(loc.color, [0.95, 0.75, 0.25]);
        for (const id of visible) {
          const m = meshes.get(id);
          if (!m) continue;
          useSkin(m);
          gl.bindVertexArray(m.lines);
          gl.drawElements(gl.LINES, m.lineCount, gl.UNSIGNED_SHORT, 0);
        }
      }
      // The lights, while a mesh of their drawable is shown: faint where the model hides them (inside a
      // lamp's housing they would be gone), in their full colour where they are in sight.
      if (showLights && lights.length) {
        gl.uniform1i(loc.lines, true);
        gl.uniform1i(loc.skinned, false);
        gl.uniform1i(loc.marker, true);
        const e = eye();
        for (const hidden of [true, false]) {
          if (hidden) gl.disable(gl.DEPTH_TEST); else { gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); }
          for (const l of lights) {
            if (!l.meshes.some(id => visible.has(id))) continue;
            gl.uniform3fv(loc.color, hidden ? l.color.map(c => c * 0.3 + 0.12) : l.color);
            gl.uniform3fv(loc.markerAt, l.position);
            gl.uniform1f(loc.markerScale, Math.hypot(l.position[0] - e[0], l.position[1] - e[1], l.position[2] - e[2]) * MarkerSize);
            gl.bindVertexArray(l.vao);
            gl.drawArrays(gl.LINES, 0, l.count);
          }
        }
        gl.depthFunc(gl.LESS);
        gl.uniform1i(loc.marker, false);
      }
      gl.bindVertexArray(null);
    });
  }

  new ResizeObserver(draw).observe(canvas);

  // --- Mouse: left drag turns, middle (or right) drag moves, wheel zooms, double-click fits ---

  let drag = null;
  canvas.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, button: e.button };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("moving");
    if (e.button === 1) e.preventDefault();
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.button === 0 && !e.shiftKey) {
      camera.yaw -= dx * 0.008;
      camera.pitch = Math.max(-1.55, Math.min(1.55, camera.pitch + dy * 0.008));
    } else {
      // Move the target in the plane of the screen, as far as the mouse moved there.
      const e3 = eye();
      const f = norm(sub(camera.target, e3));
      const s = norm(cross(f, [0, 0, 1]));
      const u = cross(s, f);
      const perPixel = 2 * camera.distance * Math.tan(camera.fov / 2) / Math.max(1, canvas.clientHeight);
      for (let k = 0; k < 3; k++) camera.target[k] += (-s[k] * dx + u[k] * dy) * perPixel;
    }
    draw();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("moving"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("auxclick", e => e.preventDefault());
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    // Close enough for a small part of a large model (a lamp of a 132 m pier).
    camera.distance = Math.max(Math.min(0.02, sceneRadius * 0.02), sceneRadius * 0.002, Math.min(sceneRadius * 50, camera.distance * Math.pow(1.15, Math.sign(e.deltaY))));
    draw();
  }, { passive: false });
  canvas.addEventListener("dblclick", fit);

  // --- Messages from and to SparkIV ---

  function post(m) { if (window.chrome && chrome.webview) chrome.webview.postMessage(m); }

  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener("message", e => {
      const m = e.data;
      if (!gl) return;
      if (m.type === "scene") { setScene(m); }
      else if (m.type === "materials") { setMaterials(m.materials); }
      else if (m.type === "visible") { const first = visible.size === 0; visible = new Set(m.ids); findSpots(); if (first || m.fit) fit(); else draw(); }
      else if (m.type === "options") {
        showTextures = m.textures; wireframe = m.wireframe;
        const lightsChanged = showLights !== (m.lights === true);
        showLights = m.lights === true;
        if (lightsChanged) findSpots();
        draw();
      }
      else if (m.type === "spot") { goToSpot(m.step); }
      else if (m.type === "lights") { setLights(m.lights); }
      else if (m.type === "background") { document.body.className = m.name; }
      else if (m.type === "fit") { fit(); }
      else if (m.type === "skeleton") { setSkeleton(m); }
      else if (m.type === "clip") { play(false); setClip(m); if (m.play) play(true); }
      else if (m.type === "play") { play(m.on); }
      else if (m.type === "seek") { play(false); seek(m.frame); }
      else if (m.type === "speed") { playback.speed = m.value; }
      else if (m.type === "loop") { playback.loop = m.on; }
      else if (m.type === "move") { moveInWorld = m.on; showFrame(); }
      else if (m.type === "facials") { showFacials = m.on; showFrame(); }
    });
  }
  post({ type: "ready", webgl: !!gl });
</script>
</body>
</html>
