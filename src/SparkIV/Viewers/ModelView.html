<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#68788a, #22252a); }
  body.black { background: #000; }
  body.grey { background: #808080; }
  body.white { background: #fff; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.moving { cursor: grabbing; }
  #message { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: rgba(255, 255, 255, 0.8);
             font: 14px "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="message"></div>
<script>
  "use strict";
  // A small WebGL 2 renderer for the meshes of a model: textured, lit from the camera, Z up as in the game.
  const canvas = document.getElementById("view");
  const message = document.getElementById("message");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: true, alpha: true });

  const meshes = new Map();      // id → { vao, count, lines, lineCount, material, min, max }
  const materials = new Map();   // id → { texture, glass, color }
  let visible = new Set();
  let showTextures = true;
  let wireframe = false;

  // --- Camera: orbits around a target ---
  const camera = { yaw: -0.6, pitch: 0.35, distance: 5, target: [0, 0, 0], fov: 45 * Math.PI / 180 };
  let sceneRadius = 1;

  if (!gl) {
    message.textContent = "This view needs WebGL 2, which this computer's graphics don't offer.";
  }

  // Skinned meshes (peds) move with up to four bones per vertex: the bones' matrices (from rest pose to
  // the pose shown) are in a float texture, four texels (columns) per bone.
  const VERTEX = `#version 300 es
    in vec3 position; in vec3 normal; in vec2 uv; in vec4 skinBones; in vec4 skinWeights;
    uniform mat4 viewProjection; uniform bool skinned; uniform highp sampler2D boneMatrices;
    out vec3 vNormal; out vec2 vUv; out vec3 vPosition;
    mat4 bone(float i) {
      int b = int(i);
      return mat4(texelFetch(boneMatrices, ivec2(0, b), 0), texelFetch(boneMatrices, ivec2(1, b), 0),
                  texelFetch(boneMatrices, ivec2(2, b), 0), texelFetch(boneMatrices, ivec2(3, b), 0));
    }
    void main() {
      vec4 p = vec4(position, 1.0);
      vec3 n = normal;
      if (skinned) {
        mat4 m = bone(skinBones.x) * skinWeights.x + bone(skinBones.y) * skinWeights.y +
                 bone(skinBones.z) * skinWeights.z + bone(skinBones.w) * skinWeights.w;
        p = m * p;
        n = mat3(m) * n;
      }
      vNormal = n; vUv = uv; vPosition = p.xyz; gl_Position = viewProjection * p;
    }`;

  const FRAGMENT = `#version 300 es
    precision highp float;
    in vec3 vNormal; in vec2 vUv; in vec3 vPosition;
    uniform sampler2D tex; uniform bool useTexture; uniform bool hasNormal; uniform vec3 color;
    uniform vec3 light; uniform float alpha; uniform bool lines; uniform bool cutout;
    out vec4 outColor;
    void main() {
      if (lines) { outColor = vec4(color, 1.0); return; }
      vec4 base = useTexture ? texture(tex, vUv) : vec4(color, 1.0);
      if (cutout && alpha >= 1.0 && base.a < 0.35) discard;   // cut-outs (leaves, fences, decals, hair)
      // Without normals in the mesh, the face's own normal.
      vec3 n = hasNormal ? normalize(vNormal) : normalize(cross(dFdx(vPosition), dFdy(vPosition)));
      float diffuse = abs(dot(n, light));
      float shade = 0.35 + 0.65 * diffuse;
      float a = alpha < 1.0 ? alpha : 1.0;
      outColor = vec4(base.rgb * shade * a, a);
    }`;

  let program, loc;
  if (gl) {
    program = createProgram(VERTEX, FRAGMENT);
    loc = {
      position: gl.getAttribLocation(program, "position"),
      normal: gl.getAttribLocation(program, "normal"),
      uv: gl.getAttribLocation(program, "uv"),
      skinBones: gl.getAttribLocation(program, "skinBones"),
      skinWeights: gl.getAttribLocation(program, "skinWeights"),
      skinned: gl.getUniformLocation(program, "skinned"),
      boneMatrices: gl.getUniformLocation(program, "boneMatrices"),
      viewProjection: gl.getUniformLocation(program, "viewProjection"),
      tex: gl.getUniformLocation(program, "tex"),
      useTexture: gl.getUniformLocation(program, "useTexture"),
      hasNormal: gl.getUniformLocation(program, "hasNormal"),
      color: gl.getUniformLocation(program, "color"),
      light: gl.getUniformLocation(program, "light"),
      alpha: gl.getUniformLocation(program, "alpha"),
      lines: gl.getUniformLocation(program, "lines"),
      cutout: gl.getUniformLocation(program, "cutout"),
    };
  }

  function createProgram(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // --- Scene from SparkIV ---

  function bytes(base64) {
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function buffer(target, data) {
    const b = gl.createBuffer();
    gl.bindBuffer(target, b);
    gl.bufferData(target, data, gl.STATIC_DRAW);
    return b;
  }

  // Bones and weights of a skinned mesh, for the vertex array bound now (both the solid and the wire one).
  function bindSkin(skin) {
    for (const [attribute, data] of [[loc.skinBones, skin && skin.bones], [loc.skinWeights, skin && skin.weights]]) {
      if (attribute < 0) continue;
      if (data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, data);
        gl.enableVertexAttribArray(attribute);
        gl.vertexAttribPointer(attribute, 4, gl.FLOAT, false, 0, 0);
      } else {
        gl.disableVertexAttribArray(attribute);
        gl.vertexAttrib4f(attribute, 0, 0, 0, 0);
      }
    }
  }

  function addMesh(m) {
    const positions = new Float32Array(bytes(m.positions).buffer);
    const indices = new Uint16Array(bytes(m.indices).buffer);
    const skin = m.skinBones && m.skinWeights
      ? { bones: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinBones).buffer)), weights: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinWeights).buffer)) }
      : null;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    if (m.normals) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.normals).buffer)));
      gl.enableVertexAttribArray(loc.normal);
      gl.vertexAttribPointer(loc.normal, 3, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.normal);
      gl.vertexAttrib3f(loc.normal, 0, 0, 1);
    }
    if (m.uvs) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.uvs).buffer)));
      gl.enableVertexAttribArray(loc.uv);
      gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.uv);
      gl.vertexAttrib2f(loc.uv, 0, 0);
    }
    buffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    gl.bindVertexArray(null);

    // The edges for the wire frame, each once.
    const seen = new Set(), edges = [];
    for (let i = 0; i + 2 < indices.length; i += 3) {
      for (const [a, b] of [[indices[i], indices[i + 1]], [indices[i + 1], indices[i + 2]], [indices[i + 2], indices[i]]]) {
        const key = a < b ? a * 65536 + b : b * 65536 + a;
        if (!seen.has(key)) { seen.add(key); edges.push(a, b); }
      }
    }
    const lines = gl.createVertexArray();
    gl.bindVertexArray(lines);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    buffer(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(edges));
    gl.bindVertexArray(null);

    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < positions.length; i += 3) {
      for (let k = 0; k < 3; k++) {
        min[k] = Math.min(min[k], positions[i + k]);
        max[k] = Math.max(max[k], positions[i + k]);
      }
    }
    meshes.set(m.id, { vao, count: indices.length, lines, lineCount: edges.length, material: m.material, hasNormal: !!m.normals, skinned: !!skin, min, max });
  }

  function addMaterial(m) {
    // Without a texture: a quiet colour of its own, so the parts can be told apart.
    const hue = (m.id * 0.618) % 1;
    // Cut out where the texture is see-through, unless its alpha means something else (peds: gloss).
    const material = { texture: null, glass: m.glass, cutout: m.cutout !== false, color: hsl(hue, 0.25, 0.62) };
    materials.set(m.id, material);
    if (m.texture) {
      const image = new Image();
      image.onload = () => {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        material.texture = t;
        draw();
      };
      image.src = m.texture;
    }
  }

  function hsl(h, s, l) {
    const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0), f(8), f(4)];
  }

  // The same meshes with new textures (one was replaced): the old textures go, the new ones are loaded.
  function setMaterials(list) {
    for (const material of materials.values()) {
      if (material.texture) gl.deleteTexture(material.texture);
    }
    materials.clear();
    for (const m of list) addMaterial(m);
    draw();
  }

  function setScene(scene) {
    for (const m of scene.materials) addMaterial(m);
    for (const m of scene.meshes) addMesh(m);
    message.textContent = scene.meshes.length ? "" : "This model has no meshes.";
  }

  // --- Skeleton and animation (peds) ---
  //
  // A bone's place relative to its parent: translate by its offset, turn by its quaternion; down the
  // chain world = parent * local (column vectors). A vertex moves with world * inverse(rest world).
  // Checked against OpenIV's .skel: the rest pose built so is the bones' WorldOffset.

  let skeleton = null;      // { parent[], position[] (3 per bone), rotation[] (4 per bone), inverseRest[] (mat4) }
  let clip = null;          // { frames, fps, tracks: [{ bone, kind: "position"|"rotation", values }], mover, facials }
  // Moving through the world (the clip's model tracks): the camera follows, a grid on the ground shows it.
  let moveInWorld = false;
  // Facial clips started by the clip, playing on the face's bones.
  let showFacials = true;
  let lastMover = null;
  let boneTexture = null;
  const playback = { playing: false, time: 0, speed: 1, loop: true, last: 0, reportedFrame: -1 };

  function mat4FromQuat(q, t) {
    const [x, y, z, w] = q;
    return [
      1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w), 0,
      2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w), 0,
      2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y), 0,
      t[0], t[1], t[2], 1,
    ];
  }

  // Column-major 4x4 product a * b.
  function mul(a, b) {
    const r = new Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += a[k * 4 + rr] * b[c * 4 + k];
      r[c * 4 + rr] = v;
    }
    return r;
  }

  // Inverse of a rotation + translation.
  function inverseRigid(m) {
    const r = [m[0], m[4], m[8], 0, m[1], m[5], m[9], 0, m[2], m[6], m[10], 0, 0, 0, 0, 1];
    r[12] = -(r[0] * m[12] + r[4] * m[13] + r[8] * m[14]);
    r[13] = -(r[1] * m[12] + r[5] * m[13] + r[9] * m[14]);
    r[14] = -(r[2] * m[12] + r[6] * m[13] + r[10] * m[14]);
    return r;
  }

  function worldMatrices(position, rotation) {
    const n = skeleton.parent.length, world = new Array(n);
    const of = i => {
      if (!world[i]) {
        const local = mat4FromQuat(rotation.slice(i * 4, i * 4 + 4), position.slice(i * 3, i * 3 + 3));
        const p = skeleton.parent[i];
        world[i] = p >= 0 && p < n && p !== i ? mul(of(p), local) : local;
      }
      return world[i];
    };
    for (let i = 0; i < n; i++) of(i);
    return world;
  }

  // Quaternions (x, y, z, w).
  function qmul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
  }
  const qconj = q => [-q[0], -q[1], -q[2], q[3]];
  function qnorm(q) { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return q.map(v => v / l); }

  // Helper bones the game turns itself, not the animations (twist and roll bones): a bone without a track
  // at the same place under the same parent as one with a track (Char_R_ForeTwist beside Char_R_Forearm,
  // R_ArmRoll beside Char_R_UpperArm) moves as that one does; the skin of the arm hangs on them. A twist
  // bone also takes half of the hand's turn about the arm, so the wrist doesn't wring. "The same place"
  // within 3 cm: Johnny's R_ArmRoll is 7 mm beside his upper arm (Niko's exactly on it); the next bones
  // of an arm are 15 to 30 cm apart.
  function findFollowers() {
    skeleton.followers = [];
    if (!clip) return;
    const tracked = new Set(clip.tracks.filter(t => t.kind === "rotation").map(t => t.bone));
    const n = skeleton.parent.length;
    const at = i => skeleton.position.slice(i * 3, i * 3 + 3);
    for (let b = 0; b < n; b++) {
      // Only helper bones (named so): a finger without a track (the little one in many clips) keeps its rest.
      const helperName = (skeleton.names && skeleton.names[b]) || "";
      if (tracked.has(b) || !/roll|twist/i.test(helperName)) continue;
      // The nearest tracked sibling, if near enough (and not at the parent itself: then it just moves with it).
      const pb = at(b);
      let leader = -1, nearest = 0.03;
      for (let s = 0; s < n; s++) {
        if (s === b || !tracked.has(s) || skeleton.parent[s] !== skeleton.parent[b]) continue;
        const ps = at(s);
        const d = Math.hypot(pb[0] - ps[0], pb[1] - ps[1], pb[2] - ps[2]);
        if (d <= nearest && Math.hypot(ps[0], ps[1], ps[2]) >= 0.03) { nearest = d; leader = s; }
      }
      if (leader < 0) continue;
      const name = (skeleton.names && skeleton.names[b]) || "";
      let twistFrom = -1;
      if (/twist/i.test(name)) {
        for (let c = 0; c < n; c++) if (skeleton.parent[c] === leader && tracked.has(c)) { twistFrom = c; break; }
      }
      skeleton.followers.push({ bone: b, leader, twistFrom });
    }
  }

  function setSkeleton(s) {
    // The rest pose is worked out once.
    skeleton = { parent: s.parent, position: s.position, rotation: s.rotation, names: s.names, followers: [] };
    skeleton.inverseRest = worldMatrices(s.position, s.rotation).map(inverseRigid);
    boneTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, boneTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    findFollowers();
    pose(clip ? currentFrame() : null);
  }

  // A track's value between frames: positions linearly, rotations by normalized linear interpolation.
  function sample(track, frame, frames, out, at) {
    const v = track.values;
    const f0 = Math.max(0, Math.min(Math.floor(frame), frames - 1)), f1 = Math.min(f0 + 1, frames - 1), t = Math.max(0, Math.min(1, frame - f0));
    if (track.kind === "position") {
      for (let k = 0; k < 3; k++) out[at * 3 + k] = v[f0 * 3 + k] * (1 - t) + v[f1 * 3 + k] * t;
      return;
    }
    let d = 0;
    for (let k = 0; k < 4; k++) d += v[f0 * 4 + k] * v[f1 * 4 + k];
    const sign = d < 0 ? -1 : 1;
    let len = 0;
    const q = [0, 0, 0, 0];
    for (let k = 0; k < 4; k++) { q[k] = v[f0 * 4 + k] * (1 - t) + sign * v[f1 * 4 + k] * t; len += q[k] * q[k]; }
    len = Math.sqrt(len) || 1;
    for (let k = 0; k < 4; k++) out[at * 4 + k] = q[k] / len;
  }

  // The pose at a time of the clip.
  function pose(frame) {
    if (!skeleton) return;
    const position = skeleton.position.slice(), rotation = skeleton.rotation.slice();
    let mover = null;
    if (clip && frame !== null) {
      for (const track of clip.tracks) sample(track, frame, clip.frames, track.kind === "position" ? position : rotation, track.bone);
      // Facial clips: the one started last at or before this frame plays on the face's bones, from its
      // start, until it ends (over the body clip's face, if it has one).
      if (showFacials && clip.facials) {
        let facial = null;
        for (const f of clip.facials) if (f.start <= frame) facial = f;
        if (facial) {
          const local = (frame - facial.start) / clip.fps * facial.fps;
          if (local <= facial.frames - 1) {
            for (const track of facial.tracks) sample(track, local, facial.frames, track.kind === "position" ? position : rotation, track.bone);
          }
        }
      }
      if (moveInWorld && clip.mover) {
        const p = [0, 0, 0], q = [0, 0, 0, 1];
        if (clip.mover.path) sample(clip.mover.path, frame, clip.frames, p, 0);
        if (clip.mover.rotation) sample(clip.mover.rotation, frame, clip.frames, q, 0);
        mover = mat4FromQuat(q, p);
      }
      // Helper bones: the leader's turn away from its rest, applied to the helper's rest.
      const restOf = i => skeleton.rotation.slice(i * 4, i * 4 + 4);
      const nowOf = i => rotation.slice(i * 4, i * 4 + 4);
      for (const f of skeleton.followers) {
        let q = qmul(qmul(nowOf(f.leader), qconj(restOf(f.leader))), restOf(f.bone));
        if (f.twistFrom >= 0) {
          // The hand's turn away from its rest, about the arm's long axis (x), half of it.
          const d = qmul(nowOf(f.twistFrom), qconj(restOf(f.twistFrom)));
          let twist = qnorm([d[0], 0, 0, d[3]]);
          if (twist[3] < 0) twist = twist.map(v => -v);
          // Half the angle of a turn q (w >= 0) is normalize(q + 1).
          q = qmul(q, qnorm([twist[0], 0, 0, twist[3] + 1]));
        }
        q = qnorm(q);
        for (let k = 0; k < 4; k++) rotation[f.bone * 4 + k] = q[k];
      }
    }
    let world = worldMatrices(position, rotation);
    if (mover) {
      // The whole ped moved through the world; the camera goes along, as far as the ped moved.
      world = world.map(m => mul(mover, m));
      const at = [mover[12], mover[13], mover[14]];
      if (lastMover) for (let k = 0; k < 3; k++) camera.target[k] += at[k] - lastMover[k];
      lastMover = at;
    } else if (lastMover) {
      for (let k = 0; k < 3; k++) camera.target[k] -= lastMover[k];
      lastMover = null;
    }
    const data = new Float32Array(world.length * 16);
    for (let i = 0; i < world.length; i++) data.set(mul(world[i], skeleton.inverseRest[i]), i * 16);
    gl.bindTexture(gl.TEXTURE_2D, boneTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, world.length, 0, gl.RGBA, gl.FLOAT, data);
    draw();
  }

  // The mover's position track is not a place in the world: it adds up the steps in the ped's own frame
  // (walk_turn_r ends at x 0, y 1.84 though it turned 43° right; walk_turn_180_r walks on to +y after
  // turning round). Each step turns with the heading the ped has while making it, then adds to the path.
  function moverPath(mover, frames) {
    const path = new Float32Array(frames * 3);
    if (!mover.position) return { kind: "position", values: path };
    const p = mover.position.values, r = mover.rotation ? mover.rotation.values : null;
    const step = [0, 0, 0, 0], q = [0, 0, 0, 1];
    for (let f = 1; f < frames; f++) {
      if (r) sample(mover.rotation, f - 0.5, frames, q, 0);
      for (let k = 0; k < 3; k++) step[k] = p[f * 3 + k] - p[(f - 1) * 3 + k];
      step[3] = 0;
      const turned = qmul(qmul(q, step), qconj(q));
      for (let k = 0; k < 3; k++) path[f * 3 + k] = path[(f - 1) * 3 + k] + turned[k];
    }
    return { kind: "position", values: path };
  }

  function setClip(c) {
    const track = t => ({ bone: t.bone, kind: t.kind, values: new Float32Array(bytes(t.values).buffer) });
    clip = {
      frames: c.frames, fps: c.fps,
      tracks: c.tracks.map(track),
      mover: c.mover ? { position: c.mover.position ? track(c.mover.position) : null, rotation: c.mover.rotation ? track(c.mover.rotation) : null } : null,
      facials: (c.facials || []).map(f => ({ start: f.start, frames: f.frames, fps: f.fps, tracks: f.tracks.map(track) })),
    };
    if (clip.mover) clip.mover.path = moverPath(clip.mover, clip.frames);
    playback.time = 0;
    playback.reportedFrame = -1;
    if (skeleton) findFollowers();
    showFrame();
  }

  function currentFrame() { return clip ? Math.min(playback.time * clip.fps, clip.frames - 1) : 0; }

  function showFrame() {
    const frame = currentFrame();
    pose(clip ? frame : null);
    const whole = Math.floor(frame + 1e-6);
    if (whole !== playback.reportedFrame) {
      playback.reportedFrame = whole;
      post({ type: "frame", frame: whole, playing: playback.playing });
    }
  }

  function tick(now) {
    if (!playback.playing || !clip) return;
    const dt = playback.last ? (now - playback.last) / 1000 : 0;
    playback.last = now;
    const length = (clip.frames - 1) / clip.fps;
    playback.time += dt * playback.speed;
    if (playback.time > length) {
      if (playback.loop && length > 0) playback.time %= length;
      else { playback.time = length; playback.playing = false; playback.reportedFrame = -1; }
    }
    showFrame();
    if (playback.playing) requestAnimationFrame(tick);
  }

  function play(on) {
    if (!clip) return;
    if (on && currentFrame() >= clip.frames - 1 && !playback.loop) playback.time = 0;
    playback.playing = on;
    playback.last = 0;
    playback.reportedFrame = -1;
    if (on) requestAnimationFrame(tick); else showFrame();
  }

  function seek(frame) {
    if (!clip) return;
    playback.time = Math.max(0, Math.min(frame, clip.frames - 1)) / clip.fps;
    showFrame();
  }

  // --- Camera ---

  /** Looks at what is shown, from the side and a little above. */
  function fit() {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    if (min[0] === Infinity) return;
    camera.target = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
    sceneRadius = Math.max(0.01, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2);
    camera.distance = sceneRadius / Math.sin(camera.fov / 2) * 1.1;
    camera.yaw = -0.6;
    // Flat things (the far-away LODs of trees and blocks, made to be seen from above) are looked at from
    // high up; anything else from the side and a little above.
    const height = max[2] - min[2], width = Math.max(max[0] - min[0], max[1] - min[1]);
    camera.pitch = height < width * 0.15 ? 1.1 : 0.35;
    draw();
  }

  function eye() {
    const c = Math.cos(camera.pitch);
    return [
      camera.target[0] + camera.distance * c * Math.cos(camera.yaw),
      camera.target[1] + camera.distance * c * Math.sin(camera.yaw),
      camera.target[2] + camera.distance * Math.sin(camera.pitch),
    ];
  }

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  function viewProjection() {
    const e = eye();
    const f = norm(sub(camera.target, e));
    const s = norm(cross(f, [0, 0, 1]));
    const u = cross(s, f);
    const view = [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1];
    const aspect = canvas.width / Math.max(1, canvas.height);
    const near = Math.max(0.001, camera.distance - sceneRadius * 4) , far = camera.distance + sceneRadius * 4;
    const nearClip = Math.max(camera.distance / 1000, near * 0.1);
    const t = 1 / Math.tan(camera.fov / 2);
    const proj = [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + nearClip) / (nearClip - far), -1, 0, 0, 2 * far * nearClip / (nearClip - far), 0];
    const out = new Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += proj[k * 4 + r] * view[c * 4 + k];
      out[c * 4 + r] = v;
    }
    return { matrix: out, light: f.map(x => -x) };
  }

  // --- Drawing ---

  // Lines every half metre, 40 m across, at the height of the lowest point of the meshes (the feet).
  let grid = null;
  function createGrid() {
    let ground = Infinity;
    for (const m of meshes.values()) ground = Math.min(ground, m.min[2]);
    if (ground === Infinity) ground = 0;
    const lines = [];
    for (let i = -40; i <= 40; i++) {
      const v = i * 0.5;
      lines.push(-20, v, ground, 20, v, ground, v, -20, ground, v, 20, ground);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao, count: lines.length / 3 };
  }

  // The bone matrices on texture unit 1 for a skinned mesh, while there is a skeleton.
  function useSkin(m) {
    const on = !!(m.skinned && skeleton && boneTexture);
    gl.uniform1i(loc.skinned, on);
    if (on) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, boneTexture);
      gl.uniform1i(loc.boneMatrices, 1);
      gl.activeTexture(gl.TEXTURE0);
    }
  }

  let pending = false;
  function draw() {
    if (!gl || pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.useProgram(program);
      const vp = viewProjection();
      gl.uniformMatrix4fv(loc.viewProjection, false, vp.matrix);
      gl.uniform3fv(loc.light, vp.light);
      gl.uniform1i(loc.tex, 0);
      gl.activeTexture(gl.TEXTURE0);

      // Solid first, then glass see-through on top.
      for (const pass of ["solid", "glass"]) {
        const glassPass = pass === "glass";
        if (glassPass) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); }
        else { gl.disable(gl.BLEND); gl.depthMask(true); }
        for (const id of visible) {
          const m = meshes.get(id);
          if (!m) continue;
          const mat = materials.get(m.material) || { texture: null, glass: false, color: [0.7, 0.7, 0.7] };
          if (mat.glass !== glassPass) continue;
          const textured = showTextures && !!mat.texture;
          gl.uniform1i(loc.useTexture, textured);
          gl.uniform1i(loc.cutout, mat.cutout !== false);
          gl.uniform1i(loc.hasNormal, m.hasNormal);
          gl.uniform3fv(loc.color, mat.color);
          gl.uniform1f(loc.alpha, glassPass ? 0.45 : 1.0);
          gl.uniform1i(loc.lines, false);
          useSkin(m);
          if (textured) gl.bindTexture(gl.TEXTURE_2D, mat.texture);
          gl.bindVertexArray(m.vao);
          gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
        }
      }
      gl.disable(gl.BLEND);
      gl.depthMask(true);

      // A grid on the ground while the ped moves through the world, so the movement can be seen.
      if (moveInWorld && skeleton) {
        if (!grid) grid = createGrid();
        gl.uniform1i(loc.lines, true);
        gl.uniform1i(loc.skinned, false);
        gl.uniform3fv(loc.color, [0.55, 0.6, 0.68]);
        gl.bindVertexArray(grid.vao);
        gl.drawArrays(gl.LINES, 0, grid.count);
      }

      if (wireframe) {
        gl.uniform1i(loc.lines, true);
        gl.uniform3fv(loc.color, [0.95, 0.75, 0.25]);
        for (const id of visible) {
          const m = meshes.get(id);
          if (!m) continue;
          useSkin(m);
          gl.bindVertexArray(m.lines);
          gl.drawElements(gl.LINES, m.lineCount, gl.UNSIGNED_SHORT, 0);
        }
      }
      gl.bindVertexArray(null);
    });
  }

  new ResizeObserver(draw).observe(canvas);

  // --- Mouse: left drag turns, middle (or right) drag moves, wheel zooms, double-click fits ---

  let drag = null;
  canvas.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, button: e.button };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("moving");
    if (e.button === 1) e.preventDefault();
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.button === 0 && !e.shiftKey) {
      camera.yaw -= dx * 0.008;
      camera.pitch = Math.max(-1.55, Math.min(1.55, camera.pitch + dy * 0.008));
    } else {
      // Move the target in the plane of the screen, as far as the mouse moved there.
      const e3 = eye();
      const f = norm(sub(camera.target, e3));
      const s = norm(cross(f, [0, 0, 1]));
      const u = cross(s, f);
      const perPixel = 2 * camera.distance * Math.tan(camera.fov / 2) / Math.max(1, canvas.clientHeight);
      for (let k = 0; k < 3; k++) camera.target[k] += (-s[k] * dx + u[k] * dy) * perPixel;
    }
    draw();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("moving"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("auxclick", e => e.preventDefault());
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    camera.distance = Math.max(sceneRadius * 0.02, Math.min(sceneRadius * 50, camera.distance * Math.pow(1.15, Math.sign(e.deltaY))));
    draw();
  }, { passive: false });
  canvas.addEventListener("dblclick", fit);

  // --- Messages from and to SparkIV ---

  function post(m) { if (window.chrome && chrome.webview) chrome.webview.postMessage(m); }

  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener("message", e => {
      const m = e.data;
      if (!gl) return;
      if (m.type === "scene") { setScene(m); }
      else if (m.type === "materials") { setMaterials(m.materials); }
      else if (m.type === "visible") { const first = visible.size === 0; visible = new Set(m.ids); if (first || m.fit) fit(); else draw(); }
      else if (m.type === "options") { showTextures = m.textures; wireframe = m.wireframe; draw(); }
      else if (m.type === "background") { document.body.className = m.name; }
      else if (m.type === "fit") { fit(); }
      else if (m.type === "skeleton") { setSkeleton(m); }
      else if (m.type === "clip") { play(false); setClip(m); if (m.play) play(true); }
      else if (m.type === "play") { play(m.on); }
      else if (m.type === "seek") { play(false); seek(m.frame); }
      else if (m.type === "speed") { playback.speed = m.value; }
      else if (m.type === "loop") { playback.loop = m.on; }
      else if (m.type === "move") { moveInWorld = m.on; showFrame(); }
      else if (m.type === "facials") { showFacials = m.on; showFrame(); }
    });
  }
  post({ type: "ready", webgl: !!gl });
</script>
</body>
</html>
