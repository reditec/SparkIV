    inv[5] = a[0]*a[10]*a[15] - a[0]*a[11]*a[14] - a[8]*a[2]*a[15] + a[8]*a[3]*a[14] + a[12]*a[2]*a[11] - a[12]*a[3]*a[10];
    inv[9] = -a[0]*a[9]*a[15] + a[0]*a[11]*a[13] + a[8]*a[1]*a[15] - a[8]*a[3]*a[13] - a[12]*a[1]*a[11] + a[12]*a[3]*a[9];
    inv[13] = a[0]*a[9]*a[14] - a[0]*a[10]*a[13] - a[8]*a[1]*a[14] + a[8]*a[2]*a[13] + a[12]*a[1]*a[10] - a[12]*a[2]*a[9];
    inv[2] = a[1]*a[6]*a[15] - a[1]*a[7]*a[14] - a[5]*a[2]*a[15] + a[5]*a[3]*a[14] + a[13]*a[2]*a[7] - a[13]*a[3]*a[6];
    inv[6] = -a[0]*a[6]*a[15] + a[0]*a[7]*a[14] + a[4]*a[2]*a[15] - a[4]*a[3]*a[14] - a[12]*a[2]*a[7] + a[12]*a[3]*a[6];
    inv[10] = a[0]*a[5]*a[15] - a[0]*a[7]*a[13] - a[4]*a[1]*a[15] + a[4]*a[3]*a[13] + a[12]*a[1]*a[7] - a[12]*a[3]*a[5];
    inv[14] = -a[0]*a[5]*a[14] + a[0]*a[6]*a[13] + a[4]*a[1]*a[14] - a[4]*a[2]*a[13] - a[12]*a[1]*a[6] + a[12]*a[2]*a[5];
    inv[3] = -a[1]*a[6]*a[11] + a[1]*a[7]*a[10] + a[5]*a[2]*a[11] - a[5]*a[3]*a[10] - a[9]*a[2]*a[7] + a[9]*a[3]*a[6];
    inv[7] = a[0]*a[6]*a[11] - a[0]*a[7]*a[10] - a[4]*a[2]*a[11] + a[4]*a[3]*a[10] + a[8]*a[2]*a[7] - a[8]*a[3]*a[6];
    inv[11] = -a[0]*a[5]*a[11] + a[0]*a[7]*a[9] + a[4]*a[1]*a[11] - a[4]*a[3]*a[9] - a[8]*a[1]*a[7] + a[8]*a[3]*a[5];
    inv[15] = a[0]*a[5]*a[10] - a[0]*a[6]*a[9] - a[4]*a[1]*a[10] + a[4]*a[2]*a[9] + a[8]*a[1]*a[6] - a[8]*a[2]*a[5];
    const det = a[0] * inv[0] + a[1] * inv[4] + a[2] * inv[8] + a[3] * inv[12];
    return new Float32Array(inv.map(v => v / (det || 1)));
  }

  // The six planes (a, b, c, d: inside where ax + by + cz + d >= 0, normalised) of a column-major
  // view-projection matrix (Gribb and Hartmann).
  function frustumPlanes(m) {
    const row = i => [m[i], m[4 + i], m[8 + i], m[12 + i]];
    const r0 = row(0), r1 = row(1), r2 = row(2), r3 = row(3);
    return [[1, r0], [-1, r0], [1, r1], [-1, r1], [1, r2], [-1, r2]].map(([s, r]) => {
      const p = r3.map((v, k) => v + s * r[k]);
      const l = Math.hypot(p[0], p[1], p[2]) || 1;
      return p.map(v => v / l);
    });
  }

  // Column-major 4x4 matrices: a times b.
  function multiply4(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      out[c * 4 + r] = s;
    }
    return out;
  }

  // The water's level: the height most of its quads lie at (the sea's, not a pond's up in a park); null without water.
  let waterLevelCache;
  function waterLevel() {
    if (waterLevelCache !== undefined) return waterLevelCache;
    for (const id of visible) {
      const m = meshes.get(id), mat = m && materials.get(m.material);
      if (!mat || !mat.water || !m.positions) continue;
      const count = new Map();
      for (let i = 2; i < m.positions.length; i += 3) { const z = Math.round(m.positions[i] * 10) / 10; count.set(z, (count.get(z) || 0) + 1); }
      let best = null, most = 0;
      for (const [z, n] of count) if (n > most) { most = n; best = z; }
      return waterLevelCache = best;
    }
    return null;
  }

  // The mirrored scene is drawn smoothed (4 samples a pixel, as the picture itself; without, its edges
  // in the water were jagged) into a frame of its own, then resolved into the texture the water reads;
  // made again at another size.
  let reflection = null;
  function reflectionTarget(w, h) {
    if (reflection && reflection.w === w && reflection.h === h) return reflection;
    if (reflection) {
      gl.deleteFramebuffer(reflection.frame); gl.deleteTexture(reflection.texture); gl.deleteRenderbuffer(reflection.depth);
      gl.deleteFramebuffer(reflection.drawFrame); gl.deleteRenderbuffer(reflection.drawColor); gl.deleteRenderbuffer(reflection.drawDepth);
    }
    const samples = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));
    const drawColor = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, drawColor);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.RGBA8, w, h);
    const drawDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, drawDepth);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
    const drawFrame = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, drawFrame);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, drawColor);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, drawDepth);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    const frame = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, frame);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFramebuffer);
    return reflection = { w, h, texture, depth, frame, drawFrame, drawColor, drawDepth };
  }

  function setMapLights(list, roomList) {
    rooms = roomList || [];
    mapLights =(list || []).filter(l => l.range > 0).map(l => ({
      at: l.position, dir: norm(l.direction), range: l.range,
      // Its colour. Not times _f58 (most likely its strength: 1 for most lamps, 0.4 for Bernie's track
      // spots): with it the spots stayed far too dark beside the game's pictures of bc_1, without it the
      // hall, the relief and the rooms come out as bright as there.
      color: l.color.map(c => c * MapLightScale),
      // The model's angles are from the spot's axis (bc_1's track spots: 50 outer, 32 inner, so 100° across;
      // read as the whole cone the grey relief in Bernie's flat stayed dull where the game lights it). The
      // game fades from the outer to the inner: scale = 1 / (cos inner - cos outer).
      cone: l.cone > 0 ? Math.cos(Math.min(85, Math.max(1, l.cone)) * Math.PI / 180) : -1,
      coneScale: l.cone > 0 ? 1 / Math.max(1e-3, Math.cos(Math.min(l.cone - 0.5, Math.max(0, l.hotSpot || 0)) * Math.PI / 180) - Math.cos(Math.min(85, Math.max(1, l.cone)) * Math.PI / 180)) : 0,
      // What the game lights outside by (see the game's file: outdoorLamp).
      radius: l.radius || 0, strength: l.strength || 0, rgb: l.color, flags: l.flags || 0,
    }));
    draw();
  }

  // The lights now, at most MaxLights: the cutscene's own (whole frames: their values step as the game's
  // do; the strongest first, up to 8), then the location's lamps nearest to the camera that reach near it.
  function sceneLightsNow() {
    if (!showSceneLights) return [];
    const now = cutLightsNow().slice(0, 8);
    if (mapLights.length && visible.size) {
      const film = filmView();
      const e = film ? film.eye : eye();
      const near = [];
      const outside = !!sky && skyOn && backgroundReach > 0;
      for (const m of mapLights) {
        const l = outside ? outdoorLamp(m) : m;
        if (!l) continue;
        const d = Math.hypot(l.at[0] - e[0], l.at[1] - e[1], l.at[2] - e[2]);
        // Outside only as near to the camera as the game makes an object's lights (the game's file: LampReach).
        if (outside ? d < LampReach : d < l.range + 25) near.push({ l, d });
      }
      near.sort((a, b) => a.d - b.d);
      for (const { l } of near) { if (now.length >= MaxLights) break; now.push(l); }
    }
    return now;
  }

  function cutLightsNow() {
    if (!sceneLights.length || !clip) return [];
    // Outside the lights add in the game's units as its deferred spot pass adds them (deferred_lighting.fxc
    // program 26: albedo x colour x strength x falloff x cone x n.l, nothing more), times the exposure as the
    // time cycle's lights are here (checked against a D3D capture of bc_3: Bernie's face 2.68 there, 2.68 here).
    const outside = !!sky && skyOn && backgroundReach > 0;
    const scale = outside ? (sky.exposure || 1) : MapLightScale;
    const now = [];
    for (const l of sceneLights) {
      const f = Math.min(Math.floor(currentFrame() / clip.fps * l.fps + 1e-6), l.frames - 1);
      const v3 = (a, d) => a ? [a[f * 3], a[f * 3 + 1], a[f * 3 + 2]] : d;
      const v1 = (a, d) => a ? a[Math.min(f, a.length - 1)] : d;
      const strength = v1(l.intensity, 1);
      const range = v1(l.range, 10);
      if (strength <= 0.15 || range <= 0) continue;
      // GTAIV.exe hands them to its lights as it does a lamp's (0x9CA7E0 -> 0xABCC50): colour times strength
      // (inside as bright as the location's lamps, MapLightScale); a spot's outer angle from its axis, at most 89°.
      const color = v3(l.color, [1, 1, 1]).map(c => c * strength * scale);
      const dir = v3(l.direction, null);
      const cone = l.cone && dir ? Math.cos(Math.min(89, Math.max(1, v1(l.cone, 89))) * Math.PI / 180) : -1;
      const at = v3(l.position, [0, 0, 0]);
      now.push({ at, dir: dir ? norm(dir) : [0, 0, -1], color, range, cone, strength, actors: true, room: roomOf(at) });
    }
    now.sort((a, b) => b.strength - a.strength);
    return now;
  }

  function setCast(list) {
    const first = cast.size === 0;
    for (const a of cast.values()) if (a.skeleton) gl.deleteTexture(a.skeleton.texture);
    cast.clear();
    for (const a of list) {
      const track = t => t ? { bone: t.bone, kind: t.kind, values: new Float32Array(bytes(t.values).buffer) } : null;
      const sk = a.skeleton ? makeSkeleton(a.skeleton) : null;
      const cl = a.clip ? {
        frames: a.clip.frames, fps: a.clip.fps, tracks: a.clip.tracks.map(track),
        facials: (a.clip.facials || []).map(f => ({ start: f.start, frames: f.frames, fps: f.fps, tracks: f.tracks.map(track) })),
      } : null;
      if (sk) findFollowers(sk, cl);
      // A removed bone takes the bones below it along (the game's hardtop glass hangs on misc_a, a child of
      // the boat's extra_1).
      const removed = new Set(a.removedBones || []);
      if (sk && removed.size) for (let i = 0; i < sk.parent.length; i++) for (let p = sk.parent[i]; p >= 0; p = sk.parent[p]) if (removed.has(p)) { removed.add(i); break; }
      cast.set(a.id, { skeleton: sk, clip: cl, root: a.root ? { position: track(a.root.position), rotation: track(a.root.rotation) } : null, removed: [...removed] });
    }
    showFrame();
    // Where the actors are now (the view fitted before their clips were there looked at the origin); the
    // next section's cast leaves the view where it is.
    if (list.length && first) fit();
  }

  const NoBone = new Array(16).fill(0);
  function poseCast(frame) {
    for (const a of cast.values()) {
      if (!a.skeleton) continue;
      // The actor's clip runs at its own rate on the timeline's time.
      const f = a.clip && clip ? Math.min(frame / clip.fps * a.clip.fps, a.clip.frames - 1) : null;
      const p = sampledPose(a.skeleton, a.clip, f);
      let world = worldMatrices(p.position, p.rotation, a.skeleton);
      // Its room (for the cutscene's lights): where the actor is, a ped where its clip moves it, a prop where
      // the game creates it, at the scene's origin (its root bone moves it from there; Bernie's door, at his
      // door between his flat and the hall, isn't lit by the hall's light on Niko).
      const at = [0, 0, 0];
      if (a.root && a.clip && f !== null) {
        const q = [0, 0, 0, 1];
        if (a.root.position) sample(a.root.position, f, a.clip.frames, at, 0);
        if (a.root.rotation) sample(a.root.rotation, f, a.clip.frames, q, 0);
        const place = mat4FromQuat(q, at);
        world = world.map(m => mul(place, m));
      }
      a.room = roomOf(at);
      a.world = world;
      // The parts the section's [VEHICLE_REMOVAL] takes off: their bones' matrices nothing, as the game draws
      // them (what hangs on them shrinks away).
      uploadBones(a.skeleton, a.removed.length ? world.map((m, i) => a.removed.includes(i) ? NoBone : m) : world);
    }
  }

  // --- The cutscene's camera ---
  //
  // Its clip: a place and a turn (looking along its y, z up) and the field of view in degrees, per frame
  // of the timeline. While on, the view is the camera's; turning the view by mouse switches it off.
  let filmCamera = null;    // { frames, fps, position, rotation, fov } (tracks)
  let useFilmCamera = false;

  function setFilmCamera(c) {
    const track = (t, kind) => t ? { bone: 0, kind, values: new Float32Array(bytes(t).buffer) } : null;
    filmCamera = c ? { frames: c.frames, fps: c.fps, position: track(c.position, "position"), rotation: track(c.rotation, "rotation"), fov: c.fov ? new Float32Array(bytes(c.fov).buffer) : null,
                       dof: c.dof ? new Float32Array(bytes(c.dof).buffer) : null } : null;
    draw();
  }

  // The camera's eye, forward, up and field of view (radians) now, or null.
  function filmView() { return useFilmCamera ? filmCameraNow() : null; }

  // Where the cutscene's camera is now, whether the view is its or not (or null without one).
  function filmCameraNow() {
    if (!filmCamera || !filmCamera.position || !filmCamera.rotation) return null;
    const f = clip ? Math.min(currentFrame() / clip.fps * filmCamera.fps, filmCamera.frames - 1) : 0;
    const e = [0, 0, 0], q = [0, 0, 0, 1];
    // Smoothly between frames, but not across a cut (the camera elsewhere from one frame to the next: more
    // than 25 cm or 10°), which would swing it across the room for a frame.
    const whole = Math.floor(f + 1e-6);
    const a = [0, 0, 0], b = [0, 0, 0], qa = [0, 0, 0, 1], qb = [0, 0, 0, 1];
    sample(filmCamera.position, whole, filmCamera.frames, a, 0);
    sample(filmCamera.position, whole + 1, filmCamera.frames, b, 0);
    sample(filmCamera.rotation, whole, filmCamera.frames, qa, 0);
    sample(filmCamera.rotation, whole + 1, filmCamera.frames, qb, 0);
    const cut = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) > 0.25 ||
                Math.abs(qa[0] * qb[0] + qa[1] * qb[1] + qa[2] * qb[2] + qa[3] * qb[3]) < Math.cos(5 * Math.PI / 180);
    const at = cut ? whole : f;
    sample(filmCamera.position, at, filmCamera.frames, e, 0);
    sample(filmCamera.rotation, at, filmCamera.frames, q, 0);
    const turn = v => qmul(qmul(q, [v[0], v[1], v[2], 0]), qconj(q)).slice(0, 3);
    const fov = filmCamera.fov ? filmCamera.fov[Math.min(whole, filmCamera.fov.length - 1)] : 45;
    // Its depth of field's far (metres): beyond it the game's post effects blur (the game's file: gamePostEnd).
    const dofFar = filmCamera.dof ? filmCamera.dof[Math.min(whole, filmCamera.dof.length / 3 - 1) * 3 + 1] : null;
    return { eye: e, forward: norm(turn([0, 1, 0])), up: norm(turn([0, 0, 1])), fov: Math.max(1, Math.min(170, fov)) * Math.PI / 180, dofFar };
  }

  // Leaving the cutscene's camera: the free view goes on from where it is, looking the same way (fitted to
  // the cast from the side instead, it stood outside Bernie's building), turning about a point ahead of it,
  // as far as the nearest actor before it (else 3 m).
  function leaveFilmCamera() {
    const film = filmView();
    if (!film) return;
    const f = film.forward;
    let distance = Infinity;
    for (const a of cast.values()) {
      if (!a.world || !a.world.length) continue;
      const w = a.world[0];
      const along = dot(sub([w[12], w[13], w[14]], film.eye), f);
      if (along > 0.5) distance = Math.min(distance, along);
    }
    camera.distance = Math.min(distance === Infinity ? 3 : distance, 15);
    camera.target = film.eye.map((v, k) => v + f[k] * camera.distance);
    camera.yaw = Math.atan2(-f[1], -f[0]);
    camera.pitch = Math.asin(Math.max(-1, Math.min(1, -f[2])));
    camera.fov = film.fov;
  }

  // A track's value between frames: positions linearly, rotations by normalized linear interpolation.
  function sample(track, frame, frames, out, at) {
    const v = track.values;
    const f0 = Math.max(0, Math.min(Math.floor(frame), frames - 1)), f1 = Math.min(f0 + 1, frames - 1), t = Math.max(0, Math.min(1, frame - f0));
    if (track.kind === "position") {
      for (let k = 0; k < 3; k++) out[at * 3 + k] = v[f0 * 3 + k] * (1 - t) + v[f1 * 3 + k] * t;
      return;
    }
    let d = 0;
    for (let k = 0; k < 4; k++) d += v[f0 * 4 + k] * v[f1 * 4 + k];
    const sign = d < 0 ? -1 : 1;
    let len = 0;
    const q = [0, 0, 0, 0];
    for (let k = 0; k < 4; k++) { q[k] = v[f0 * 4 + k] * (1 - t) + sign * v[f1 * 4 + k] * t; len += q[k] * q[k]; }
    len = Math.sqrt(len) || 1;
    for (let k = 0; k < 4; k++) out[at * 4 + k] = q[k] / len;
  }

  // The pose at a time of the clip.
  function pose(frame) {
    if (cast.size) poseCast(frame === null ? 0 : frame);
    if (!skeleton) { if (cast.size) draw(); return; }
    const { position, rotation } = sampledPose(skeleton, clip, frame);
    let mover = null;
    if (clip && frame !== null && moveInWorld && clip.mover) {
      const p = [0, 0, 0], q = [0, 0, 0, 1];
      if (clip.mover.path) sample(clip.mover.path, frame, clip.frames, p, 0);
      if (clip.mover.rotation) sample(clip.mover.rotation, frame, clip.frames, q, 0);
      mover = mat4FromQuat(q, p);
    }
    let world = worldMatrices(position, rotation);
    if (mover) {
      // The whole ped moved through the world; the camera goes along, as far as the ped moved.
      world = world.map(m => mul(mover, m));
      const at = [mover[12], mover[13], mover[14]];
      if (lastMover) for (let k = 0; k < 3; k++) camera.target[k] += at[k] - lastMover[k];
      lastMover = at;
    } else if (lastMover) {
      for (let k = 0; k < 3; k++) camera.target[k] -= lastMover[k];
      lastMover = null;
    }
    uploadBones(skeleton, world);
    draw();
  }

  // The mover's position track is not a place in the world: it adds up the steps in the ped's own frame
  // (walk_turn_r ends at x 0, y 1.84 though it turned 43° right; walk_turn_180_r walks on to +y after
  // turning round). Each step turns with the heading the ped has while making it, then adds to the path.
  function moverPath(mover, frames) {
    const path = new Float32Array(frames * 3);
    if (!mover.position) return { kind: "position", values: path };
    const p = mover.position.values, r = mover.rotation ? mover.rotation.values : null;
    const step = [0, 0, 0, 0], q = [0, 0, 0, 1];
    for (let f = 1; f < frames; f++) {
      if (r) sample(mover.rotation, f - 0.5, frames, q, 0);
      for (let k = 0; k < 3; k++) step[k] = p[f * 3 + k] - p[(f - 1) * 3 + k];
      step[3] = 0;
      const turned = qmul(qmul(q, step), qconj(q));
      for (let k = 0; k < 3; k++) path[f * 3 + k] = path[(f - 1) * 3 + k] + turned[k];
    }
    return { kind: "position", values: path };
  }

  function setClip(c) {
    const track = t => ({ bone: t.bone, kind: t.kind, values: new Float32Array(bytes(t.values).buffer) });
    clip = {
      frames: c.frames, fps: c.fps,
      tracks: c.tracks.map(track),
      mover: c.mover ? { position: c.mover.position ? track(c.mover.position) : null, rotation: c.mover.rotation ? track(c.mover.rotation) : null } : null,
      facials: (c.facials || []).map(f => ({ start: f.start, frames: f.frames, fps: f.fps, tracks: f.tracks.map(track) })),
      uv: (c.uv || []).map(u => ({
        material: u.material,
        row0: { kind: "position", values: new Float32Array(bytes(u.row0).buffer) },
        row1: { kind: "position", values: new Float32Array(bytes(u.row1).buffer) },
      })),
    };
    if (clip.mover) clip.mover.path = moverPath(clip.mover, clip.frames);
    playback.time = 0;
    playback.reportedFrame = -1;
    if (skeleton) findFollowers();
    showFrame();
  }

  function currentFrame() { return clip ? Math.min(playback.time * clip.fps, clip.frames - 1) : 0; }

  // The texture matrices the clip sets now, by material: [row0, row1]. Frame by frame, not in between:
  // many switch between pictures side by side in one texture (et_emissivegas02_uv_0 between a lit and a
  // dimmed lamp, offset 0 and 0.5); in between, the texture would slide across the seam.
  let uvNow = new Map();
  function updateUv(frame) {
    uvNow = new Map();
    if (!clip) return;
    const whole = Math.floor(frame + 1e-6);
    for (const u of clip.uv) {
      const row0 = [0, 0, 0], row1 = [0, 0, 0];
      sample(u.row0, whole, clip.frames, row0, 0);
      sample(u.row1, whole, clip.frames, row1, 0);
      uvNow.set(u.material, [row0, row1]);
    }
  }

  // A cutscene's fades in this section, in its frames: from black until inEnd (0: none), to black from
  // outStart to outEnd (outStart -1: none). Only through the cutscene's camera, as the game shows them.
  let fade = { inEnd: 0, outStart: -1, outEnd: -1 };
  const fadeCover = document.getElementById("fade");

  function showFade() {
    const f = currentFrame();
    let dark = 0;
    if (useFilmCamera && clip) {
      if (fade.inEnd > 0 && f < fade.inEnd) dark = 1 - f / fade.inEnd;
      if (fade.outStart >= 0 && f > fade.outStart) dark = Math.max(dark, Math.min(1, (f - fade.outStart) / Math.max(1, fade.outEnd - fade.outStart)));
    }
    fadeCover.style.opacity = dark.toFixed(3);
  }

  function showFrame() {
    const frame = currentFrame();
    showFade();
    updateUv(frame);
    pose(clip ? frame : null);
    if (!skeleton) draw();
    const whole = Math.floor(frame + 1e-6);
    if (whole !== playback.reportedFrame) {
      playback.reportedFrame = whole;
      post({ type: "frame", frame: whole, playing: playback.playing });
    }
  }

  function tick(now) {
    if (!playback.playing || !clip) return;
    const dt = playback.last ? (now - playback.last) / 1000 : 0;
    playback.last = now;
    const length = (clip.frames - 1) / clip.fps;
    playback.time += dt * playback.speed;
    if (playback.time > length) {
      if (playback.loop && length > 0) playback.time %= length;
      else { playback.time = length; playback.playing = false; playback.reportedFrame = -1; }
    }
    showFrame();
    if (playback.playing) requestAnimationFrame(tick);
  }

  function play(on) {
    if (!clip) return;
    if (on && currentFrame() >= clip.frames - 1 && !playback.loop) playback.time = 0;
    playback.playing = on;
    playback.last = 0;
    playback.reportedFrame = -1;
    if (on) requestAnimationFrame(tick); else showFrame();
  }

  function seek(frame) {
    if (!clip) return;
    playback.time = Math.max(0, Math.min(frame, clip.frames - 1)) / clip.fps;
    showFrame();
  }

  // --- Camera ---

  /** Looks at what is shown, from the side and a little above. */
  function fit() {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m || m.actor || m.background) continue;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    // A cutscene's actors where they are now (their meshes are made at the origin): their bones, and a
    // little room round them for the body about the bones.
    for (const a of cast.values()) {
      if (!a.world) continue;
      for (const w of a.world) for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], w[12 + k] - 0.3); max[k] = Math.max(max[k], w[12 + k] + 0.3); }
    }
    // The lights shown too (a light rig is a single small triangle with its lights metres away).
    if (showLights) {
      for (const l of lights) {
        if (!l.meshes.some(id => visible.has(id))) continue;
        for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], l.position[k]); max[k] = Math.max(max[k], l.position[k]); }
      }
    }
    if (min[0] === Infinity) return;
    camera.target = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
    sceneRadius = Math.max(0.01, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2);
    // From the side and a little to the front; a long model from its long side, a little turned (et_pierlight05,
    // 132 by 49 m: half the distance than looking along its diagonal).
    const lengthX = max[0] - min[0], lengthY = max[1] - min[1];
    camera.yaw = lengthX > lengthY * 1.5 ? -1.25 : lengthY > lengthX * 1.5 ? -0.3 : -0.6;
    // Flat things (the far-away LODs of trees and blocks, made to be seen from above) are looked at from
    // high up; anything else from the side and a little above.
    const height = max[2] - min[2], width = Math.max(max[0] - min[0], max[1] - min[1]);
    camera.pitch = height < width * 0.15 ? 1.1 : 0.35;
    camera.distance = fitDistance(min, max);
    // The whole model again: no spot is the current one.
    if (spotIndex >= 0) { spotIndex = -1; reportSpot(); }
    draw();
  }

  // How far the camera must be, looking from its yaw and pitch, for the box's eight corners to fit the
  // view (with a little room): each corner seen from the camera, not a sphere round the box, which left a
  // lot of empty room round long flat models (et_pierlight05: 132 by 49 m, under a metre high).
  // A spot (close) may be looked at from much nearer than a 20th of the whole model.
  function fitDistance(min, max, close) {
    const c = Math.cos(camera.pitch);
    const toEye = [c * Math.cos(camera.yaw), c * Math.sin(camera.yaw), Math.sin(camera.pitch)];
    const forward = toEye.map(v => -v);
    const side = norm(cross(forward, [0, 0, 1]));
    const up = cross(side, forward);
    const tanY = Math.tan(camera.fov / 2) * 0.92;
    const tanX = tanY * (canvas.clientWidth / Math.max(1, canvas.clientHeight));
    let distance = 0;
    for (let i = 0; i < 8; i++) {
      const corner = [i & 1 ? max[0] : min[0], i & 2 ? max[1] : min[1], i & 4 ? max[2] : min[2]].map((v, k) => v - camera.target[k]);
      // A corner at x across, y up and z towards the camera is in view while (distance - z) * tan >= |x|, |y|.
      const z = dot(corner, toEye);
      distance = Math.max(distance, z + Math.abs(dot(corner, side)) / tanX, z + Math.abs(dot(corner, up)) / tanY);
    }
    return Math.max(distance, close ? 0 : sceneRadius * 0.05, 0.05);
  }

  function eye() {
    const c = Math.cos(camera.pitch);
    return [
      camera.target[0] + camera.distance * c * Math.cos(camera.yaw),
      camera.target[1] + camera.distance * c * Math.sin(camera.yaw),
      camera.target[2] + camera.distance * Math.sin(camera.pitch),
    ];
  }

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  function viewProjection() {
    // Through a cutscene's camera (tilted as it is), or the viewer's own looking at its target.
    const film = filmView();
    const e = film ? film.eye : eye();
    const f = film ? film.forward : norm(sub(camera.target, e));
    const s = norm(cross(f, film ? film.up : [0, 0, 1]));
    const u = cross(s, f);
    const view = [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1];
    const aspect = canvas.width / Math.max(1, canvas.height);
    const reach = Math.max(sceneRadius * 4, backgroundReach + camera.distance);
    const near = Math.max(0.001, camera.distance - sceneRadius * 4) , far = film ? Math.max(sceneRadius * 8 + 100, backgroundReach * 2) : camera.distance + reach;
    // Not nearer than needed: the nearer it is, the less exact the depth further away, and close surfaces
    // (a wall and the dirt laid over it) flicker through each other. A cutscene's location reaches far,
    // so its camera's near limit is 10 cm, the free view's at least a 2000th of the farthest.
    let nearClip = film ? 0.1 : Math.max(camera.distance / 1000, near * 0.1);
    if (!film && backgroundReach > 0) nearClip = Math.max(nearClip, Math.min(0.1, far / 2000));
    const t = 1 / Math.tan((film ? film.fov : camera.fov) / 2);
    const proj = [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + nearClip) / (nearClip - far), -1, 0, 0, 2 * far * nearClip / (nearClip - far), 0];
    const out = new Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += proj[k * 4 + r] * view[c * 4 + k];
      out[c * 4 + r] = v;
    }
    // The light from a little above and to the left of the camera, so bumps and shapes show (straight from
    // the camera a normal map's bumps hardly change the shade).
    const toEye = f.map(x => -x);
    // Through the cutscene's camera its depth of field, with the depth's range to read the distance back.
    const depthOfField = film && film.dofFar != null ? { near: nearClip, far, focus: film.dofFar } : null;
    // (Its axes and opening too, for the sun's shadow cascades: the game's file, sunShadowCascades.)
    return { matrix: out, light: norm(toEye.map((v, k) => v + u[k] * 0.55 - s[k] * 0.35)), toEye, eye: e, depthOfField,
             forward: f, right: s, up: u, fov: film ? film.fov : camera.fov, aspect };
  }

  // --- Drawing ---

  // Lines every half metre, 40 m across, at the height of the lowest point of the meshes (the feet).
  let grid = null;
  function createGrid() {
    let ground = Infinity;
    for (const m of meshes.values()) ground = Math.min(ground, m.min[2]);
    if (ground === Infinity) ground = 0;
    const lines = [];
    for (let i = -40; i <= 40; i++) {
      const v = i * 0.5;
      lines.push(-20, v, ground, 20, v, ground, v, -20, ground, v, 20, ground);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao, count: lines.length / 3 };
  }

  // The bone matrices on texture unit 1 for a skinned mesh, while there is a skeleton.
  function useSkin(m) {
    // A cutscene actor's mesh moves with its own skeleton.
    const actor = m.actor ? cast.get(m.actor) : null;
    const texture = m.actor ? actor && actor.skeleton && actor.skeleton.texture : skeleton && boneTexture;
    const on = !!(m.skinned && texture);
    gl.uniform1i(loc.skinned, on);
    if (on) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(loc.boneMatrices, 1);
      gl.activeTexture(gl.TEXTURE0);
    }
  }

  let pending = false;
  let waterShown = false;   // the last frame drew water outside (it is drawn again and again, see below)
  function draw() {
    if (!gl || pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      skyAtCamera();
      // Outside the scene goes through the game's post effects (the game's file: gamePostBegin, gamePostEnd).
      const postOn = !!sky && skyOn && backgroundReach > 0 && gamePostBegin(w, h);
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      // As the game (its render states' ZFUNC 4, less or equal): a surface laid on another with the same
      // vertices (a vehicle's detail layer on its paint: the tropic's deck) is drawn over it, after it,
      // instead of flickering through it.
      gl.depthFunc(gl.LEQUAL);
      gl.useProgram(program);
      waterShown = false;
      const lightsNow = sceneLightsNow();
      const vp = viewProjection();
      if (sky && skyOn && backgroundReach > 0) {
        // (Its light too where the time cycle gives the game's sky: the post effects then tone-map it as the game
        // does, ColorCorrect and all; else only its picture.)
        if (postOn && !(sky.skyHdr && sky.skyHdr.exposure > 0)) gamePostLight(false);
        drawSky(vp.matrix, vp.eye);
        if (postOn) gamePostLight(true);
      }
      gl.uniformMatrix4fv(loc.viewProjection, false, vp.matrix);
      gl.uniform3fv(loc.light, vp.light);
      gl.uniform3fv(loc.toEye, vp.toEye);
      gl.uniform3fv(loc.eyeAt, vp.eye);
      const outside = !!sky && skyOn && backgroundReach > 0;
      gl.uniform1i(loc.grade, backgroundReach > 0 && !outside);
      gl.uniform1i(loc.outdoor, outside);
      if (outside) {
        gl.uniform3fv(loc.sunDir, sky.sunDirection);
        gl.uniform3fv(loc.sunColor, sky.sun);
        gl.uniform3fv(loc.ambientAbove, sky.ambientAbove);
        gl.uniform3fv(loc.ambientBelow, sky.ambientBelow);
        gl.uniform3fv(loc.hazeColor, hazeColour());
        gl.uniform1f(loc.hazeStart, Math.min(sky.fogStart, hazeEnd() * 0.5));
        gl.uniform1f(loc.hazeEnd, hazeEnd());
        // In the light's units, as the sun's (times the exposure).
        gl.uniform3fv(loc.waterColor, sky.water.slice(0, 3).map(c => c * (sky.exposure || 1)));
        gl.uniform1f(loc.waterReflect, sky.waterReflection || 1);
        gl.uniform1f(loc.toneGamma, sky.gamma || 1);
        setToneUniforms();
        gl.uniform3fv(loc.skyColor, sky.horizon);
        gl.uniform3fv(loc.skyTopColor, sky.zenith);
        // The water's simulation one step on (its texture on unit 10, for the water's waves).
        if (waterLevel() !== null) {
          waterSimStep();
          gl.viewport(0, 0, w, h);
          gl.useProgram(program);
          gl.activeTexture(gl.TEXTURE10);
          gl.bindTexture(gl.TEXTURE_2D, waterSim.textures[waterSim.current]);
          gl.activeTexture(gl.TEXTURE0);
          gl.uniform1i(loc.waterSim, 10);
          // The sea's swell round the camera (its heights on unit 12).
          dynamicWaterStep(vp.eye);
          gl.activeTexture(gl.TEXTURE12);
          gl.bindTexture(gl.TEXTURE_2D, dynamicWater.texture);
          gl.activeTexture(gl.TEXTURE0);
          gl.uniform1i(loc.dynamicWater, 12);
          gl.uniform2f(loc.dynamicMin, dynamicWater.x0, dynamicWater.y0);
          // Where the water is in its window (unit 13), the grid at the water's level.
          drawWaterMask();
          gl.viewport(0, 0, w, h);
          gl.activeTexture(gl.TEXTURE13);
          gl.bindTexture(gl.TEXTURE_2D, waterMask.texture);
          gl.activeTexture(gl.TEXTURE0);
          gl.uniform1i(loc.waterMask, 13);
          gl.uniform1f(loc.gridLevel, waterLevel());
        }
        gl.uniform1i(loc.seaOn, waterLevel() !== null);
      }
      gl.uniform1i(loc.sceneLights, lightsNow.length);
      if (lightsNow.length) {
        const pad = f => { const a = new Float32Array(MaxLights * 4); lightsNow.forEach((l, i) => a.set(f(l), i * 4)); return a; };
        gl.uniform4fv(loc.sceneLightAt, pad(l => [...l.at, l.range]));
        gl.uniform4fv(loc.sceneLightDir, pad(l => [...l.dir, l.cone]));
        gl.uniform4fv(loc.sceneLightColor, pad(l => [...l.color, l.actors ? -(l.room + 2) : (l.coneScale || 0)]));
      }
      gl.uniform1i(loc.tex, 0);
      gl.activeTexture(gl.TEXTURE0);

      // The meshes, solid first, then glass see-through on top; mirrored (reflecting): not the water itself.
      // mapPass: into the mirrored surroundings' map (the game's file: parabolicTarget) - only the map's solid
      // objects reaching above the camera, as the game draws it (no people, no vehicles, nothing below the camera).
      // castBox: into a cascade of the sun's shadow map (the game's file: sunShadowCascades) - whatever is solid
      // and lies across its box on the light's u and v (people and vehicles too).
      // castCast: only the cast into it (else only the map's objects).
      const drawMeshes = (reflecting, matrix, eyeNow, mapPass, castBox, castCast) => {
      // Only what can be in the picture: a map object (it stands still) whose bounding sphere is inside the
      // view (the six planes of the view-projection); actors move, they are always drawn. Mirrored, not what
      // lies under the water nor what would come out smaller than a few pixels (each frame draws the scene twice).
      const planes = frustumPlanes(matrix);
      const seen = m => {
        if (m.actor) return !mapPass && (!castBox || !!castCast);
        if (castBox && castCast) return false;
        if (m.radius === undefined) {
          m.center = [0, 1, 2].map(k => (m.min[k] + m.max[k]) / 2);
          m.radius = Math.hypot(m.max[0] - m.min[0], m.max[1] - m.min[1], m.max[2] - m.min[2]) / 2;
        }
        // Into the map only the far versions, as the game draws it (the location's file: CutsceneLocation; those only
        // for the map nowhere else), reaching above the camera, not what would be under a pixel of it (its 1024 span
        // half the sky, ~0.003 rad each).
        if (m.mirrorOnly && !mapPass) return false;
        // (And as far as the game's reaches: in the TLAD trace its objects stood up to 321 m off, but for one of a
        // district's 945 m off; here those reaching within 330 m.)
        if (mapPass) {
          if (!m.far || m.max[2] < eyeNow[2] || m.radius < 0.003 * Math.hypot(m.center[0] - eyeNow[0], m.center[1] - eyeNow[1], m.center[2] - eyeNow[2])) return false;
          if (Math.hypot(m.center[0] - eyeNow[0], m.center[1] - eyeNow[1]) - m.radius > 330) return false;
        }
        else if (castBox) {
          if (Math.abs(dot(m.center, shadowSet.u) - castBox[0]) > 1 / castBox[2] + m.radius) return false;
          if (Math.abs(dot(m.center, shadowSet.v) - castBox[1]) > 1 / castBox[3] + m.radius) return false;
        }
        else for (const p of planes) if (p[0] * m.center[0] + p[1] * m.center[1] + p[2] * m.center[2] + p[3] < -m.radius) return false;
        if (reflecting) {
          if (m.max[2] < level) return false;
          const d = Math.hypot(m.center[0] - eyeNow[0], m.center[1] - eyeNow[1], m.center[2] - eyeNow[2]);
          if (m.radius / Math.max(d, 1e-3) < 0.01) return false;
        }
        // Outside, nothing wholly in the haze (beyond its end it is all haze), nor beyond how far the game draws
        // in this shot (the .cut's draw distance: bc_3's last shot from the boat 89 m, the city's towers not there).
        if (outside) {
          const away = Math.hypot(m.center[0] - eyeNow[0], m.center[1] - eyeNow[1], m.center[2] - eyeNow[2]) - m.radius;
          if (away > hazeEnd() || (away > drawDistanceNow() && !(materials.get(m.material) || {}).water)) return false;
        }
        return true;
      };
      let noWaterMasked = false;
      for (const pass of ["solid", "glass"]) {
        const glassPass = pass === "glass";
        if (glassPass && (mapPass || castBox)) continue;
        if (glassPass) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); }
        else { gl.disable(gl.BLEND); gl.depthMask(true); }
        for (const id of visible) {
          const m = meshes.get(id);
          if (!m) continue;
          const mat = materials.get(m.material) || { texture: null, glass: false, color: [0.7, 0.7, 0.7] };
          if (mat.hidden) continue;
          if ((reflecting || mapPass || castBox) && mat.water) continue;
          if ((mapPass || castBox) && m.floatAt) continue;
          if (!seen(m)) continue;
          // A cutscene's actor not in this section (of another part of the file): not there.
          if (m.actor && cast.size && !cast.has(m.actor)) continue;
          // Floating litter only near the camera, as the game makes procedural objects: within 30 m (GTAIV.exe
          // 0xC87760: its detail setting, 20 by default, x 0.5 + 20 m), lifted with the sea there.
          if (m.floatAt && Math.hypot(m.floatAt[0] - eyeNow[0], m.floatAt[1] - eyeNow[1], m.floatAt[2] - eyeNow[2]) > FloatingRadius) continue;
          // Nor where a vehicle of the cast is (the game's litter is pushed away by it; ours isn't: bc_3's lay in
          // the boat, under its seat).
          if (m.floatAt && insideVehicle(m.floatAt)) continue;
          gl.uniform1i(loc.floating, !!m.floatAt && outside);
          if (m.floatAt) gl.uniform2f(loc.floatAt, m.floatAt[0], m.floatAt[1]);
          // Glass and what is see-through by its texture after everything solid, without writing depth.
          // Outside the water is drawn whole (its overlapping quads see-through came out lighter where two lay).
          const seeThrough = (mat.glass && !(mat.water && outside)) || (mat.blend && showTextures && !!mat.texture);
          if (seeThrough !== glassPass) continue;
          // Into the mirrored surroundings' map: only what its shader reads (texture or colour, terrain layers, the
          // vertex colours' AO; the rest is the same throughout that pass, set before it).
          if (mapPass) {
            const textured = showTextures && !!mat.texture;
            gl.uniform1i(loc.useTexture, textured);
            gl.uniform1i(loc.cutout, mat.cutout === true);
            gl.uniform1i(loc.hasNormal, m.hasNormal);
            gl.uniform3fv(loc.color, mat.color);
            gl.uniform1i(loc.baked, m.baked && !mat.vehicle);
            const layered = m.layered && textured && mat.layerCount > 1;
            gl.uniform1i(loc.layers, layered ? mat.layerCount : 1);
            if (layered) {
              gl.uniform3fv(loc.layerOn, mat.layers.map(t => t ? 1 : 0));
              mat.layers.forEach((t, i) => {
                gl.uniform1i([loc.tex1, loc.tex2, loc.tex3][i], 2 + i);
                if (t) { gl.activeTexture(gl.TEXTURE2 + i); gl.bindTexture(gl.TEXTURE_2D, t); }
              });
              gl.activeTexture(gl.TEXTURE0);
            }
            if (m.baked && !m.hasColors && loc.vertexColor >= 0) gl.vertexAttrib3f(loc.vertexColor, 0.45, 0.45, 0.45);
            else if (!m.baked && !m.hasColors && loc.vertexColor >= 0) gl.vertexAttrib3f(loc.vertexColor, 1, 1, 1);
            useSkin(m);
            if (!m.hasAlpha && loc.vertexAlpha >= 0) gl.vertexAttrib1f(loc.vertexAlpha, 1);
            if (textured) gl.bindTexture(gl.TEXTURE_2D, mat.texture);
            gl.bindVertexArray(m.vao);
            gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
            continue;
          }
          // Into the sun's shadow map: only its shape and where its texture cuts it out (the rest is the same
          // throughout that pass, set before it).
          if (castBox) {
            const cut = mat.cutout === true && showTextures && !!mat.texture;
            gl.uniform1i(loc.useTexture, cut);
            gl.uniform1i(loc.cutout, cut);
            if (cut) gl.bindTexture(gl.TEXTURE_2D, mat.texture);
            useSkin(m);
            if (!m.hasAlpha && loc.vertexAlpha >= 0) gl.vertexAttrib1f(loc.vertexAlpha, 1);
            gl.bindVertexArray(m.vao);
            gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
            continue;
          }
          // No water inside a boat: before the first water, its no-water planes (draw bucket 30: the tropic's
          // over its cockpit, above the water's level) where they are in sight into the stencil, unseen, and the
          // water (and the sea's grid) only outside them, as the game masks it.
          if (mat.water && !reflecting && !noWaterMasked) {

    // The body: a box 12 by 10 cm, 20 cm deep behind the eye.
    const box = [];
    for (const d of [0, -0.2]) for (const [a, b] of [[-0.06, -0.05], [0.06, -0.05], [0.06, 0.05], [-0.06, 0.05]]) box.push(at(zero, a, b, d));
    for (let i = 0; i < 4; i++) { line(box[i], box[(i + 1) % 4]); line(box[4 + i], box[4 + (i + 1) % 4]); line(box[i], box[4 + i]); }
    // What it sees.
    const corners = [[-w, -h], [w, -h], [w, h], [-w, h]].map(([a, b]) => at(zero, a, b, L));
    for (let i = 0; i < 4; i++) { line(c.eye, corners[i]); line(corners[i], corners[(i + 1) % 4]); }
    const top = [at(zero, -w * 0.3, h * 1.08, L), at(zero, w * 0.3, h * 1.08, L), at(zero, 0, h * 1.45, L)];
    line(top[0], top[1]); line(top[1], top[2]); line(top[2], top[0]);
    if (!filmCameraLines) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      bindSkin(null);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.enableVertexAttribArray(loc.position);
      gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
      filmCameraLines = { vao, vbo };
    }
    gl.bindVertexArray(filmCameraLines.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, filmCameraLines.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lines), gl.DYNAMIC_DRAW);
    gl.uniform1i(loc.lines, true);
    gl.uniform1i(loc.skinned, false);
    for (const hidden of [true, false]) {
      if (hidden) gl.disable(gl.DEPTH_TEST); else { gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); }
      gl.uniform3fv(loc.color, hidden ? [0.45, 0.32, 0.12] : [1.0, 0.62, 0.15]);
      gl.drawArrays(gl.LINES, 0, lines.length / 3);
    }
    gl.depthFunc(gl.LEQUAL);
  }

  new ResizeObserver(draw).observe(canvas);

  // --- Mouse: left drag turns, middle (or right) drag moves, wheel zooms, double-click fits ---

  let drag = null;
  canvas.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, button: e.button };
    // Looking round by hand leaves the cutscene's camera.
    if (useFilmCamera) { leaveFilmCamera(); useFilmCamera = false; showFade(); post({ type: "filmCamera", on: false }); }
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("moving");
    if (e.button === 1) e.preventDefault();
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.button === 0 && !e.shiftKey) {
      camera.yaw -= dx * 0.008;
      camera.pitch = Math.max(-1.55, Math.min(1.55, camera.pitch + dy * 0.008));
    } else {
      // Move the target in the plane of the screen, as far as the mouse moved there.
      const e3 = eye();
      const f = norm(sub(camera.target, e3));
      const s = norm(cross(f, [0, 0, 1]));
      const u = cross(s, f);
      const perPixel = 2 * camera.distance * Math.tan(camera.fov / 2) / Math.max(1, canvas.clientHeight);
      for (let k = 0; k < 3; k++) camera.target[k] += (-s[k] * dx + u[k] * dy) * perPixel;
    }
    draw();
  });
  const endDrag = () => { drag = null; canvas.classList.remove("moving"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("auxclick", e => e.preventDefault());
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    // Close enough for a small part of a large model (a lamp of a 132 m pier).
    camera.distance = Math.max(Math.min(0.02, sceneRadius * 0.02), sceneRadius * 0.002, Math.min(sceneRadius * 50, camera.distance * Math.pow(1.15, Math.sign(e.deltaY))));
    draw();
  }, { passive: false });
  canvas.addEventListener("dblclick", fit);

  // --- Messages from and to SparkIV ---

  function post(m) { if (window.chrome && chrome.webview) chrome.webview.postMessage(m); }

  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener("message", e => { if (gl) handle(e.data); });
  }

  function handle(m) {
      // Several at once (a cutscene's next section: its clip, cast, camera, frame), all before the next
      // picture: one by one, a picture came between them (the new clip with the old cast and camera).
      if (m.type === "batch") { for (const one of m.messages) handle(one); }
      else if (m.type === "scene") { setScene(m); }
      else if (m.type === "materials") { setMaterials(m.materials); }
      else if (m.type === "drawDistance") { drawSteps = m.steps || []; draw(); }
      else if (m.type === "visible") { const first = visible.size === 0; visible = new Set(m.ids); findSpots(); if (first || m.fit) fit(); else draw(); }
      else if (m.type === "options") {
        showTextures = m.textures; wireframe = m.wireframe;
        const lightsChanged = showLights !== (m.lights === true);
        showLights = m.lights === true;
        if (lightsChanged) findSpots();
        draw();
      }
      else if (m.type === "spot") { goToSpot(m.step); }
      else if (m.type === "lights") { setLights(m.lights); }
      else if (m.type === "background") { document.body.className = m.name; }
      else if (m.type === "fit") { fit(); }
      else if (m.type === "skeleton") { setSkeleton(m); }
      else if (m.type === "clip") { play(false); setClip(m); if (m.play) play(true); }
      else if (m.type === "play") { play(m.on); }
      else if (m.type === "seek") { play(false); seek(m.frame); }
      // To a frame without stopping: a cutscene follows its sound, which keeps the time.
      else if (m.type === "time") { if (clip) { playback.time = Math.max(0, Math.min(m.frame, clip.frames - 1)) / clip.fps; if (!playback.playing) showFrame(); } }
      // The sound's time (a frame, with its fraction) while playing: followed gently, a few hundredths of
      // a second at a time (a jump only when far off), so the picture doesn't stutter.
      else if (m.type === "sync") {
        if (clip && playback.playing) {
          const d = Math.max(0, Math.min(m.frame, clip.frames - 1)) / clip.fps - playback.time;
          if (Math.abs(d) > 0.4) playback.time += d; else playback.time += d * 0.2;
        }
      }
      else if (m.type === "speed") { playback.speed = m.value; }
      else if (m.type === "loop") { playback.loop = m.on; }
      else if (m.type === "move") { moveInWorld = m.on; showFrame(); }
      else if (m.type === "facials") { showFacials = m.on; showFrame(); }
      else if (m.type === "cast") { setSceneLights(m.lights); setCast(m.actors); }
      else if (m.type === "sceneLights") { showSceneLights = m.on; draw(); }
      else if (m.type === "mapLights") { setMapLights(m.lights, m.rooms); }
      else if (m.type === "sky") { setSky(m); }
      else if (m.type === "useSky") { skyOn = m.on; showSky(); }
      else if (m.type === "camera") { setFilmCamera(m.camera); }
      else if (m.type === "useCamera") { if (!m.on) leaveFilmCamera(); useFilmCamera = m.on; showFade(); draw(); }
      else if (m.type === "fade") { fade = { inEnd: m.inEnd, outStart: m.outStart, outEnd: m.outEnd }; showFade(); }
  }
  post({ type: "ready", webgl: !!gl });
</script>
</body>
</html>
