<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#68788a, #22252a); }
  body.black { background: #000; }
  body.grey { background: #808080; }
  body.white { background: #fff; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.moving { cursor: grabbing; }
  #message { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: rgba(255, 255, 255, 0.8);
             font: 14px "Segoe UI", sans-serif; }
  /* A cutscene's fade to and from black. */
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="fade"></div>
<div id="message"></div>
<script>
  "use strict";
  // A small WebGL 2 renderer for the meshes of a model: textured, lit from the camera, Z up as in the game.
  const canvas = document.getElementById("view");
  const message = document.getElementById("message");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: true, alpha: true, stencil: true });

  const meshes = new Map();      // id → { vao, count, lines, lineCount, material, min, max }
  const materials = new Map();   // id → { texture, glass, color }
  let visible = new Set();
  let showTextures = true;
  let wireframe = false;
  // The model's lights as markers: [{ vao, count, color, meshes }].
  let lights = [];
  let showLights = false;

  // --- Camera: orbits around a target ---
  const camera = { yaw: -0.6, pitch: 0.35, distance: 5, target: [0, 0, 0], fov: 45 * Math.PI / 180 };
  let sceneRadius = 1;
  let backgroundReach = 0;

  if (!gl) {
    message.textContent = "This view needs WebGL 2, which this computer's graphics don't offer.";
  }

  // Skinned meshes (peds) move with up to four bones per vertex: the bones' matrices (from rest pose to
  // the pose shown) are in a float texture, four texels (columns) per bone.
  const VERTEX = `#version 300 es
    in vec3 position; in vec3 normal; in vec2 uv; in vec4 skinBones; in vec4 skinWeights;
    // Terrain: the coordinates of layers 1 and 2, of layer 3, how much each layer covers, the vertex colour.
    in vec4 layerUvA; in vec2 layerUvB; in vec4 layerWeights; in vec3 vertexColor;
    // See-through materials and decals: how much of each vertex shows.
    in float vertexAlpha;
    out vec2 vUv1; out vec2 vUv2; out vec2 vUv3; out vec4 vWeights; out vec3 vColor; out float vAlpha;
    uniform mat4 viewProjection; uniform bool skinned; uniform highp sampler2D boneMatrices;
    // A texture moved by an animation (map objects: signs, screens, flames): its texture matrix's two rows.
    uniform bool uvAnim; uniform vec3 uvRow0; uniform vec3 uvRow1;
    // A light's marker: made round the origin, put at the light, as large as the camera is far (the same
    // size on screen however near).
    uniform bool marker; uniform vec3 markerAt; uniform float markerScale;
    out vec3 vNormal; out vec2 vUv; out vec3 vPosition;
    // The sea near the camera (waterGrid): a grid of points 2 m apart over the window of the game's sea
    // (dynamicMin, 200 m), lifted to the water's level and its height there (dynamicWater), faded out over
    // the window's last 10 m as the game does (none at its edge, a tenth more for each metre in). maskPass:
    // the water's quads drawn from above into the window (where the grid shows; see drawWaterMask).
    uniform bool waterGrid; uniform bool maskPass; uniform highp sampler2D dynamicWater; uniform vec2 dynamicMin; uniform float gridLevel;
    // Floating litter (procedural objects that float): lifted with the sea's height at its centre.
    uniform bool floating; uniform vec2 floatAt;
    uniform float zShift;
    // The mirrored surroundings' map (parabolic: the sky above parabolicAt, the game's file: parabolicPass).
    uniform bool parabolic; uniform vec3 parabolicAt;
    // The sun's shadow map (the game's file: shadowVertex, sunShadowCascades): drawing into a cascade of it.
    uniform bool shadowPass; uniform vec3 shadowU; uniform vec3 shadowV; uniform vec3 shadowH; uniform vec4 shadowCascade; uniform float shadowRef;
    float seaEdge(vec2 inWindow) {
      float metres = floor(min(min(inWindow.x, 200.0 - inWindow.x), min(inWindow.y, 200.0 - inWindow.y)) + 0.001);
      return metres < 1.0 ? 0.0 : metres < 10.0 ? (metres + 1.0) * 0.1 : 1.0;
    }
    mat4 bone(float i) {
      int b = int(i);
      return mat4(texelFetch(boneMatrices, ivec2(0, b), 0), texelFetch(boneMatrices, ivec2(1, b), 0),
                  texelFetch(boneMatrices, ivec2(2, b), 0), texelFetch(boneMatrices, ivec2(3, b), 0));
    }
    void main() {
      vec4 p = marker ? vec4(markerAt + position * markerScale, 1.0) : vec4(position, 1.0);
      vec3 n = normal;
      if (skinned) {
        mat4 m = bone(skinBones.x) * skinWeights.x + bone(skinBones.y) * skinWeights.y +
                 bone(skinBones.z) * skinWeights.z + bone(skinBones.w) * skinWeights.w;
        p = m * p;
        n = mat3(m) * n;
      }
      if (waterGrid) {
        vec2 at = dynamicMin + position.xy;
        p = vec4(at, gridLevel + textureLod(dynamicWater, at / 200.0 + 0.005, 0.0).r * seaEdge(position.xy), 1.0);
      }
      if (floating) p.z += textureLod(dynamicWater, floatAt / 200.0 + 0.005, 0.0).r * seaEdge(floatAt - dynamicMin);
      vNormal = n; vPosition = p.xyz; gl_Position = viewProjection * p;
      // An emissive's glow drawn on its own (glowOnly), pushed back as the game's (its vertex shader's zShift,
      // added to the clip depth: 0 to w there, -w to w here, so twice).
      gl_Position.z += 2.0 * zShift;
      if (parabolic) { ${GameGlsl.parabolicVertex} }
      if (shadowPass) { ${GameGlsl.shadowVertex} }
      if (maskPass) gl_Position = vec4((p.xy - dynamicMin) / 100.0 - 1.0, 0.0, 1.0);
      vUv = uvAnim ? vec2(dot(uvRow0, vec3(uv, 1.0)), dot(uvRow1, vec3(uv, 1.0))) : uv;
      vUv1 = layerUvA.xy; vUv2 = layerUvA.zw; vUv3 = layerUvB; vWeights = layerWeights; vColor = vertexColor; vAlpha = vertexAlpha;
    }`;

  const FRAGMENT = `#version 300 es
    precision highp float;
    in vec3 vNormal; in vec2 vUv; in vec3 vPosition;
    in vec2 vUv1; in vec2 vUv2; in vec2 vUv3; in vec4 vWeights; in vec3 vColor; in float vAlpha;
    uniform sampler2D tex; uniform bool useTexture; uniform bool hasNormal; uniform vec3 color;
    // A vehicle's paint on its texture (its shader: texture x matDiffuseColor, the vehicle's colour); white else.
    uniform vec3 paint;
    // A vehicle's shader (as the game's gta_vehicle_*): its dirt (texture's red x the vehicle's dirt mixes the
    // colour towards dirtColor), its shine and mirrored surroundings by the shader (see the game's file:
    // vehicleShine, vehicleSpec).
    uniform bool vehicle; uniform bool useDirt; uniform sampler2D dirtTex; uniform vec3 dirtColor; uniform float dirtLevel; uniform float reflectivePower;
    uniform bool useEnv; uniform sampler2D envTex;
    // gta_vehicle_paint2's second shine: its colour (the vehicle's third) and the exponent's and strength's
    // factors (see CutsceneMessages.Scene); none while the strength's is 0.
    uniform vec3 spec2Color; uniform vec2 spec2Scale;    uniform vec3 light; uniform vec3 toEye; uniform float alpha; uniform bool lines; uniform bool cutout; uniform bool stipple;
    // Where the camera is (the side of a surface it sees is the one toward it, point by point).
    uniform vec3 eyeAt;
    // See-through by the texture's alpha (the see-through and decal buckets).
    uniform bool textureAlpha;
    // A dirt decal (gta_decal_dirt): the texture's channels in dirtMask say how much shows, the colour is the vertices'.
    uniform bool dirtDecal; uniform vec3 dirtMask;
    // A map object in its place (a cutscene's location): lit mostly by the light baked into its vertex colours
    // (red: as the game's shaders pass it on to the lighting), the view's own light only a little.
    uniform bool baked;
    // How bright the baked light is: the game's light round about indoors is dim (Bernie's flat, whose
    // vertices hold 0.45 on average: the game's picture of bc_1's hall is 48 of 255 bright on average, at
    // 0.55 the view's comes out alike), the lamps and the scene's lights do the rest.
    const float BakedLight = 0.44;
    // The actors' light round about while a location is shown (the rest is the cutscene's lights).
    const float ActorAround = 0.3;
    // A cutscene with its location: graded a little like the game's picture indoors (warmer, less saturated).
    uniform bool grade;
    // A cutscene's own lights and its location's lamps (up to 40), three vec4s each (few uniform slots, so
    // all the lamps of a flat fit): place and range; the way it shines and the cosine of half its cone (-1:
    // all round); colour times strength and a lamp's cone scale (for a cutscene's own light, no inner angle
    // known: -(its room + 2), so -1 outside any room).
    uniform int sceneLights; uniform vec4 sceneLightAt[40]; uniform vec4 sceneLightDir[40]; uniform vec4 sceneLightColor[40];
    // The interior room of what is drawn (-1: none). A cutscene's light lights only what is in its own room,
    // as the game's do (bc_1: the fill light in Bernie's living room lit the hall outside his door through the
    // wall; the walls of the flat, in none of its rooms, aren't lit by them at all).
    uniform int meshRoom;
    // Glowing materials (lamp shades, signs): at full brightness.
    uniform bool emissive;
    // gta_ped_skin's light through the skin: SubColor, and SubScatWrap, SubScatWidth (width 0: none).
    uniform vec3 subColor; uniform vec2 subScatter;
    // gta_emissivestrong: texture x vertex colour x its emissiveMultiplier (0: the texture as it is).
    uniform float emissiveScale; uniform float emissiveGlow; uniform bool glowOnly;
    // Bumps (a normal map, tangent space, its y the other way round as made for Direct3D) and shine (a
    // specular map's channels in specMask, how sharp and how bright); the light comes from the camera.
    uniform bool useNormalMap; uniform sampler2D normalTex; uniform float bumpiness;
    uniform bool useSpecMap; uniform sampler2D specTex; uniform vec3 specMask; uniform float specPower; uniform float specIntensity;
    // The normal map's direction turned into the surface: the surface's directions of u and v from how
    // position and texture coordinates change across the screen (the meshes carry no tangents we read).
    vec3 bumped(vec3 n, vec3 p, vec2 uv) {
      vec3 m = texture(normalTex, uv).xyz * 2.0 - 1.0;
      m.xy *= bumpiness;
      m.y = -m.y;
      vec3 dp1 = dFdx(p), dp2 = dFdy(p);
      vec2 duv1 = dFdx(uv), duv2 = dFdy(uv);
      vec3 dp2perp = cross(dp2, n), dp1perp = cross(n, dp1);
      vec3 t = dp2perp * duv1.x + dp1perp * duv2.x;
      vec3 b = dp2perp * duv1.y + dp1perp * duv2.y;
      float scale = inversesqrt(max(max(dot(t, t), dot(b, b)), 1e-20));
      return normalize(mat3(t * scale, b * scale, n) * m);
    }
    // Terrain: how many layers (1 for anything else), their textures, and which of them are there.
    uniform int layers; uniform sampler2D tex1; uniform sampler2D tex2; uniform sampler2D tex3; uniform vec3 layerOn;
    // A cutscene outside (its location in no room): lit by the sun and the sky as the game's timecyc.dat has
    // them at the time and weather, hazy with distance from where its fog starts to how far it draws, the
    // water the sky's colour the flatter it is seen.
    uniform bool outdoor; uniform vec3 sunDir; uniform vec3 sunColor; uniform vec3 ambientAbove; uniform vec3 ambientBelow;
    uniform vec3 hazeColor; uniform float hazeStart; uniform float hazeEnd;
    // The scene mirrored in the water (drawn first into reflectTex, what lies below clipBelow left out).
    uniform bool reflectOn; uniform sampler2D reflectTex; uniform vec2 screenSize; uniform float clipBelow;
    uniform bool water; uniform bool waterWaves; uniform sampler2D waterSim; uniform highp sampler2D dynamicWater; uniform vec2 dynamicMin; uniform vec3 waterColor;
    // The game's sea round the camera (see the vertex shader): drawn as its grid where the water's quads are
    // (waterMask), the flat quads left out there.
    uniform bool waterGrid; uniform bool maskPass; uniform bool seaOn; uniform sampler2D waterMask; uniform vec3 skyColor; uniform vec3 skyTopColor;
    ${GameGlsl.uniforms}
    layout(location = 0) out vec4 outColor;
    layout(location = 1) out vec4 outLight;
    ${GameGlsl.functions}
    void main() {
      if (maskPass) { outColor = vec4(1.0); return; }
      if (vPosition.z < clipBelow) discard;
      if (lines) { outColor = vec4(color, 1.0); return; }
      if (water && seaOn) {
        vec2 q = (vPosition.xy - dynamicMin) / 200.0;
        bool inside = q.x > 0.0 && q.y > 0.0 && q.x < 1.0 && q.y < 1.0;
        float isWater = inside ? texture(waterMask, q).r : 0.0;
        if (waterGrid ? isWater < 0.5 : isWater >= 0.5) discard;
      }
      vec4 base = useTexture ? texture(tex, vUv) * vec4(paint, 1.0) : vec4(color, 1.0);
      if (vehicle) base.rgb *= vColor;
      float dirtAmount = 0.0;
      if (vehicle && useDirt && dirtLevel > 0.0) {
        float dirt = texture(dirtTex, vUv).r;
        dirtAmount = dirt * dirtLevel;
        if (dirt > 0.0) base.rgb = mix(base.rgb, dirtColor, dirtAmount);
      }
      if (layers > 1) {
        // Each layer over the ones below as far as it covers, masked by its own alpha (scrub in tufts over
        // the sand), as the game's gta_terrain_va_*lyr pixel shader does: lrp(c, layer, layer.a * weight).
        // The vertex colour doesn't tint them: in the game it only dims the light from around (below).
        if (useTexture && layerOn.x > 0.5) { vec4 l = texture(tex1, vUv1); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.y, 0.0, 1.0)); }
        if (useTexture && layers > 2 && layerOn.y > 0.5) { vec4 l = texture(tex2, vUv2); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.z, 0.0, 1.0)); }
        if (useTexture && layers > 3 && layerOn.z > 0.5) { vec4 l = texture(tex3, vUv3); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.w, 0.0, 1.0)); }
        base.a = 1.0;
      }
      if (dirtDecal && useTexture) base = vec4(vColor, dot(base.rgb, dirtMask));
      if (cutout && alpha >= 1.0 && base.a < 0.35) discard;   // cut-outs (leaves, fences, hair)
      // Without normals in the mesh, the face's own normal.
      vec3 n = hasNormal ? normalize(vNormal) : normalize(cross(dFdx(vPosition), dFdy(vPosition)));
      // Drawn into the mirrored surroundings' map (the game's file: parabolicFragment), by the mesh's own normal.
      if (parabolic) { vec3 n0 = n; ${GameGlsl.parabolicFragment} }
      // Drawn into the sun's shadow map (the game's file: shadowFragment).
      if (shadowPass) { ${GameGlsl.shadowFragment} }
      // Both sides lit: the normal turned to the camera, then bent by the normal map.
      if (dot(n, eyeAt - vPosition) < 0.0) n = -n;
      // A map *_reflect shader's mirrored surroundings, added to its albedo before it is lit (GTA IV (PC):
      // gta_spec_reflect's G-buffer pass, the TLAD trace GTAIV.4's pixel shader 0x22F3F120): its environment
      // texture at -0.5 (R.xz / |R| + 1), R the view mirrored by the vertex's normal (the world's z up), x the
      // specular map's channels in specMapIntMask x specularColorFactor x reflectivePower.
      if (useEnv && useTexture) {
        vec3 r = reflect(normalize(vPosition - eyeAt), n);
        vec4 spec = useSpecMap ? texture(specTex, vUv) : vec4(1.0);
        base.rgb += texture(envTex, -0.5 * (r.xz / max(length(r), 1e-5) + 1.0)).rgb * dot(spec.rgb, specMask) * specIntensity * reflectivePower;
      }
      if (useNormalMap && useTexture) n = bumped(n, vPosition, vUv);
      // The light from around, dimmed on terrain by the vertex colour (red by day; hollows and the foot of
      // rocks darker), as the game's gta_terrain_va_*lyr shaders pass it on to the lighting; then the light
      // from the side.
      float around = layers > 1 ? vColor.r : 1.0;
      // With a cutscene's location there is no light from the camera: the map by its baked light and its
      // lamps, the actors by a little light round about and the cutscene's lights.
      float shade = baked ? vColor.r * BakedLight
                  : grade ? ActorAround
                  : 0.35 * around + 0.65 * max(dot(n, light), 0.0);
      // Outside: the light from around and the sun, as the game lights it (the game's file: outsideLight).
      ${GameGlsl.outsideLight}
      // A cutscene's lights on top: fading to nothing at their range, inside a spot's cone (soft at its edge).
      // The view's own light dimmed while they are on, so they show (in the game they are much of the light).
      vec3 lit = outdoor ? outside : vec3(sceneLights > 0 && !baked && !grade ? shade * 0.6 : shade);
      for (int i = 0; i < 40; i++) {
        if (i >= sceneLights) break;
        // A cutscene's light in another room than this: not here.
        float marked = sceneLightColor[i].w;
        if (marked < 0.0 && int(-marked + 0.5) - 2 != meshRoom) continue;
        vec3 l = sceneLightAt[i].xyz - vPosition;
        float range = sceneLightAt[i].w;
        float d = length(l);
        if (d >= range || d < 1e-4) continue;
        l /= d;
        ${GameGlsl.lightFalloff}
        float spot = 1.0;
        float cone = sceneLightDir[i].w;
        if (cone > -1.0) {
          float c = dot(-l, sceneLightDir[i].xyz);
          float scale = sceneLightColor[i].w;
          // (A cutscene's own light, its scale the room it is in: from the outer angle to the inner, half of it.)
          if (scale < 0.0) scale = 1.0 / max(cos(acos(cone) * 0.5) - cone, 1e-3);
          spot = clamp((c - cone) * scale, 0.0, 1.0);
        }
        lit += sceneLightColor[i].rgb * reach * spot * max(dot(n, l), 0.0);
      }
      // The shine, where the surface faces half way between the light and the camera: how bright from the
      // specular map's channels in specMask, how sharp from its alpha, as gta_spec does.
      float shine = 0.0;
      // Not with a cutscene's location: the shine would be the camera's light's (Bernie's back wall, shiny,
      // facing the camera, glared at the same brightness whatever lit it).
      if (specPower > 0.0 && specIntensity > 0.0 && !grade && !outdoor) {
        vec4 spec = useSpecMap && useTexture ? texture(specTex, vUv) : vec4(1.0);
        float where = useSpecMap && useTexture ? dot(spec.rgb, specMask) : 1.0;
        shine = pow(max(dot(n, normalize(light + toEye)), 0.0), max(specPower * spec.a, 1.0)) * specIntensity * where;
      }
      ${GameGlsl.vehicleShine}
      ${GameGlsl.pedShine}
      float a = alpha < 1.0 ? alpha : 1.0;
      if (textureAlpha) {
        a = base.a * vAlpha;
        if (a < 0.01) discard;
        if (stipple) {
          ${GameGlsl.stipple}
        }
      }
      // Skin (gta_ped_skin's G-buffer pass, program 10): the albedo plus 0.5 x SubColor x the texture's alpha in
      // a band at the edge of the sun's light: x = max((n.gDirectionalLight + wrap) / (1 + wrap), 0) (the
      // direction the light goes, -sunDir), smoothstep(0, width, x) x smoothstep(2 width, width, x).
      if (outdoor && subScatter.y > 0.0) {
        float x = max((dot(n, -sunDir) + subScatter.x) / (1.0 + subScatter.x), 0.0);
        float band = smoothstep(0.0, subScatter.y, x) * (1.0 - smoothstep(subScatter.y, 2.0 * subScatter.y, x));
        base.rgb += 0.5 * band * subColor * base.a;
      }
      // A vehicle's glass (gta_vehicle_vehglass, technique draw, program 8): its shine and mirrored surroundings
      // (vehicleShine) divided by its alpha (1 / alpha, 100 below 0.01) before the blend multiplies them by it
      // again, so they show whole on clear glass; the glass itself (the lit texture) only by the alpha.
      float glassShine = vehicleGlass ? (a >= 0.01 ? 1.0 / a : 100.0) : 1.0;
      vec3 rgb = emissive && !outdoor ? (emissiveScale > 0.0 ? base.rgb * vColor * emissiveScale : base.rgb) : base.rgb * lit + shine + vehicleShine * glassShine + pedShine;
      if (glowOnly) rgb = base.rgb * vColor * emissiveGlow;
      else if (emissive && outdoor) rgb += base.rgb * vColor * emissiveGlow;
      // Outside the light itself goes out too (outLight), for the game's post effects (bloom, its tone mapping,
      // the eye's adaptation: the game's file, gamePost); the picture (outColor) for the mirrored scene.
      vec3 lightOut = vec3(0.0);
      if (outdoor) {
        // The game's fog on the light, then into the picture as its tone mapping makes it (the game's file:
        // gameFog, gameToneMap).
        float distance = length(eyeAt - vPosition);
        // (An emissive's glow on its own: added to what is there, without fog, as the game's 0x237E6100.)
        lightOut = glowOnly ? rgb : gameFog(rgb, distance);
        rgb = gameToneMap(lightOut);
        if (water) {
          ${GameGlsl.water}
        }
        // SparkIV's own: the last fifth before the end of what it draws (nearer than the game's far clip) faded
        // into the haze's colour, so the world doesn't stop at an edge.
        float edge = glowOnly ? 0.0 : clamp((distance - hazeEnd * 0.8) / max(hazeEnd * 0.2, 1.0), 0.0, 1.0);
        lightOut = mix(lightOut, gameToneUnmap(hazeColor), edge);
        rgb = mix(rgb, hazeColor, edge);
      }
      else if (grade) {
        float grey = dot(rgb, vec3(0.299, 0.587, 0.114));
        rgb = mix(vec3(grey), rgb, 0.7) * vec3(1.06, 1.0, 0.9);
      }
      outColor = vec4(rgb * a, a);
      outLight = vec4(lightOut * a, outdoor ? a : 0.0);
    }`;

  // A uniform set to the value it already has isn't sent again: each mesh sets some forty, most the same
  // as the mesh before, and with thousands of meshes (a cutscene outside, mirrored in the water) the calls
  // themselves were what made the picture stutter. Per location (each program has its own).
  if (gl) {
    const sent = new Map();
    const same = (a, b) => { if (a === b) return true; if (!a || !b || a.length !== b.length || typeof a === "number") return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; };
    for (const name of ["uniform1i", "uniform1f", "uniform2f", "uniform3fv"]) {
      const call = gl[name].bind(gl);
      gl[name] = (where, ...value) => {
        if (where === null) return;
        const v = value.length === 1 ? (typeof value[0] === "number" || typeof value[0] === "boolean" ? value[0] : Array.from(value[0])) : value;
        if (sent.has(where) && same(sent.get(where), v)) return;
        sent.set(where, v);
        call(where, ...value);
      };
    }
  }
  let program, loc;
  if (gl) {
    program = createProgram(VERTEX, FRAGMENT);
    loc = {
      position: gl.getAttribLocation(program, "position"),
      normal: gl.getAttribLocation(program, "normal"),
      uv: gl.getAttribLocation(program, "uv"),
      skinBones: gl.getAttribLocation(program, "skinBones"),
      skinWeights: gl.getAttribLocation(program, "skinWeights"),
      skinned: gl.getUniformLocation(program, "skinned"),
      boneMatrices: gl.getUniformLocation(program, "boneMatrices"),
      viewProjection: gl.getUniformLocation(program, "viewProjection"),
      tex: gl.getUniformLocation(program, "tex"),
      useTexture: gl.getUniformLocation(program, "useTexture"),
      hasNormal: gl.getUniformLocation(program, "hasNormal"),
      color: gl.getUniformLocation(program, "color"),
      paint: gl.getUniformLocation(program, "paint"),
      vehicle: gl.getUniformLocation(program, "vehicle"),
      useDirt: gl.getUniformLocation(program, "useDirt"),
      dirtTex: gl.getUniformLocation(program, "dirtTex"),
      dirtColor: gl.getUniformLocation(program, "dirtColor"),
      dirtLevel: gl.getUniformLocation(program, "dirtLevel"),
      reflectivePower: gl.getUniformLocation(program, "reflectivePower"),
      useEnv: gl.getUniformLocation(program, "useEnv"),
      envTex: gl.getUniformLocation(program, "envTex"),
      spec2Color: gl.getUniformLocation(program, "spec2Color"),
      spec2Scale: gl.getUniformLocation(program, "spec2Scale"),      light: gl.getUniformLocation(program, "light"),
      toEye: gl.getUniformLocation(program, "toEye"),
      alpha: gl.getUniformLocation(program, "alpha"),
      lines: gl.getUniformLocation(program, "lines"),
      cutout: gl.getUniformLocation(program, "cutout"),
      stipple: gl.getUniformLocation(program, "stipple"),
      uvAnim: gl.getUniformLocation(program, "uvAnim"),
      uvRow0: gl.getUniformLocation(program, "uvRow0"),
      uvRow1: gl.getUniformLocation(program, "uvRow1"),

        const side = norm(cross(d, Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
        const up = cross(side, d);
        const half = Math.max(1, Math.min(89, l.falloff || 30)) * Math.PI / 180;
        const r = Math.tan(half) * length;
        const end = [x + d[0] * length, y + d[1] * length, z + d[2] * length];
        const rim = [];
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
          rim.push([end[0] + side[0] * c + up[0] * s, end[1] + side[1] * c + up[1] * s, end[2] + side[2] * c + up[2] * s]);
        }
        lines.push(x, y, z, ...end);
        for (let i = 0; i < 12; i++) {
          lines.push(...rim[i], ...rim[(i + 1) % 12]);
          if (i % 3 === 0) lines.push(x, y, z, ...rim[i]);
        }
      }
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      bindSkin(null);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
      gl.enableVertexAttribArray(loc.position);
      gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      // A light that is black (some are) still shows, grey.
      const color = l.color.some(c => c > 0.05) ? l.color : [0.6, 0.6, 0.6];
      return { vao, count: lines.length / 3, color, meshes: l.meshes, position: l.position };
    });
    findSpots();
    draw();
  }

  // --- Spots: the places of a model whose parts lie far apart (et_pierlight05: seven lamps along 132 m
  // of pier), to go through one after the other ---
  //
  // The triangles shown are put on a grid of cells a 40th of the model across (each into the cells of its
  // box: a wall's few vertices alone would leave the cells between them empty); cells touching each other
  // (also corner to corner) are one spot. A light joins the spot it is at, or is a spot of its own (a
  // light rig: one tiny triangle, its lights metres away). Offered only when the spots are small beside
  // the model (lamps along a pier; not three blocks of a building) and there are 2 to 80.
  let spots = [];
  let spotIndex = -1;

  function findSpots() {
    spots = [];
    spotIndex = -1;
    const shownLights = showLights ? lights.filter(l => l.meshes.some(id => visible.has(id))) : [];
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    let vertices = 0;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      vertices += m.positions.length / 3;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    for (const l of shownLights) for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], l.position[k]); max[k] = Math.max(max[k], l.position[k]); }
    if (min[0] === Infinity) { reportSpot(); return; }
    const cell = Math.max(1e-3, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 40);
    const key = (x, y, z) => x + "," + y + "," + z;
    // Each cell's box (the part of the triangles' boxes in it); very large models are sampled (every n-th
    // triangle), which still finds the parts.
    const cells = new Map();
    const index = c => Math.min(39, Math.max(0, Math.floor(c)));
    let triangles = 0;
    for (const id of visible) { const m = meshes.get(id); if (m) triangles += m.indices.length / 3; }
    const stride = Math.max(1, Math.floor(triangles / 200000)) * 3;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      const p = m.positions, t = m.indices;
      for (let i = 0; i + 2 < t.length; i += stride) {
        const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
        for (let v = 0; v < 3; v++) for (let a = 0; a < 3; a++) {
          const value = p[t[i + v] * 3 + a];
          lo[a] = Math.min(lo[a], value); hi[a] = Math.max(hi[a], value);
        }
        const from = lo.map((v, a) => index((v - min[a]) / cell)), to = hi.map((v, a) => index((v - min[a]) / cell));
        for (let ix = from[0]; ix <= to[0]; ix++) for (let iy = from[1]; iy <= to[1]; iy++) for (let iz = from[2]; iz <= to[2]; iz++) {
          const k = key(ix, iy, iz);
          const cellLo = [min[0] + ix * cell, min[1] + iy * cell, min[2] + iz * cell];
          const partLo = lo.map((v, a) => Math.max(v, cellLo[a])), partHi = hi.map((v, a) => Math.min(v, cellLo[a] + cell));
          let c = cells.get(k);
          if (!c) cells.set(k, c = { ix, iy, iz, min: partLo, max: partHi, spot: -1 });
          else for (let a = 0; a < 3; a++) { c.min[a] = Math.min(c.min[a], partLo[a]); c.max[a] = Math.max(c.max[a], partHi[a]); }
        }
      }
    }
    // Touching cells into spots.
    const found = [];
    for (const start of cells.values()) {
      if (start.spot >= 0) continue;
      const spot = { min: start.min.slice(), max: start.max.slice() };
      start.spot = found.length;
      const queue = [start];
      while (queue.length) {
        const c = queue.pop();
        for (let a = 0; a < 3; a++) { spot.min[a] = Math.min(spot.min[a], c.min[a]); spot.max[a] = Math.max(spot.max[a], c.max[a]); }
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
          const n = cells.get(key(c.ix + dx, c.iy + dy, c.iz + dz));
          if (n && n.spot < 0) { n.spot = found.length; queue.push(n); }
        }
      }
      found.push(spot);
      if (found.length > 80) { reportSpot(); return; }
    }
    // Lights to the spot they are at, else a spot of their own.
    for (const l of shownLights) {
      const near = found.find(s => [0, 1, 2].every(a => l.position[a] >= s.min[a] - cell && l.position[a] <= s.max[a] + cell));
      if (near) {
        for (let a = 0; a < 3; a++) { near.min[a] = Math.min(near.min[a], l.position[a]); near.max[a] = Math.max(near.max[a], l.position[a]); }
      } else {
        found.push({ min: l.position.map(v => v - cell / 2), max: l.position.map(v => v + cell / 2) });
      }
    }
    // Small beside the model: the middle spot (by size) under a fifth of the model across.
    const across = s => Math.hypot(s.max[0] - s.min[0], s.max[1] - s.min[1], s.max[2] - s.min[2]);
    const sizes = found.map(across).sort((a, b) => a - b);
    const small = sizes.length > 0 && sizes[Math.floor(sizes.length / 2)] < cell * 40 / 5;
    if (found.length >= 2 && found.length <= 80 && small) {
      // In order along the model's longest side, then across it.
      const long = [0, 1, 2].sort((a, b) => (max[b] - min[b]) - (max[a] - min[a]));
      const centre = s => s.min.map((v, a) => (v + s.max[a]) / 2);
      spots = found.sort((p, q) => {
        const a = centre(p), b = centre(q);
        return Math.abs(a[long[0]] - b[long[0]]) > cell ? a[long[0]] - b[long[0]] : a[long[1]] - b[long[1]];
      });
    }
    reportSpot();
  }

  function reportSpot() { post({ type: "spot", index: spotIndex, count: spots.length }); }

  // To the next (+1) or previous (-1) spot: looked at from where the camera looks now, filling the view.
  function goToSpot(step) {
    if (!spots.length) return;
    spotIndex = spotIndex < 0 ? (step > 0 ? 0 : spots.length - 1) : (spotIndex + step + spots.length) % spots.length;
    const s = spots[spotIndex];
    camera.target = s.min.map((v, a) => (v + s.max[a]) / 2);
    camera.distance = fitDistance(s.min, s.max, true);
    reportSpot();
    draw();
  }

  // The same meshes with new textures (one was replaced): the old textures go, the new ones are loaded.
  function setMaterials(list) {
    for (const material of materials.values()) {
      for (const t of [material.texture, material.normal, material.specular, material.environment, ...material.layers]) if (t) gl.deleteTexture(t);
    }
    materials.clear();
    for (const m of list) addMaterial(m);
    draw();
  }

  function setScene(scene) {
    const started = performance.now();
    if (scene.packs) for (const pack of scene.packs) addPack(pack);
    for (const m of scene.materials) addMaterial(m);
    for (const m of scene.meshes) addMesh(m);
    sceneSeconds = (performance.now() - started) / 1000;
    message.textContent = scene.meshes.length ? "" : "This model has no meshes.";
    if (texturesLoading === 0) post({ type: "loaded", sceneSeconds });
  }

  // Textures sent together (a cutscene's location: two thousand one by one took SparkIV and the page
  // longer than the textures themselves): one request for many, "SXP1", then each texture's length and bytes
  // in the order of the pack's list of their urls; a url in it is taken from there, not asked for.
  const packed = new Map();
  function addPack(pack) {
    const parts = fetch(pack.url)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(buffer => {
        const v = new DataView(buffer), list = [];
        let at = 4;
        while (at + 4 <= buffer.byteLength && list.length < pack.textures.length) {
          const length = v.getUint32(at, true);
          list.push(buffer.slice(at + 4, at + 4 + length));
          at += 4 + length;
        }
        return list;
      });
    pack.textures.forEach((url, i) => packed.set(url, parts.then(list => list[i] || Promise.reject())));
  }

  // --- Skeleton and animation (peds) ---
  //
  // A bone's place relative to its parent: translate by its offset, turn by its quaternion; down the
  // chain world = parent * local (column vectors). A vertex moves with world * inverse(rest world).
  // Checked against OpenIV's .skel: the rest pose built so is the bones' WorldOffset.

  let skeleton = null;      // { parent[], position[] (3 per bone), rotation[] (4 per bone), inverseRest[] (mat4) }
  let clip = null;          // { frames, fps, tracks: [{ bone, kind: "position"|"rotation", values }], mover, facials }
  // Moving through the world (the clip's model tracks): the camera follows, a grid on the ground shows it.
  let moveInWorld = false;
  // Facial clips started by the clip, playing on the face's bones.
  let showFacials = true;
  let lastMover = null;
  let boneTexture = null;
  const playback = { playing: false, time: 0, speed: 1, loop: true, last: 0, reportedFrame: -1 };

  function mat4FromQuat(q, t) {
    const [x, y, z, w] = q;
    return [
      1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w), 0,
      2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w), 0,
      2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y), 0,
      t[0], t[1], t[2], 1,
    ];
  }

  // Column-major 4x4 product a * b.
  function mul(a, b) {
    const r = new Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += a[k * 4 + rr] * b[c * 4 + k];
      r[c * 4 + rr] = v;
    }
    return r;
  }

  // Inverse of a rotation + translation.
  function inverseRigid(m) {
    const r = [m[0], m[4], m[8], 0, m[1], m[5], m[9], 0, m[2], m[6], m[10], 0, 0, 0, 0, 1];
    r[12] = -(r[0] * m[12] + r[4] * m[13] + r[8] * m[14]);
    r[13] = -(r[1] * m[12] + r[5] * m[13] + r[9] * m[14]);
    r[14] = -(r[2] * m[12] + r[6] * m[13] + r[10] * m[14]);
    return r;
  }

  function worldMatrices(position, rotation, s = skeleton) {
    const n = s.parent.length, world = new Array(n);
    const of = i => {
      if (!world[i]) {
        const local = mat4FromQuat(rotation.slice(i * 4, i * 4 + 4), position.slice(i * 3, i * 3 + 3));
        const p = s.parent[i];
        world[i] = p >= 0 && p < n && p !== i ? mul(of(p), local) : local;
      }
      return world[i];
    };
    for (let i = 0; i < n; i++) of(i);
    return world;
  }

  // Quaternions (x, y, z, w).
  function qmul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
  }
  const qconj = q => [-q[0], -q[1], -q[2], q[3]];
  function qnorm(q) { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return q.map(v => v / l); }

  // Helper bones the game turns itself, not the animations (twist and roll bones): a bone without a track
  // at the same place under the same parent as one with a track (Char_R_ForeTwist beside Char_R_Forearm,
  // R_ArmRoll beside Char_R_UpperArm) moves as that one does; the skin of the arm hangs on them. A twist
  // bone also takes half of the hand's turn about the arm, so the wrist doesn't wring. "The same place"
  // within 3 cm: Johnny's R_ArmRoll is 7 mm beside his upper arm (Niko's exactly on it); the next bones
  // of an arm are 15 to 30 cm apart.
  function findFollowers(sk = skeleton, cl = clip) {
    sk.followers = [];
    if (!cl) return;
    const tracked = new Set(cl.tracks.filter(t => t.kind === "rotation").map(t => t.bone));
    const n = sk.parent.length;
    const at = i => sk.position.slice(i * 3, i * 3 + 3);
    for (let b = 0; b < n; b++) {
      // Only helper bones (named so): a finger without a track (the little one in many clips) keeps its rest.
      const helperName = (sk.names && sk.names[b]) || "";
      // A forearm's twist bone always so, its track or not: in et01_ba (TLAD) the toll booth man's clip turns
      // Char_L_ForeTwist 40° away from his forearm, and the game shows his sleeve straight to the hand (its
      // video), so the game turns the twist bone itself; the cutscene peds' tracks keep it on the forearm anyway.
      if ((tracked.has(b) && !/foretwist/i.test(helperName)) || !/roll|twist/i.test(helperName)) continue;
      // The nearest tracked sibling, if near enough (and not at the parent itself: then it just moves with it).
      const pb = at(b);
      let leader = -1, nearest = 0.03;
      for (let s = 0; s < n; s++) {
        if (s === b || !tracked.has(s) || sk.parent[s] !== sk.parent[b]) continue;
        const ps = at(s);
        const d = Math.hypot(pb[0] - ps[0], pb[1] - ps[1], pb[2] - ps[2]);
        if (d <= nearest && Math.hypot(ps[0], ps[1], ps[2]) >= 0.03) { nearest = d; leader = s; }
      }
      if (leader < 0) continue;
      const name = (sk.names && sk.names[b]) || "";
      let twistFrom = -1;
      if (/twist/i.test(name)) {
        for (let c = 0; c < n; c++) if (sk.parent[c] === leader && tracked.has(c)) { twistFrom = c; break; }
      }
      sk.followers.push({ bone: b, leader, twistFrom });
    }
  }

  // A skeleton from SparkIV, its rest pose worked out once, with a texture for its bone matrices.
  function makeSkeleton(s) {
    const sk = { parent: s.parent, position: s.position, rotation: s.rotation, names: s.names, followers: [] };
    sk.inverseRest = worldMatrices(s.position, s.rotation, sk).map(inverseRigid);
    sk.texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sk.texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    return sk;
  }

  function setSkeleton(s) {
    skeleton = makeSkeleton(s);
    boneTexture = skeleton.texture;
    findFollowers();
    pose(clip ? currentFrame() : null);
  }

  // The bones of a pose: the clip's tracks over the rest, the facial clip playing then, the helper bones.
  // Returns the local positions and rotations.
  function sampledPose(sk, cl, frame) {
    const position = sk.position.slice(), rotation = sk.rotation.slice();
    if (!cl || frame === null) return { position, rotation };
    for (const track of cl.tracks) sample(track, frame, cl.frames, track.kind === "position" ? position : rotation, track.bone);
    // Facial clips: the one started last at or before this frame plays on the face's bones, from its
    // start, until it ends (over the body clip's face, if it has one).
    if (showFacials && cl.facials) {
      let facial = null;
      for (const f of cl.facials) if (f.start <= frame) facial = f;
      if (facial) {
        const local = (frame - facial.start) / cl.fps * facial.fps;
        if (local <= facial.frames - 1) {
          for (const track of facial.tracks) sample(track, local, facial.frames, track.kind === "position" ? position : rotation, track.bone);
        }
      }
    }
    // Helper bones: the leader's turn away from its rest, applied to the helper's rest.
    const restOf = i => sk.rotation.slice(i * 4, i * 4 + 4);
    const nowOf = i => rotation.slice(i * 4, i * 4 + 4);
    for (const f of sk.followers) {
      let q = qmul(qmul(nowOf(f.leader), qconj(restOf(f.leader))), restOf(f.bone));
      if (f.twistFrom >= 0) {
        // The hand's turn away from its rest, about the arm's long axis (x), half of it.
        const d = qmul(nowOf(f.twistFrom), qconj(restOf(f.twistFrom)));
        let twist = qnorm([d[0], 0, 0, d[3]]);
        if (twist[3] < 0) twist = twist.map(v => -v);
        // Half the angle of a turn q (w >= 0) is normalize(q + 1).
        q = qmul(q, qnorm([twist[0], 0, 0, twist[3] + 1]));
      }
      q = qnorm(q);
      for (let k = 0; k < 4; k++) rotation[f.bone * 4 + k] = q[k];
    }
    return { position, rotation };
  }

  // The bone matrices of world bones into the skeleton's texture (what skinned vertices move by).
  function uploadBones(sk, world) {
    const data = new Float32Array(world.length * 16);
    for (let i = 0; i < world.length; i++) data.set(mul(world[i], sk.inverseRest[i]), i * 16);
    gl.bindTexture(gl.TEXTURE_2D, sk.texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, world.length, 0, gl.RGBA, gl.FLOAT, data);
  }

  // --- A cutscene's cast ---
  //
  // Every actor (a ped, a prop) has its own skeleton and clip, all on the one timeline (the clip without
  // tracks the main clip then is). A ped's clip places it in the scene by its model tracks (root); a prop's
  // root bone holds its place itself.
  const cast = new Map();   // id → { skeleton, clip, root: { position, rotation } | null }

  // The scene's own lights (cutscenes): per frame place, colour, range, strength, cone and direction.
  let sceneLights = [];
  let showSceneLights = true;

  function setSceneLights(list) {
    const floats = v => v ? new Float32Array(bytes(v).buffer) : null;
    sceneLights = (list || []).map(l => ({
      name: l.name, frames: l.frames, fps: l.fps,
      position: floats(l.position), color: floats(l.color), range: floats(l.range),
      intensity: floats(l.intensity), cone: floats(l.cone), direction: floats(l.direction),
    }));
  }

  // The lights of a cutscene's location (lamps, wall lights in its models: the light the game puts there),
  // fixed: place, direction, colour, range, cone (cosine of half, -1 all round).
  let mapLights = [];
  // How bright a lamp is: its colour (0 to 1) times its strength as the game adds it to the light.
  const MapLightScale = 0.6;
  const MaxLights = 40;

  // The rooms of the location's interiors: the interior's place, the turn from the scene into it, the room's
  // box there. What is in which: a map object by the interior's list (its mesh's room), an actor and a
  // cutscene's light by where it is, the first room in the list whose box holds it. The boxes overlap (Bernie's
  // living room's holds the hall outside his door): bc_1's lights at his door (spt_dr, fil_dr, rim_nko_dr,
  // all at Niko there) and Niko are in the living room so, the hall's trim and walls not lit by them, as in
  // the game (by the smallest box the spot was in the hall and lit its door frame).
  let rooms = [];

  function roomOf(p) {
    return rooms.findIndex(r => {
      const d = [p[0] - r.at[0], p[1] - r.at[1], p[2] - r.at[2], 0];
      const v = qmul(qmul(r.turn, d), qconj(r.turn));
      for (let k = 0; k < 3; k++) if (v[k] < r.min[k] || v[k] > r.max[k]) return false;
      return true;
    });
  }

  // A cutscene outside: the sun and sky of its time and weather (see the "sky" message); null inside.
  // The sky as the game shows it at noon is a pale blue, whitish towards the horizon: timecyc.dat's sky
  // colours are its shader's, not the picture's (SUNNY: the top almost black, the bottom deep blue), so the
  // colours shown are taken from them lighter (a guess, matched by eye to the game's picture of bc_3).
  let sky = null;
  // Whether the sky is shown (SparkIV: the location on); off, the background chosen is the view's and the
  // actors are lit as without a location.
  let skyOn = true;
  function showSky() {
    const css = c => "rgb(" + c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255)).join(",") + ")";
    document.body.style.background = sky && skyOn ? "linear-gradient(" + css(sky.zenith) + ", " + css(sky.horizon) + " 55%, " + css(sky.horizon) + ")" : "";
    draw();
  }
  // The time cycle outside, and per room of the location (the list of rooms) as its modifier changes it (null:
  // none); sky is the one the camera is in, as the game sets the modifier of the room the camera is in.
  let skyOutside = null, skyRooms = [];
  function setSky(m) {
    const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    // Matched to the game's clear sky in bc_3 (08:18 in the video): 179 227 252 low over the horizon, 163 209
    // 235 some 30 degrees up.
    const make = s => ({ ...s, horizon: mix(s.skyBottom, [0.825, 0.959, 0.988], 0.8), zenith: mix(s.skyBottom, [0.747, 0.857, 0.853], 0.75) });
    skyOutside = make(m);
    skyRooms = (m.rooms || []).map(r => r ? make({ ...m, ...r }) : null);
    sky = skyOutside;
    if (m.clouds && !cloudTex) loadTexture(m.clouds, t => cloudTex = t);
    if (m.cloudDetail && !cloudDetailTex) loadTexture(m.cloudDetail, t => cloudDetailTex = t);
    showSky();
  }
  function skyAtCamera() {
    if (!skyOutside) return;
    const film = filmView();
    const room = skyRooms.length ? roomOf(film ? film.eye : eye()) : -1;
    sky = (room >= 0 && skyRooms[room]) || skyOutside;
  }

  // The sky outside, drawn behind everything: from the horizon's colour up to the top's, the sun, and the
  // clouds as the game's gta_atmoscatt_clouds.fxc makes them: their noise (red: the shape) and its fine
