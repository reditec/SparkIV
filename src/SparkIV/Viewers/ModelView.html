<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#68788a, #22252a); }
  body.black { background: #000; }
  body.grey { background: #808080; }
  body.white { background: #fff; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.moving { cursor: grabbing; }
  #message { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: rgba(255, 255, 255, 0.8);
             font: 14px "Segoe UI", sans-serif; }
  /* A cutscene's fade to and from black. */
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="fade"></div>
<div id="message"></div>
<script>
  "use strict";
  // A small WebGL 2 renderer for the meshes of a model: textured, lit from the camera, Z up as in the game.
  const canvas = document.getElementById("view");
  const message = document.getElementById("message");
  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: true, alpha: true });

  const meshes = new Map();      // id → { vao, count, lines, lineCount, material, min, max }
  const materials = new Map();   // id → { texture, glass, color }
  let visible = new Set();
  let showTextures = true;
  let wireframe = false;
  // The model's lights as markers: [{ vao, count, color, meshes }].
  let lights = [];
  let showLights = false;

  // --- Camera: orbits around a target ---
  const camera = { yaw: -0.6, pitch: 0.35, distance: 5, target: [0, 0, 0], fov: 45 * Math.PI / 180 };
  let sceneRadius = 1;
  let backgroundReach = 0;

  if (!gl) {
    message.textContent = "This view needs WebGL 2, which this computer's graphics don't offer.";
  }

  // Skinned meshes (peds) move with up to four bones per vertex: the bones' matrices (from rest pose to
  // the pose shown) are in a float texture, four texels (columns) per bone.
  const VERTEX = `#version 300 es
    in vec3 position; in vec3 normal; in vec2 uv; in vec4 skinBones; in vec4 skinWeights;
    // Terrain: the coordinates of layers 1 and 2, of layer 3, how much each layer covers, the vertex colour.
    in vec4 layerUvA; in vec2 layerUvB; in vec4 layerWeights; in vec3 vertexColor;
    // See-through materials and decals: how much of each vertex shows.
    in float vertexAlpha;
    out vec2 vUv1; out vec2 vUv2; out vec2 vUv3; out vec4 vWeights; out vec3 vColor; out float vAlpha;
    uniform mat4 viewProjection; uniform bool skinned; uniform highp sampler2D boneMatrices;
    // A texture moved by an animation (map objects: signs, screens, flames): its texture matrix's two rows.
    uniform bool uvAnim; uniform vec3 uvRow0; uniform vec3 uvRow1;
    // A light's marker: made round the origin, put at the light, as large as the camera is far (the same
    // size on screen however near).
    uniform bool marker; uniform vec3 markerAt; uniform float markerScale;
    out vec3 vNormal; out vec2 vUv; out vec3 vPosition;
    mat4 bone(float i) {
      int b = int(i);
      return mat4(texelFetch(boneMatrices, ivec2(0, b), 0), texelFetch(boneMatrices, ivec2(1, b), 0),
                  texelFetch(boneMatrices, ivec2(2, b), 0), texelFetch(boneMatrices, ivec2(3, b), 0));
    }
    void main() {
      vec4 p = marker ? vec4(markerAt + position * markerScale, 1.0) : vec4(position, 1.0);
      vec3 n = normal;
      if (skinned) {
        mat4 m = bone(skinBones.x) * skinWeights.x + bone(skinBones.y) * skinWeights.y +
                 bone(skinBones.z) * skinWeights.z + bone(skinBones.w) * skinWeights.w;
        p = m * p;
        n = mat3(m) * n;
      }
      vNormal = n; vPosition = p.xyz; gl_Position = viewProjection * p;
      vUv = uvAnim ? vec2(dot(uvRow0, vec3(uv, 1.0)), dot(uvRow1, vec3(uv, 1.0))) : uv;
      vUv1 = layerUvA.xy; vUv2 = layerUvA.zw; vUv3 = layerUvB; vWeights = layerWeights; vColor = vertexColor; vAlpha = vertexAlpha;
    }`;

  const FRAGMENT = `#version 300 es
    precision highp float;
    in vec3 vNormal; in vec2 vUv; in vec3 vPosition;
    in vec2 vUv1; in vec2 vUv2; in vec2 vUv3; in vec4 vWeights; in vec3 vColor; in float vAlpha;
    uniform sampler2D tex; uniform bool useTexture; uniform bool hasNormal; uniform vec3 color;
    uniform vec3 light; uniform vec3 toEye; uniform float alpha; uniform bool lines; uniform bool cutout;
    // Where the camera is (the side of a surface it sees is the one toward it, point by point).
    uniform vec3 eyeAt;
    // See-through by the texture's alpha (the see-through and decal buckets).
    uniform bool textureAlpha;
    // A dirt decal (gta_decal_dirt): the texture's channels in dirtMask say how much shows, the colour is the vertices'.
    uniform bool dirtDecal; uniform vec3 dirtMask;
    // A map object in its place (a cutscene's location): lit mostly by the light baked into its vertex colours
    // (red: as the game's shaders pass it on to the lighting), the view's own light only a little.
    uniform bool baked;
    // How bright the baked light is: the game's light round about indoors is dim (Bernie's flat, whose
    // vertices hold 0.45 on average: the game's picture of bc_1's hall is 48 of 255 bright on average, at
    // 0.55 the view's comes out alike), the lamps and the scene's lights do the rest.
    const float BakedLight = 0.44;
    // The actors' light round about while a location is shown (the rest is the cutscene's lights).
    const float ActorAround = 0.3;
    // A cutscene with its location: graded a little like the game's picture indoors (warmer, less saturated).
    uniform bool grade;
    // A cutscene's own lights and its location's lamps (up to 40), three vec4s each (few uniform slots, so
    // all the lamps of a flat fit): place and range; the way it shines and the cosine of half its cone (-1:
    // all round); colour times strength and a lamp's cone scale (for a cutscene's own light, no inner angle
    // known: -(its room + 2), so -1 outside any room).
    uniform int sceneLights; uniform vec4 sceneLightAt[40]; uniform vec4 sceneLightDir[40]; uniform vec4 sceneLightColor[40];
    // The interior room of what is drawn (-1: none). A cutscene's light lights only what is in its own room,
    // as the game's do (bc_1: the fill light in Bernie's living room lit the hall outside his door through the
    // wall; the walls of the flat, in none of its rooms, aren't lit by them at all).
    uniform int meshRoom;
    // Glowing materials (lamp shades, signs): at full brightness.
    uniform bool emissive;
    // Bumps (a normal map, tangent space, its y the other way round as made for Direct3D) and shine (a
    // specular map's channels in specMask, how sharp and how bright); the light comes from the camera.
    uniform bool useNormalMap; uniform sampler2D normalTex; uniform float bumpiness;
    uniform bool useSpecMap; uniform sampler2D specTex; uniform vec3 specMask; uniform float specPower; uniform float specIntensity;
    // The normal map's direction turned into the surface: the surface's directions of u and v from how
    // position and texture coordinates change across the screen (the meshes carry no tangents we read).
    vec3 bumped(vec3 n, vec3 p, vec2 uv) {
      vec3 m = texture(normalTex, uv).xyz * 2.0 - 1.0;
      m.xy *= bumpiness;
      m.y = -m.y;
      vec3 dp1 = dFdx(p), dp2 = dFdy(p);
      vec2 duv1 = dFdx(uv), duv2 = dFdy(uv);
      vec3 dp2perp = cross(dp2, n), dp1perp = cross(n, dp1);
      vec3 t = dp2perp * duv1.x + dp1perp * duv2.x;
      vec3 b = dp2perp * duv1.y + dp1perp * duv2.y;
      float scale = inversesqrt(max(max(dot(t, t), dot(b, b)), 1e-20));
      return normalize(mat3(t * scale, b * scale, n) * m);
    }
    // Terrain: how many layers (1 for anything else), their textures, and which of them are there.
    uniform int layers; uniform sampler2D tex1; uniform sampler2D tex2; uniform sampler2D tex3; uniform vec3 layerOn;
    // A cutscene outside (its location in no room): lit by the sun and the sky as the game's timecyc.dat has
    // them at the time and weather, hazy with distance from where its fog starts to how far it draws, the
    // water the sky's colour the flatter it is seen.
    uniform bool outdoor; uniform vec3 sunDir; uniform vec3 sunColor; uniform vec3 ambientAbove; uniform vec3 ambientBelow;
    uniform vec3 hazeColor; uniform float hazeStart; uniform float hazeEnd;
    uniform bool water; uniform vec3 waterColor; uniform vec3 skyColor;
    out vec4 outColor;
    void main() {
      if (lines) { outColor = vec4(color, 1.0); return; }
      vec4 base = useTexture ? texture(tex, vUv) : vec4(color, 1.0);
      if (layers > 1) {
        // Each layer over the ones below as far as it covers, masked by its own alpha (scrub in tufts over
        // the sand), as the game's gta_terrain_va_*lyr pixel shader does: lrp(c, layer, layer.a * weight).
        // The vertex colour doesn't tint them: in the game it only dims the light from around (below).
        if (useTexture && layerOn.x > 0.5) { vec4 l = texture(tex1, vUv1); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.y, 0.0, 1.0)); }
        if (useTexture && layers > 2 && layerOn.y > 0.5) { vec4 l = texture(tex2, vUv2); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.z, 0.0, 1.0)); }
        if (useTexture && layers > 3 && layerOn.z > 0.5) { vec4 l = texture(tex3, vUv3); base.rgb = mix(base.rgb, l.rgb, clamp(l.a * vWeights.w, 0.0, 1.0)); }
        base.a = 1.0;
      }
      if (dirtDecal && useTexture) base = vec4(vColor, dot(base.rgb, dirtMask));
      if (cutout && alpha >= 1.0 && base.a < 0.35) discard;   // cut-outs (leaves, fences, hair)
      // Without normals in the mesh, the face's own normal.
      vec3 n = hasNormal ? normalize(vNormal) : normalize(cross(dFdx(vPosition), dFdy(vPosition)));
      // Both sides lit: the normal turned to the camera, then bent by the normal map.
      if (dot(n, eyeAt - vPosition) < 0.0) n = -n;
      if (useNormalMap && useTexture) n = bumped(n, vPosition, vUv);
      // The light from around, dimmed on terrain by the vertex colour (red by day; hollows and the foot of
      // rocks darker), as the game's gta_terrain_va_*lyr shaders pass it on to the lighting; then the light
      // from the side.
      float around = layers > 1 ? vColor.r : 1.0;
      // With a cutscene's location there is no light from the camera: the map by its baked light and its
      // lamps, the actors by a little light round about and the cutscene's lights.
      float shade = baked ? vColor.r * BakedLight
                  : grade ? ActorAround
                  : 0.35 * around + 0.65 * max(dot(n, light), 0.0);
      // Outside: the light from around (from above on what faces up, from below on what faces down) and the
      // sun, on the map dimmed by the light baked into it (its red: how open to the sky a point is).
      vec3 outside = mix(ambientBelow, ambientAbove, n.z * 0.5 + 0.5) + sunColor * max(dot(n, sunDir), 0.0);
      if (outdoor) outside *= baked ? vColor.r : 1.0;
      // A cutscene's lights on top: fading to nothing at their range, inside a spot's cone (soft at its edge).
      // The view's own light dimmed while they are on, so they show (in the game they are much of the light).
      vec3 lit = outdoor ? outside : vec3(sceneLights > 0 && !baked && !grade ? shade * 0.6 : shade);
      for (int i = 0; i < 40; i++) {
        if (i >= sceneLights) break;
        // A cutscene's light in another room than this: not here.
        float marked = sceneLightColor[i].w;
        if (marked < 0.0 && int(-marked + 0.5) - 2 != meshRoom) continue;
        vec3 l = sceneLightAt[i].xyz - vPosition;
        float range = sceneLightAt[i].w;
        float d = length(l);
        if (d >= range || d < 1e-4) continue;
        l /= d;
        // As the game's deferred_lighting.fxc lights a point or spot light: a = saturate(1 - d²/r²),
        // (a⁴ - 0.1) / 0.9 (bright near it, steeply to nothing towards its radius); a lamp's spot from its
        // outer angle to its inner one, saturate((cos - cos outer) × scale); a cutscene's spot (no inner
        // angle known) softly at its edge.
        float a = clamp(1.0 - (d * d) / (range * range), 0.0, 1.0);
        float reach = max((a * a * a * a - 0.1) / 0.9, 0.0);
        float spot = 1.0;
        float cone = sceneLightDir[i].w;
        if (cone > -1.0) {
          float c = dot(-l, sceneLightDir[i].xyz);
          float scale = sceneLightColor[i].w;
          spot = scale < 0.0 ? smoothstep(cone, mix(cone, 1.0, 0.25), c) : clamp((c - cone) * scale, 0.0, 1.0);
        }
        lit += sceneLightColor[i].rgb * reach * spot * max(dot(n, l), 0.0);
      }
      // The shine, where the surface faces half way between the light and the camera: how bright from the
      // specular map's channels in specMask, how sharp from its alpha, as gta_spec does.
      float shine = 0.0;
      // Not with a cutscene's location: the shine would be the camera's light's (Bernie's back wall, shiny,
      // facing the camera, glared at the same brightness whatever lit it).
      if (specPower > 0.0 && specIntensity > 0.0 && !grade && !outdoor) {
        vec4 spec = useSpecMap && useTexture ? texture(specTex, vUv) : vec4(1.0);
        float where = useSpecMap && useTexture ? dot(spec.rgb, specMask) : 1.0;
        shine = pow(max(dot(n, normalize(light + toEye)), 0.0), max(specPower * spec.a, 1.0)) * specIntensity * where;
      }
      float a = alpha < 1.0 ? alpha : 1.0;
      if (textureAlpha) {
        a = base.a * vAlpha;
        if (a < 0.01) discard;
      }
      vec3 rgb = emissive ? base.rgb : base.rgb * lit + shine;
      if (outdoor) {
        // As bright as the game's picture: the light's values (up to about 3) brought down softly.
        rgb = 1.0 - exp(-rgb);
        if (water) {
          // The water: its own colour seen from above, the sky's towards the horizon.
          float facing = abs(dot(normalize(eyeAt - vPosition), n));
          rgb = mix(waterColor, skyColor, 0.3 + 0.7 * pow(1.0 - facing, 3.0));
          a = 0.92;
        }
        // The haze: from where the fog starts to how far is drawn, towards the sky's colour at the horizon.
        float far = clamp((length(eyeAt - vPosition) - hazeStart) / max(hazeEnd - hazeStart, 1.0), 0.0, 1.0);
        rgb = mix(rgb, hazeColor, pow(far, 0.6) * 0.9);
      }
      else if (grade) {
        float grey = dot(rgb, vec3(0.299, 0.587, 0.114));
        rgb = mix(vec3(grey), rgb, 0.7) * vec3(1.06, 1.0, 0.9);
      }
      outColor = vec4(rgb * a, a);
    }`;

  let program, loc;
  if (gl) {
    program = createProgram(VERTEX, FRAGMENT);
    loc = {
      position: gl.getAttribLocation(program, "position"),
      normal: gl.getAttribLocation(program, "normal"),
      uv: gl.getAttribLocation(program, "uv"),
      skinBones: gl.getAttribLocation(program, "skinBones"),
      skinWeights: gl.getAttribLocation(program, "skinWeights"),
      skinned: gl.getUniformLocation(program, "skinned"),
      boneMatrices: gl.getUniformLocation(program, "boneMatrices"),
      viewProjection: gl.getUniformLocation(program, "viewProjection"),
      tex: gl.getUniformLocation(program, "tex"),
      useTexture: gl.getUniformLocation(program, "useTexture"),
      hasNormal: gl.getUniformLocation(program, "hasNormal"),
      color: gl.getUniformLocation(program, "color"),
      light: gl.getUniformLocation(program, "light"),
      toEye: gl.getUniformLocation(program, "toEye"),
      alpha: gl.getUniformLocation(program, "alpha"),
      lines: gl.getUniformLocation(program, "lines"),
      cutout: gl.getUniformLocation(program, "cutout"),
      uvAnim: gl.getUniformLocation(program, "uvAnim"),
      uvRow0: gl.getUniformLocation(program, "uvRow0"),
      uvRow1: gl.getUniformLocation(program, "uvRow1"),
      layerUvA: gl.getAttribLocation(program, "layerUvA"),
      layerUvB: gl.getAttribLocation(program, "layerUvB"),
      layerWeights: gl.getAttribLocation(program, "layerWeights"),
      vertexColor: gl.getAttribLocation(program, "vertexColor"),
      vertexAlpha: gl.getAttribLocation(program, "vertexAlpha"),
      layers: gl.getUniformLocation(program, "layers"),
      tex1: gl.getUniformLocation(program, "tex1"),
      tex2: gl.getUniformLocation(program, "tex2"),
      tex3: gl.getUniformLocation(program, "tex3"),
      layerOn: gl.getUniformLocation(program, "layerOn"),
      outdoor: gl.getUniformLocation(program, "outdoor"),
      sunDir: gl.getUniformLocation(program, "sunDir"),
      sunColor: gl.getUniformLocation(program, "sunColor"),
      ambientAbove: gl.getUniformLocation(program, "ambientAbove"),
      ambientBelow: gl.getUniformLocation(program, "ambientBelow"),
      hazeColor: gl.getUniformLocation(program, "hazeColor"),
      hazeStart: gl.getUniformLocation(program, "hazeStart"),
      hazeEnd: gl.getUniformLocation(program, "hazeEnd"),
      water: gl.getUniformLocation(program, "water"),
      waterColor: gl.getUniformLocation(program, "waterColor"),
      skyColor: gl.getUniformLocation(program, "skyColor"),
      textureAlpha: gl.getUniformLocation(program, "textureAlpha"),
      dirtDecal: gl.getUniformLocation(program, "dirtDecal"),
      baked: gl.getUniformLocation(program, "baked"),
      grade: gl.getUniformLocation(program, "grade"),
      dirtMask: gl.getUniformLocation(program, "dirtMask"),
      sceneLights: gl.getUniformLocation(program, "sceneLights"),
      sceneLightAt: gl.getUniformLocation(program, "sceneLightAt"),
      sceneLightDir: gl.getUniformLocation(program, "sceneLightDir"),
      sceneLightColor: gl.getUniformLocation(program, "sceneLightColor"),
      emissive: gl.getUniformLocation(program, "emissive"),
      eyeAt: gl.getUniformLocation(program, "eyeAt"),
      marker: gl.getUniformLocation(program, "marker"),
      markerAt: gl.getUniformLocation(program, "markerAt"),
      markerScale: gl.getUniformLocation(program, "markerScale"),
      useNormalMap: gl.getUniformLocation(program, "useNormalMap"),
      normalTex: gl.getUniformLocation(program, "normalTex"),
      bumpiness: gl.getUniformLocation(program, "bumpiness"),
      useSpecMap: gl.getUniformLocation(program, "useSpecMap"),
      specTex: gl.getUniformLocation(program, "specTex"),
      specMask: gl.getUniformLocation(program, "specMask"),
      specPower: gl.getUniformLocation(program, "specPower"),
      specIntensity: gl.getUniformLocation(program, "specIntensity"),
      meshRoom: gl.getUniformLocation(program, "meshRoom"),
    };
  }

  function createProgram(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // --- Scene from SparkIV ---

  function bytes(base64) {
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function buffer(target, data) {
    const b = gl.createBuffer();
    gl.bindBuffer(target, b);
    gl.bufferData(target, data, gl.STATIC_DRAW);
    return b;
  }

  // Bones and weights of a skinned mesh, for the vertex array bound now (both the solid and the wire one).
  function bindSkin(skin) {
    for (const [attribute, data] of [[loc.skinBones, skin && skin.bones], [loc.skinWeights, skin && skin.weights]]) {
      if (attribute < 0) continue;
      if (data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, data);
        gl.enableVertexAttribArray(attribute);
        gl.vertexAttribPointer(attribute, 4, gl.FLOAT, false, 0, 0);
      } else {
        gl.disableVertexAttribArray(attribute);
        gl.vertexAttrib4f(attribute, 0, 0, 0, 0);
      }
    }
  }

  function addMesh(m) {
    const positions = new Float32Array(bytes(m.positions).buffer);
    const indices = new Uint16Array(bytes(m.indices).buffer);
    const skin = m.skinBones && m.skinWeights
      ? { bones: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinBones).buffer)), weights: buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.skinWeights).buffer)) }
      : null;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    if (m.normals) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.normals).buffer)));
      gl.enableVertexAttribArray(loc.normal);
      gl.vertexAttribPointer(loc.normal, 3, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.normal);
      gl.vertexAttrib3f(loc.normal, 0, 0, 1);
    }
    if (m.uvs) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.uvs).buffer)));
      gl.enableVertexAttribArray(loc.uv);
      gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(loc.uv);
      gl.vertexAttrib2f(loc.uv, 0, 0);
    }
    // Terrain's layers: their coordinates (6 floats a vertex: layer 1, 2, 3), cover and the vertex colour.
    const layerData = m.layerUvs && m.layerWeights && m.colors;
    const attribute = (location, size, data, stride, offset) => {
      if (location < 0) return;
      if (data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, data);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, size, gl.FLOAT, false, stride, offset);
      } else {
        gl.disableVertexAttribArray(location);
      }
    };
    const layerUvs = layerData ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.layerUvs).buffer)) : null;
    attribute(loc.layerUvA, 4, layerUvs, 24, 0);
    attribute(loc.layerUvB, 2, layerUvs, 24, 16);
    attribute(loc.layerWeights, 4, layerData ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.layerWeights).buffer)) : null, 0, 0);
    attribute(loc.vertexColor, 3, m.colors ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.colors).buffer)) : null, 0, 0);
    // Without its own, every vertex shows fully (the value is set before each draw: it isn't kept in the VAO).
    attribute(loc.vertexAlpha, 1, m.alphas ? buffer(gl.ARRAY_BUFFER, new Float32Array(bytes(m.alphas).buffer)) : null, 0, 0);
    buffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    gl.bindVertexArray(null);

    // The edges for the wire frame, each once.
    const seen = new Set(), edges = [];
    for (let i = 0; i + 2 < indices.length; i += 3) {
      for (const [a, b] of [[indices[i], indices[i + 1]], [indices[i + 1], indices[i + 2]], [indices[i + 2], indices[i]]]) {
        const key = a < b ? a * 65536 + b : b * 65536 + a;
        if (!seen.has(key)) { seen.add(key); edges.push(a, b); }
      }
    }
    const lines = gl.createVertexArray();
    gl.bindVertexArray(lines);
    bindSkin(skin);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, positions));
    gl.enableVertexAttribArray(loc.position);
    gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
    buffer(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(edges));
    gl.bindVertexArray(null);

    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < positions.length; i += 3) {
      for (let k = 0; k < 3; k++) {
        min[k] = Math.min(min[k], positions[i + k]);
        max[k] = Math.max(max[k], positions[i + k]);
      }
    }
    // How far a cutscene's location reaches from the scene's origin: the far plane stays beyond it.
    if (m.background) backgroundReach = Math.max(backgroundReach, ...[0, 1, 2].map(k => Math.max(Math.abs(min[k]), Math.abs(max[k]))).map(v => v * 1.8));
    // actor: which of a cutscene's cast it belongs to (0: the one model or ped shown otherwise);
    // background: around a cutscene (its location), not looked at when fitting. A cutscene's props (a door)
    // are lit as its location is (baked: no light of the camera, a middling light round about where they have
    // none of their own).
    meshes.set(m.id, { vao, count: indices.length, lines, lineCount: edges.length, material: m.material, hasNormal: !!m.normals, skinned: !!skin, layered: !!layerData, hasAlpha: !!m.alphas, min, max, positions, indices, actor: m.actor || 0, background: m.background === true, baked: m.background === true || (!!m.actor && m.ped === false), hasColors: !!m.colors, room: typeof m.room === "number" ? m.room : -1 });
  }

  function addMaterial(m) {
    // Without a texture: a quiet colour of its own, so the parts can be told apart.
    const hue = (m.id * 0.618) % 1;
    // Cut out where the texture is see-through, unless its alpha means something else (peds: gloss).
    // Terrain: the textures of the layers laid over the first (null until loaded, or if not found).
    const layerCount = 1 + (m.layers ? m.layers.length : 0);
    // How it is drawn, from its draw bucket: opaque, cut out, see-through by its texture (blend), lying on
    // another surface (decal), or not at all (a vehicle's no-water planes).
    const material = {
      texture: null, glass: m.glass, water: m.water === true, cutout: m.cutout === true, blend: m.blend === true, decal: m.decal === true, hidden: m.hidden === true,
      color: m.color || hsl(hue, 0.25, 0.62), layerCount, layers: [null, null, null],
      // Bumps and shine.
      normal: null, specular: null, bumpiness: m.bumpiness ?? 1,
      specularPower: m.specularPower || 0, specularIntensity: m.specularIntensity || 0, specularMask: m.specularMask || [1, 0, 0],
      dirtMask: m.dirtMask || null, emissive: m.emissive === true,
    };
    materials.set(m.id, material);
    if (m.texture) loadTexture(m.texture, t => material.texture = t);
    if (m.normal) loadTexture(m.normal, t => material.normal = t);
    if (m.specular) loadTexture(m.specular, t => material.specular = t);
    (m.layers || []).forEach((url, i) => { if (url && i < 3) loadTexture(url, t => material.layers[i] = t); });
  }

  const anisotropic = gl && gl.getExtension("EXT_texture_filter_anisotropic");
  const maxAnisotropy = anisotropic ? Math.min(16, gl.getParameter(anisotropic.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;

  // DXT textures as they are (WebGL's S3TC extension, on Windows always there): a cutscene's location
  // sends its textures as the game has them ("SXT1", see ModelScene.Raw), not as PNG.
  const s3tc = gl && gl.getExtension("WEBGL_compressed_texture_s3tc");

  function loadTexture(url, done) {
    texturesLoading++;
    fetch(url)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(async buffer => {
        const head = new Uint8Array(buffer, 0, Math.min(4, buffer.byteLength));
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        let mipmaps = true;
        if (head.length === 4 && head[0] === 83 && head[1] === 88 && head[2] === 84 && head[3] === 49) {
          mipmaps = uploadRaw(buffer);
        } else {
          const image = await createImageBitmap(new Blob([buffer]), { premultiplyAlpha: "none", colorSpaceConversion: "none" });
          gl.bindTexture(gl.TEXTURE_2D, t);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
          gl.generateMipmap(gl.TEXTURE_2D);
          image.close();
        }
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mipmaps ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        // Sharp also when seen at a slant (ground, walls towards the horizon), as far as the card allows.
        if (anisotropic) gl.texParameterf(gl.TEXTURE_2D, anisotropic.TEXTURE_MAX_ANISOTROPY_EXT, maxAnisotropy);
        done(t);
        draw();
      })
      .catch(() => {})
      .finally(textureDone);
  }

  // A texture as the game has it into the bound texture: its levels as far as the data holds them (each
  // level's size in 4x4 blocks: 8 bytes each for DXT1, 16 for DXT3 and 5). DXT straight to the card (or,
  // without the extension, decoded here); A8R8G8B8 (bytes B G R A) and L8 as RGBA. Whether it has mipmaps.
  function uploadRaw(buffer) {
    const v = new DataView(buffer);
    const format = v.getUint32(4, true), width = v.getUint32(8, true), height = v.getUint32(12, true);
    const levels = Math.max(1, v.getUint32(16, true));
    const data = new Uint8Array(buffer, 20);
    const dxt = format <= 2;
    const blockBytes = format === 0 ? 8 : 16;
    const glFormat = s3tc && [s3tc.COMPRESSED_RGBA_S3TC_DXT1_EXT, s3tc.COMPRESSED_RGBA_S3TC_DXT3_EXT, s3tc.COMPRESSED_RGBA_S3TC_DXT5_EXT][format];
    let offset = 0, done = 0;
    for (let level = 0; level < levels; level++) {
      const w = Math.max(1, width >> level), h = Math.max(1, height >> level);
      const size = dxt ? Math.ceil(w / 4) * Math.ceil(h / 4) * blockBytes : w * h * (format === 3 ? 4 : 1);
      if (offset + size > data.length) break;
      const bytes = data.subarray(offset, offset + size);
      offset += size;
      if (dxt && glFormat) gl.compressedTexImage2D(gl.TEXTURE_2D, level, glFormat, w, h, 0, bytes);
      else gl.texImage2D(gl.TEXTURE_2D, level, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, dxt ? decodeDxt(bytes, w, h, format) : toRgba(bytes, w * h, format));
      done++;
    }
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_LEVEL, Math.max(0, done - 1));
    return done > 1;
  }

  function toRgba(bytes, pixels, format) {
    const out = new Uint8Array(pixels * 4);
    for (let i = 0; i < pixels; i++) {
      if (format === 3) { out[i * 4] = bytes[i * 4 + 2]; out[i * 4 + 1] = bytes[i * 4 + 1]; out[i * 4 + 2] = bytes[i * 4]; out[i * 4 + 3] = bytes[i * 4 + 3]; }
      else { out[i * 4] = out[i * 4 + 1] = out[i * 4 + 2] = bytes[i]; out[i * 4 + 3] = 255; }
    }
    return out;
  }

  // DXT1, 3 and 5 decoded to RGBA (only where the card's extension is missing).
  function decodeDxt(bytes, w, h, format) {
    const out = new Uint8Array(w * h * 4);
    const bw = Math.ceil(w / 4), bh = Math.ceil(h / 4), blockBytes = format === 0 ? 8 : 16;
    const c = (v, i) => [((v >> 11) & 31) * 255 / 31, ((v >> 5) & 63) * 255 / 63, (v & 31) * 255 / 31][i];
    for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
      const o = (by * bw + bx) * blockBytes, co = format === 0 ? o : o + 8;
      const c0 = bytes[co] | bytes[co + 1] << 8, c1 = bytes[co + 2] | bytes[co + 3] << 8;
      const cols = [0, 1, 2, 3].map(k => [0, 1, 2].map(i => {
        const a = c(c0, i), b = c(c1, i);
        if (k === 0) return a; if (k === 1) return b;
        if (c0 > c1 || format !== 0) return k === 2 ? (2 * a + b) / 3 : (a + 2 * b) / 3;
        return k === 2 ? (a + b) / 2 : 0;
      }));
      const alphas = [];
      if (format === 2) {
        const a0 = bytes[o], a1 = bytes[o + 1];
        for (let k = 0; k < 8; k++) alphas[k] = k === 0 ? a0 : k === 1 ? a1 : a0 > a1 ? ((8 - k) * a0 + (k - 1) * a1) / 7 : k === 6 ? 0 : k === 7 ? 255 : ((6 - k) * a0 + (k - 1) * a1) / 5;
      }
      for (let p = 0; p < 16; p++) {
        const x = bx * 4 + (p & 3), y = by * 4 + (p >> 2);
        if (x >= w || y >= h) continue;
        const k = (bytes[co + 4 + (p >> 2)] >> ((p & 3) * 2)) & 3;
        let alpha = 255;
        if (format === 0) alpha = c0 <= c1 && k === 3 ? 0 : 255;
        else if (format === 1) alpha = ((bytes[o + (p >> 1)] >> ((p & 1) * 4)) & 15) * 17;
        else { const bit = p * 3, idx = Number((BigInt(bytes[o + 2] | bytes[o + 3] << 8 | bytes[o + 4] << 16) | BigInt(bytes[o + 5] | bytes[o + 6] << 8 | bytes[o + 7] << 16) << 24n) >> BigInt(bit) & 7n); alpha = alphas[idx]; }
        const q = (y * w + x) * 4;
        out[q] = cols[k][0]; out[q + 1] = cols[k][1]; out[q + 2] = cols[k][2]; out[q + 3] = alpha;
      }
    }
    return out;
  }

  // Textures still on their way; when the last has come (or failed), SparkIV hears "loaded" (it shows a
  // spinner until then).
  let texturesLoading = 0;
  function textureDone() {
    if (--texturesLoading === 0) post({ type: "loaded" });
  }

  function hsl(h, s, l) {
    const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0), f(8), f(4)];
  }

  // A marker for each light, as lines: an omni light a small diamond; a spot a small dot (a tiny cross)
  // and its cone, showing which way and how wide it shines (not how far: et_pierlight05's spots reach 20
  // to 30 m from lamps 0.7 m big). Different, so a spot with an omni light beside it (each of the club
  // rig's lamps: 4 to 14 cm apart) shows both even from afar, a diamond at the cone's tip. Made round the
  // origin, the diamond 2 across; drawn at the light, the same size on screen however near the camera is
  // (MarkerSize of its distance), so they neither hide a lamp nor vanish on a block.
  const MarkerSize = 0.012;
  function setLights(list) {
    const size = 1;
    lights = list.map(l => {
      const [x, y, z] = [0, 0, 0];
      const lines = [];
      if (!l.spot) {
        const corners = [[size, 0, 0], [-size, 0, 0], [0, size, 0], [0, -size, 0], [0, 0, size], [0, 0, -size]];
        // The diamond: each of the four side corners to top and bottom, and round the middle.
        for (const [a, b] of [[0, 4], [1, 4], [2, 4], [3, 4], [0, 5], [1, 5], [2, 5], [3, 5], [0, 2], [2, 1], [1, 3], [3, 0]]) {
          lines.push(x + corners[a][0], y + corners[a][1], z + corners[a][2], x + corners[b][0], y + corners[b][1], z + corners[b][2]);
        }
      } else {
        // The dot: three short lines across each other.
        const dot = size * 0.35;
        lines.push(-dot, 0, 0, dot, 0, 0, 0, -dot, 0, 0, dot, 0, 0, 0, -dot, 0, 0, dot);
      }
      if (l.spot) {
        const d = norm(l.direction);
        const length = size * 5;
        // Two axes across the direction, for the rim.
        const side = norm(cross(d, Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
        const up = cross(side, d);
        const half = Math.max(1, Math.min(89, l.falloff || 30)) * Math.PI / 180;
        const r = Math.tan(half) * length;
        const end = [x + d[0] * length, y + d[1] * length, z + d[2] * length];
        const rim = [];
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
          rim.push([end[0] + side[0] * c + up[0] * s, end[1] + side[1] * c + up[1] * s, end[2] + side[2] * c + up[2] * s]);
        }
        lines.push(x, y, z, ...end);
        for (let i = 0; i < 12; i++) {
          lines.push(...rim[i], ...rim[(i + 1) % 12]);
          if (i % 3 === 0) lines.push(x, y, z, ...rim[i]);
        }
      }

      gl.bindVertexArray(vao);
      bindSkin(null);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer(gl.ARRAY_BUFFER, new Float32Array(lines)));
      gl.enableVertexAttribArray(loc.position);
      gl.vertexAttribPointer(loc.position, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      // A light that is black (some are) still shows, grey.
      const color = l.color.some(c => c > 0.05) ? l.color : [0.6, 0.6, 0.6];
      return { vao, count: lines.length / 3, color, meshes: l.meshes, position: l.position };
    });
    findSpots();
    draw();
  }

  // --- Spots: the places of a model whose parts lie far apart (et_pierlight05: seven lamps along 132 m
  // of pier), to go through one after the other ---
  //
  // The triangles shown are put on a grid of cells a 40th of the model across (each into the cells of its
  // box: a wall's few vertices alone would leave the cells between them empty); cells touching each other
  // (also corner to corner) are one spot. A light joins the spot it is at, or is a spot of its own (a
  // light rig: one tiny triangle, its lights metres away). Offered only when the spots are small beside
  // the model (lamps along a pier; not three blocks of a building) and there are 2 to 80.
  let spots = [];
  let spotIndex = -1;

  function findSpots() {
    spots = [];
    spotIndex = -1;
    const shownLights = showLights ? lights.filter(l => l.meshes.some(id => visible.has(id))) : [];
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    let vertices = 0;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      vertices += m.positions.length / 3;
      for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], m.min[k]); max[k] = Math.max(max[k], m.max[k]); }
    }
    for (const l of shownLights) for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], l.position[k]); max[k] = Math.max(max[k], l.position[k]); }
    if (min[0] === Infinity) { reportSpot(); return; }
    const cell = Math.max(1e-3, Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 40);
    const key = (x, y, z) => x + "," + y + "," + z;
    // Each cell's box (the part of the triangles' boxes in it); very large models are sampled (every n-th
    // triangle), which still finds the parts.
    const cells = new Map();
    const index = c => Math.min(39, Math.max(0, Math.floor(c)));
    let triangles = 0;
    for (const id of visible) { const m = meshes.get(id); if (m) triangles += m.indices.length / 3; }
    const stride = Math.max(1, Math.floor(triangles / 200000)) * 3;
    for (const id of visible) {
      const m = meshes.get(id);
      if (!m) continue;
      const p = m.positions, t = m.indices;
      for (let i = 0; i + 2 < t.length; i += stride) {
        const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
        for (let v = 0; v < 3; v++) for (let a = 0; a < 3; a++) {
          const value = p[t[i + v] * 3 + a];
          lo[a] = Math.min(lo[a], value); hi[a] = Math.max(hi[a], value);
        }
        const from = lo.map((v, a) => index((v - min[a]) / cell)), to = hi.map((v, a) => index((v - min[a]) / cell));
        for (let ix = from[0]; ix <= to[0]; ix++) for (let iy = from[1]; iy <= to[1]; iy++) for (let iz = from[2]; iz <= to[2]; iz++) {
          const k = key(ix, iy, iz);
          const cellLo = [min[0] + ix * cell, min[1] + iy * cell, min[2] + iz * cell];
          const partLo = lo.map((v, a) => Math.max(v, cellLo[a])), partHi = hi.map((v, a) => Math.min(v, cellLo[a] + cell));
          let c = cells.get(k);
          if (!c) cells.set(k, c = { ix, iy, iz, min: partLo, max: partHi, spot: -1 });
          else for (let a = 0; a < 3; a++) { c.min[a] = Math.min(c.min[a], partLo[a]); c.max[a] = Math.max(c.max[a], partHi[a]); }
        }
      }
    }
    // Touching cells into spots.
    const found = [];
    for (const start of cells.values()) {
      if (start.spot >= 0) continue;
      const spot = { min: start.min.slice(), max: start.max.slice() };
      start.spot = found.length;
      const queue = [start];
      while (queue.length) {
        const c = queue.pop();
        for (let a = 0; a < 3; a++) { spot.min[a] = Math.min(spot.min[a], c.min[a]); spot.max[a] = Math.max(spot.max[a], c.max[a]); }
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
          const n = cells.get(key(c.ix + dx, c.iy + dy, c.iz + dz));
          if (n && n.spot < 0) { n.spot = found.length; queue.push(n); }
        }
      }
      found.push(spot);
      if (found.length > 80) { reportSpot(); return; }
    }
    // Lights to the spot they are at, else a spot of their own.
    for (const l of shownLights) {
      const near = found.find(s => [0, 1, 2].every(a => l.position[a] >= s.min[a] - cell && l.position[a] <= s.max[a] + cell));
      if (near) {
        for (let a = 0; a < 3; a++) { near.min[a] = Math.min(near.min[a], l.position[a]); near.max[a] = Math.max(near.max[a], l.position[a]); }
      } else {
        found.push({ min: l.position.map(v => v - cell / 2), max: l.position.map(v => v + cell / 2) });
      }
    }
    // Small beside the model: the middle spot (by size) under a fifth of the model across.
    const across = s => Math.hypot(s.max[0] - s.min[0], s.max[1] - s.min[1], s.max[2] - s.min[2]);
    const sizes = found.map(across).sort((a, b) => a - b);
    const small = sizes.length > 0 && sizes[Math.floor(sizes.length / 2)] < cell * 40 / 5;
    if (found.length >= 2 && found.length <= 80 && small) {
      // In order along the model's longest side, then across it.
      const long = [0, 1, 2].sort((a, b) => (max[b] - min[b]) - (max[a] - min[a]));
      const centre = s => s.min.map((v, a) => (v + s.max[a]) / 2);
      spots = found.sort((p, q) => {
        const a = centre(p), b = centre(q);
        return Math.abs(a[long[0]] - b[long[0]]) > cell ? a[long[0]] - b[long[0]] : a[long[1]] - b[long[1]];
      });
    }
    reportSpot();
  }

  function reportSpot() { post({ type: "spot", index: spotIndex, count: spots.length }); }

  // To the next (+1) or previous (-1) spot: looked at from where the camera looks now, filling the view.
  function goToSpot(step) {
    if (!spots.length) return;
    spotIndex = spotIndex < 0 ? (step > 0 ? 0 : spots.length - 1) : (spotIndex + step + spots.length) % spots.length;
    const s = spots[spotIndex];
    camera.target = s.min.map((v, a) => (v + s.max[a]) / 2);
    camera.distance = fitDistance(s.min, s.max, true);
    reportSpot();
    draw();
  }

  // The same meshes with new textures (one was replaced): the old textures go, the new ones are loaded.
  function setMaterials(list) {
    for (const material of materials.values()) {
      for (const t of [material.texture, material.normal, material.specular, ...material.layers]) if (t) gl.deleteTexture(t);
    }
    materials.clear();
    for (const m of list) addMaterial(m);
    draw();
  }

  function setScene(scene) {
    for (const m of scene.materials) addMaterial(m);
    for (const m of scene.meshes) addMesh(m);
    message.textContent = scene.meshes.length ? "" : "This model has no meshes.";
    if (texturesLoading === 0) post({ type: "loaded" });
  }

  // --- Skeleton and animation (peds) ---
  //
  // A bone's place relative to its parent: translate by its offset, turn by its quaternion; down the
  // chain world = parent * local (column vectors). A vertex moves with world * inverse(rest world).
  // Checked against OpenIV's .skel: the rest pose built so is the bones' WorldOffset.

  let skeleton = null;      // { parent[], position[] (3 per bone), rotation[] (4 per bone), inverseRest[] (mat4) }
  let clip = null;          // { frames, fps, tracks: [{ bone, kind: "position"|"rotation", values }], mover, facials }
  // Moving through the world (the clip's model tracks): the camera follows, a grid on the ground shows it.
  let moveInWorld = false;
  // Facial clips started by the clip, playing on the face's bones.
  let showFacials = true;
  let lastMover = null;
  let boneTexture = null;
  const playback = { playing: false, time: 0, speed: 1, loop: true, last: 0, reportedFrame: -1 };

  function mat4FromQuat(q, t) {
    const [x, y, z, w] = q;
